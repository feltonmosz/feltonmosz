<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorun guard — Apollo prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Autorun guard</span></div><div class="wrap"><section class="hero"><h1>Autorun guard</h1><p>A settings change silently re-ran everything. Apollo can lock autorun behind a cost confirmation.</p></section><section class="panel"><h2>Properties</h2><label>Change type</label><button type="button" class="sheetbtn" data-target="chg">Dedupe setting</button><input type="hidden" id="chg" value="dedupe"><div class="sheet" data-sheet="chg"><h3>Change type</h3><button data-v="dedupe" class="selected">Dedupe setting</button><button data-v="filter" class="">Filter change</button><button data-v="prompt" class="">AI prompt change</button></div><label>Affected rows<input id="rows" type="number" value="1200"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${chg.value} affects ${rows.value} rows. Apollo pauses autorun and asks: run now, run sample, or cancel.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
