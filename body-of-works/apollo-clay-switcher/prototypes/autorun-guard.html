<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorun guard — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6l16 6v14c0 12-7 20-16 24C21 46 14 38 14 26V12z" fill="none" stroke="#111" stroke-width="3"/><path d="M22 27l6 6 11-12" stroke="#111" stroke-width="3" fill="none"/></svg></div><p class="eyebrow">PROTOTYPE</p><h1>Autorun guard</h1><p class="desc">A settings change silently re-ran everything. Apollo can lock autorun behind a cost confirmation.</p><section class="panel"><h2>Try it</h2><label>Change type</label><button type="button" class="sheetbtn" data-target="chg">Dedupe setting</button><input type="hidden" id="chg" value="dedupe"><div class="sheet" data-sheet="chg"><h3>Change type</h3><button data-v="dedupe" class="selected">Dedupe setting</button><button data-v="filter" class="">Filter change</button><button data-v="prompt" class="">AI prompt change</button></div><label>Affected rows<input id="rows" type="number" value="1200"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${chg.value} affects ${rows.value} rows. Apollo pauses autorun and asks: run now, run sample, or cancel.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
