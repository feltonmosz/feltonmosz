<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing forecast — Apollo prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Pricing forecast</span></div><div class="wrap"><section class="hero"><h1>Pricing forecast</h1><p>Clay raised entry prices and buyers could not forecast the bill. Apollo publishes per-seat pricing buyers can model.</p></section><section class="panel"><h2>Properties</h2><label>Plan</label><button type="button" class="sheetbtn" data-target="plan">Basic $49/seat</button><input type="hidden" id="plan" value="49"><div class="sheet" data-sheet="plan"><h3>Plan</h3><button data-v="49" class="selected">Basic $49/seat</button><button data-v="79" class="">Professional $79/seat</button><button data-v="119" class="">Organization $119/seat</button></div><label>Seats<input id="seats" type="number" value="5"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${seats.value} seats: $${seats.value*plan.value}/month, forecast before signup. No credit surprise.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
