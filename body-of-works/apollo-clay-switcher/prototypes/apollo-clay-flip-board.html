<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apollo vs Clay flip board</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Flip board</span></div><div class="wrap"><section class="hero"><h1>Apollo vs Clay flip board</h1><p>Plain why for each switcher pain, with the Apollo fix that flips it.</p></section><section class="panel"><h2>Properties</h2><label>Pain</label><button type="button" class="sheetbtn" data-target="pain">Credit burn</button><input type="hidden" id="pain" value="credits"><div class="sheet" data-sheet="pain"><h3>Pain</h3><button data-v="credits" class="selected">Credit burn</button><button data-v="support" class="">Silent support</button><button data-v="complexity" class="">Complexity tax</button><button data-v="billing" class="">Billing trust</button><button data-v="reliability" class="">Reliability</button></div><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){const d={credits:"Clay burns credits on misfires. Apollo flip: forecast before Run.",support:"Clay support goes silent. Apollo flip: human billing lane with a clock.",complexity:"Clay needs paid training. Apollo flip: one-login finder.",billing:"Clay charges confuse. Apollo flip: plan state and one-screen cancel.",reliability:"Clay logged 47 incidents. Apollo flip: public reliability board."};out.textContent=d[pain.value]}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
