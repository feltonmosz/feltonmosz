<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit forecast before you run — Apollo prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Credit forecast before you run</span></div><div class="wrap"><section class="hero"><h1>Credit forecast before you run</h1><p>Clay users burned $1,000 when a dedupe change re-ran a workbook. Apollo can forecast credit burn before any run starts.</p></section><section class="panel"><h2>Properties</h2><label>Workflow type</label><button type="button" class="sheetbtn" data-target="wf">Enrichment run</button><input type="hidden" id="wf" value="enrichment"><div class="sheet" data-sheet="wf"><h3>Workflow type</h3><button data-v="enrichment" class="selected">Enrichment run</button><button data-v="sequence" class="">Sequence send</button><button data-v="export" class="">CSV export</button></div><label>Contacts<input id="contacts" type="number" value="500"></label><label>Credits per contact<input id="cpc" type="number" value="1"></label><div class="meter"><i id="bar" style="width:40%"></i></div><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){const b=contacts.value*cpc.value;bar.style.width=Math.min(100,b/10)+"%";out.textContent=`${wf.value}: forecast ${b} credits\nApollo shows this before Run. No surprise burn.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
