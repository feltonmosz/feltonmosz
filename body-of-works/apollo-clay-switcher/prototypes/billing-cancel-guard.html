<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing cancel guard — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"></div><p class="eyebrow">PROTOTYPE</p><h1>Billing cancel guard</h1><p class="desc">A Clay user was charged for months on a free plan and could not cancel. Apollo can make plan state and cancel one screen.</p><section class="panel"><h2>Try it</h2><label>Plan state</label><button type="button" class="sheetbtn" data-target="plan">Free</button><input type="hidden" id="plan" value="free"><div class="sheet" data-sheet="plan"><h3>Plan state</h3><button data-v="free" class="selected">Free</button><button data-v="basic" class="">Basic $49</button><button data-v="pro" class="">Professional $79</button></div><label>Months charged<input id="months" type="number" value="3"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=plan.value==="free"&&months.value>0?`Warning: free plan with ${months.value} months charged. Apollo flags refund review and stops billing.`:`Plan ${plan.value}: billing state clear, one-screen cancel available.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
