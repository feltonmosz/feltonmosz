<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support that answers — Apollo prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Support that answers</span></div><div class="wrap"><section class="hero"><h1>Support that answers</h1><p>A $350/mo Clay customer was told to ask an LLM. Apollo can route billing-impact bugs to a human with a clock.</p></section><section class="panel"><h2>Properties</h2><label>Issue type</label><button type="button" class="sheetbtn" data-target="issue">Billing / credits</button><input type="hidden" id="issue" value="billing"><div class="sheet" data-sheet="issue"><h3>Issue type</h3><button data-v="billing" class="selected">Billing / credits</button><button data-v="bug" class="">Product bug</button><button data-v="howto" class="">How-to question</button></div><label>Monthly spend $<input id="spend" type="number" value="350"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=issue.value==="billing"?`Billing lane: human owner assigned, first response target 1 hour for $${spend.value}/mo accounts.`:`${issue.value}: routed with account context and a visible status clock.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
