<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stop means stop — Apollo prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Stop means stop</span></div><div class="wrap"><section class="hero"><h1>Stop means stop</h1><p>Clay users watched credits drain because stop only cancelled the queue. Apollo can halt in-flight work.</p></section><section class="panel"><h2>Properties</h2><label>Run state</label><button type="button" class="sheetbtn" data-target="state">Running</button><input type="hidden" id="state" value="running"><div class="sheet" data-sheet="state"><h3>Run state</h3><button data-v="running" class="selected">Running</button><button data-v="queued" class="">Queued</button><button data-v="paused" class="">Paused</button></div><label>Credits used so far<input id="used" type="number" value="340"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=state.value==="running"?`Stop pressed: in-flight rows halted at ${used.value} credits. No further burn.`:`Run is ${state.value}. Nothing is burning credits.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
