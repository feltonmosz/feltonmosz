<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliability board — Apollo prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Reliability board</span></div><div class="wrap"><section class="hero"><h1>Reliability board</h1><p>Clay logged 47 incidents in 2026, including full app-down events. Apollo can publish reliability where buyers check it.</p></section><section class="panel"><h2>Properties</h2><label>Window</label><button type="button" class="sheetbtn" data-target="win">Last 30 days</button><input type="hidden" id="win" value="30"><div class="sheet" data-sheet="win"><h3>Window</h3><button data-v="30" class="selected">Last 30 days</button><button data-v="365" class="">Last 365 days</button></div><label>Incidents<input id="inc" type="number" value="47"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${win.value} days: ${inc.value} incidents shown with status, duration and SLA credit path. Procurement sees it before signing.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
