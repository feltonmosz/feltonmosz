<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliability board — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M8 32h12l5-12 8 22 6-10h13" fill="none" stroke="#111" stroke-width="3"/></svg></div><p class="eyebrow">PROTOTYPE</p><h1>Reliability board</h1><p class="desc">Clay logged 47 incidents in 2026, including full app-down events. Apollo can publish reliability where buyers check it.</p><section class="panel"><h2>Try it</h2><label>Window</label><button type="button" class="sheetbtn" data-target="win">Last 30 days</button><input type="hidden" id="win" value="30"><div class="sheet" data-sheet="win"><h3>Window</h3><button data-v="30" class="selected">Last 30 days</button><button data-v="365" class="">Last 365 days</button></div><label>Incidents<input id="inc" type="number" value="47"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${win.value} days: ${inc.value} incidents shown with status, duration and SLA credit path. Procurement sees it before signing.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
