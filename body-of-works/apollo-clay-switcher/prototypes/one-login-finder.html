<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-login people finder — Apollo prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / One-login people finder</span></div><div class="wrap"><section class="hero"><h1>One-login people finder</h1><p>Finding one decision maker took 10+ clicks in Clay. Apollo keeps search, reveal and sequence in one login.</p></section><section class="panel"><h2>Properties</h2><label>Search mode</label><button type="button" class="sheetbtn" data-target="mode">By title</button><input type="hidden" id="mode" value="title"><div class="sheet" data-sheet="mode"><h3>Search mode</h3><button data-v="title" class="selected">By title</button><button data-v="company" class="">By company</button><button data-v="intent" class="">By intent signal</button></div><label>Target title<input id="title" value="Head of Sales"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${mode.value}: ${title.value} found in one screen. Reveal email (1 credit) or add to sequence without leaving Apollo.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
