<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export credit warning — Apollo prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Export credit warning</span></div><div class="wrap"><section class="hero"><h1>Export credit warning</h1><p>Hidden limits stopped Clay runs mid-flight. Apollo can warn before export credits exhaust the plan.</p></section><section class="panel"><h2>Properties</h2><label>Export target</label><button type="button" class="sheetbtn" data-target="target">CSV</button><input type="hidden" id="target" value="csv"><div class="sheet" data-sheet="target"><h3>Export target</h3><button data-v="csv" class="selected">CSV</button><button data-v="crm" class="">CRM sync</button><button data-v="sequence" class="">Sequence</button></div><label>Contacts<input id="contacts" type="number" value="500"></label><label>Credits left<input id="left" type="number" value="300"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=contacts.value>left.value?`Warning: ${contacts.value} contacts to ${target.value} exceeds ${left.value} credits left. Apollo offers a partial export first.`:`${target.value} export fits: ${contacts.value} of ${left.value} credits.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
