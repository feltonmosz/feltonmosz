<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enrichment accuracy check — Apollo prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="top"><strong>Apollo</strong><span class="crumb">Body of Works / Apollo × Clay / Enrichment accuracy check</span></div><div class="wrap"><section class="hero"><h1>Enrichment accuracy check</h1><p>Wrong LinkedIn links and invented contacts kill trust. Apollo can score enrichment before sequences send.</p></section><section class="panel"><h2>Properties</h2><label>Data source</label><button type="button" class="sheetbtn" data-target="src">Waterfall enrichment</button><input type="hidden" id="src" value="waterfall"><div class="sheet" data-sheet="src"><h3>Data source</h3><button data-v="waterfall" class="selected">Waterfall enrichment</button><button data-v="single" class="">Single source</button></div><label>Verified %<input id="ver" type="number" value="91"></label><p><button class="btn" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${src.value}: ${ver.value}% verified. Apollo holds unverified rows out of sequences until checked.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
