<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout guard — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Payout guard</h1><p class="desc">Wix froze more than $4,000 after documents were sent. Shopify can show payout holds with reasons.</p><section class="panel"><label>Hold<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="hold" data-v="docs"><span class="dot"></span>Documents sent</button><button type="button" class="radiocard" data-target="hold" data-v="review"><span class="dot"></span>Under review</button></div><input type="hidden" id="hold" value="docs"><label>Amount $<input id="amt" type="number" value="4000"></label><button class="btn" onclick="run()">Check payout</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`$${amt.value} held (${hold.value}): reason, missing item, and release date shown in one place.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
