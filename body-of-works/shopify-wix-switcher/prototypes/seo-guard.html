<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO guard — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>SEO guard</h1><p class="desc">Wix prefixes and caps appear as sites grow. Shopify can keep URLs clean at scale.</p><section class="panel"><label>Catalog<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="cat" data-v="small"><span class="dot"></span>Under 100 products</button><button type="button" class="radiocard" data-target="cat" data-v="large"><span class="dot"></span>1,000+ products</button></div><input type="hidden" id="cat" value="small"><label>Products<input id="n" type="number" value="1200"></label><button class="btn" onclick="run()">Check URLs</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${n.value} products: clean URLs kept, redirects mapped, no prefix surprises as the catalog grows.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
