<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cancel guard — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Cancel guard</h1><p class="desc">Wix charged after auto-renew was confirmed off. Shopify can prove cancellation state.</p><section class="panel"><label>Auto-renew<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="state" data-v="off"><span class="dot"></span>Confirmed off</button><button type="button" class="radiocard" data-target="state" data-v="on"><span class="dot"></span>On</button></div><input type="hidden" id="state" value="off"><label>Days since confirm<input id="days" type="number" value="2"></label><button class="btn" onclick="run()">Check state</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=state.value==="off"?`Auto-renew off for ${days.value} days: no charge can run. Cancellation receipt saved.`:`Auto-renew on: next charge shown with date and amount.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
