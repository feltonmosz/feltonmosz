<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support clock — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Support clock</h1><p class="desc">A Wix chatbot promised an email answer in 45 days. Shopify can give merchants a visible support clock.</p><section class="panel"><label>Issue<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="issue" data-v="payments"><span class="dot"></span>Payments</button><button type="button" class="radiocard" data-target="issue" data-v="store"><span class="dot"></span>Store down</button><button type="button" class="radiocard" data-target="issue" data-v="howto"><span class="dot"></span>How-to</button></div><input type="hidden" id="issue" value="payments"><label>Wait days<input id="days" type="number" value="45"></label><button class="btn" onclick="run()">Route issue</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=issue.value==="howto"?`How-to: guided answer now, human path visible.`:`${issue.value}: human owner assigned. ${days.value} days becomes a tracked clock, not a promise.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
