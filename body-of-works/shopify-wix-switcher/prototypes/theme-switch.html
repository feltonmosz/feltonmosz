<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme switch — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Theme switch</h1><p class="desc">A live Wix site cannot switch design. Shopify themes can preview before publish.</p><section class="panel"><label>Theme<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="theme" data-v="horizon"><span class="dot"></span>Horizon</button><button type="button" class="radiocard" data-target="theme" data-v="fabric"><span class="dot"></span>Fabric</button><button type="button" class="radiocard" data-target="theme" data-v="savor"><span class="dot"></span>Savor</button></div><input type="hidden" id="theme" value="horizon"><label>Products<input id="n" type="number" value="80"></label><button class="btn" onclick="run()">Preview theme</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${theme.value} previewed on ${n.value} products. Live store untouched until publish.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
