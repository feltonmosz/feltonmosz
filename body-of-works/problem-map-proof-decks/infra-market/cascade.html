<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>cascade</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ee;color:#26221e;font-family:'Segoe UI',sans-serif}
header{background:#26221e;color:#f5f2ee;padding:20px;text-align:center}header .lg{font-size:24px;font-weight:800;letter-spacing:1px}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}h1{font-size:27px;line-height:1.3}
.stage{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.stage button{flex:1;background:#fff;border:2px solid #26221e;padding:11px 6px;font-weight:700;cursor:pointer;font-size:13px;border-radius:6px}
.stage button.on{background:#b3402a;color:#fff;border-color:#b3402a}
.status{background:#26221e;color:#f5f2ee;border-radius:10px;padding:16px;line-height:1.7}
.block{background:#fff;border-left:6px solid #b3402a;padding:15px;margin:11px 0}.block h2{margin:0 0 4px;font-size:16px}.block h2 a{color:#b3402a;text-decoration:none}
small{color:#8a8071}a.back{color:#b3402a}</style></head><body><header><div class='lg'>Infra.Market</div></header><main><h1>batching cascade</h1><div class='stage'><button class='on' onclick='go(0,this)'>filed</button><button onclick='go(1,this)'>press</button><button onclick='go(2,this)'>target</button></div><div class='status' id='st'>Filed evidence: FY25 numbers with finance-cost bridge.</div><p><small>Uncertainty: evidence edges labelled filed, press, or target.</small></p><p><a class='back' href='index.html'>← batch</a></p><script>var S=['Filed evidence: FY25 numbers with finance-cost bridge.','Press evidence: debt raise reported Feb 2026, labelled.','Target: IPO proceeds use stated as plan, not result.'];function go(i,b){document.querySelectorAll('.stage button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
