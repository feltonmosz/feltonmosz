<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>rail</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.rail{display:flex;gap:0;margin:20px 0;border:2px solid #2563eb;border-radius:8px;overflow:hidden}
.stop{flex:1;background:#fff;padding:14px 4px;text-align:center;cursor:pointer;font-size:13px;border-right:2px dashed #2563eb}
.stop:last-child{border-right:none}.stop.on{background:#2563eb;color:#fff;font-weight:700}
.status{background:#0b2a5b;color:#fff;border-radius:8px;padding:16px;line-height:1.7}
.stub{background:#fff;border:2px dashed #d4a017;padding:12px 16px;margin:12px 0;font-family:monospace}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #cfe0f5;padding:14px 2px}
.row a{color:#2563eb;text-decoration:none;font-weight:700}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>tenor-decay rail</h1><div class='rail'><div class='stop on' onclick='go(0,this)'>DAY 0</div><div class='stop' onclick='go(1,this)'>DAY 20</div><div class='stop' onclick='go(2,this)'>DAY 45</div></div><div class='status' id='st'>Day 0: invoice uploaded, checklist attached.</div><div class='stub'>NUDGE STUB: next date always printed</div><p><small>Uncertainty: buyer pace moves tenor — the clock stays visible.</small></p><p><a class='back' href='index.html'>← rail</a></p><script>var S=['Day 0: invoice uploaded, checklist attached.','Day 20: checking state stated, nudge dated.','Day 45: accepted or escalation opened.'];function go(i,b){document.querySelectorAll('.stop').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
