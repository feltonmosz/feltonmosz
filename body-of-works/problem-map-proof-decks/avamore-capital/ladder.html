<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ladder</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.tranche{background:#fff;border:2px solid #2563eb;border-radius:12px;padding:14px;margin:9px 0;cursor:pointer}
.tranche:nth-child(2){margin-left:20px}.tranche:nth-child(3){margin-left:40px}.tranche:nth-child(4){margin-left:60px}
.tranche.on{background:#2563eb;color:#fff}
.status{background:#0b2a5b;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:2px solid #dbeafe;padding:14px 2px}
.row a{color:#2563eb;text-decoration:none;font-weight:700}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>tranche ladder</h1><div class='tranche on' onclick='go(0,this)'>0.85 LTC</div><div class='tranche' onclick='go(1,this)'>checklist</div><div class='tranche' onclick='go(2,this)'>fee map</div><div class='status' id='st'>LTC stated per facility, fees mapped pre-completion.</div><p><small>Uncertainty: build stages move — the 48-hour clock keeps pace.</small></p><p><a class='back' href='index.html'>← ladder</a></p><script>var S=['LTC stated per facility, fees mapped pre-completion.','One checklist per facility.','Fee map before completion, no surprises.'];function go(i,b){document.querySelectorAll('.tranche').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
