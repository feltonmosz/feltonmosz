<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>canopy</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f5ff;color:#12224d;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#4171ff}
.cuotas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:18px 0}
.cuota{aspect-ratio:1.4;background:#fff;border:2px solid #4171ff;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#4171ff;font-size:13px}
.cuota.on{background:#4171ff;color:#fff}
.status{background:#12224d;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #dbe6ff;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#4171ff;text-decoration:none}
small{color:#64748b}a.back{color:#4171ff}</style></head><body><main><h1>tandem cuota canopy</h1><div class='cuotas'><div class='cuota on' onclick='go(1,this)'>1</div><div class='cuota' onclick='go(2,this)'>2</div><div class='cuota' onclick='go(3,this)'>3</div><div class='cuota' onclick='go(4,this)'>4</div><div class='cuota' onclick='go(5,this)'>5</div><div class='cuota' onclick='go(6,this)'>6</div><div class='cuota' onclick='go(7,this)'>7</div><div class='cuota' onclick='go(8,this)'>8</div><div class='cuota' onclick='go(9,this)'>9</div><div class='cuota' onclick='go(10,this)'>10</div><div class='cuota' onclick='go(11,this)'>11</div><div class='cuota' onclick='go(12,this)'>12</div></div><div class='status' id='st'>Tap a cuota: its receipt, standalone.</div><p><small>Uncertainty: merchant failure happens — dispute path attached.</small></p><p><a class='back' href='index.html'>← canopy</a></p><script>function go(n,b){document.querySelectorAll('.cuota').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent='Cuota '+n+' receipt: financed, interest/guarantee, total, due date.'}</script></main></body></html>
