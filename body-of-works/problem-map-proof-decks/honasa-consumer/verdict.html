<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>verdict</title><style>*{box-sizing:border-box}body{margin:0;background:#fdfdf5;color:#1f2d12;font-family:Georgia,serif}
header{text-align:center;padding:26px 16px 6px}header .lg{font-size:26px;color:#4d7c0f;font-weight:700}
main{max-width:660px;margin:0 auto;padding:14px 18px 60px}h1{font-size:27px;text-align:center;line-height:1.3}
.leaf{background:#fff;border:2px solid #d9f99d;border-radius:0 28px 0 28px;padding:18px;margin:14px 0}
.leaf h2{margin:0 0 4px;font-size:16px}.leaf h2 a{color:#4d7c0f;text-decoration:none}
.reasons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.reasons button{background:#fff;border:2px solid #84cc16;color:#3f6212;padding:10px 14px;border-radius:0 14px 0 14px;cursor:pointer;font-family:inherit;font-size:14px}
.reasons button.on{background:#84cc16;color:#fff}
.status{background:#3f6212;color:#fff;border-radius:0 18px 0 18px;padding:16px;line-height:1.7;text-align:center}
small{color:#7a8a5f}a.back{color:#4d7c0f}</style></head><body><header><div class='lg'>Honasa</div></header><main><h1>two-line verdict</h1><div class='reasons'><button class='on' onclick='go(0,this)'>approved</button><button onclick='go(1,this)'>rejected</button></div><div class='status' id='st'>Checked: photos verified. Decision: approved.</div><p><small>Uncertainty: courier proof can delay a verdict — the checked line still shows.</small></p><p><a class='back' href='index.html'>← leaf</a></p><script>var S=['Checked: photos verified. Decision: approved, refund in 3 days.','Checked: seal intact, used beyond trial. Decision: rejected — exact reason stated, appeal path open.'];function go(i,b){document.querySelectorAll('.reasons button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
