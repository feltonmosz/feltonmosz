<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resideo playbook</title><style>:root{--blue:#1b6ac9;--navy:#0b2a5b;--heat:#e4572e;--ink:#12202e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4fa;color:var(--ink)}
header{padding:20px 22px 4px;display:flex;align-items:center;gap:14px}
.dial{width:70px;height:70px}
.logo{font-size:28px;font-weight:800;letter-spacing:3px;color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:14px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--navy);margin:10px 0}
.sub{color:#3d5266;line-height:1.55}
.zone{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:18px;margin:14px 0}
.zone .zone{margin:10px 0 0 18px;border-color:var(--blue)}
.zone h2{margin:0 0 6px;font-size:18px;color:var(--navy)}.zone h2 a{color:var(--navy);text-decoration:none}
.num{font-size:36px;font-weight:800;color:var(--blue)}
.btn,button{background:var(--navy);color:#fff;border:3px solid var(--blue);padding:10px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}
input[type=range]{width:100%;accent-color:var(--heat)}
.out{background:#fdf1ec;border-left:5px solid var(--heat);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
