<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>comfort</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.dial{width:190px;height:190px;border-radius:50%;border:10px solid #2563eb;margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.dial .temp{font-size:44px;font-weight:800}.dial .mode{color:#64748b;font-size:13px}
.adj{display:flex;gap:10px;justify-content:center;margin:14px 0}.adj button{width:56px;height:56px;border-radius:50%;border:3px solid #2563eb;background:#fff;font-size:24px;cursor:pointer;color:#2563eb;font-weight:700}
.status{background:#0b2a5b;color:#fff;border-radius:14px;padding:16px;line-height:1.7;text-align:left}
.zone{background:#fff;border:2px solid #dbeafe;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.zone h2{margin:0 0 4px;font-size:16px}.zone h2 a{color:#2563eb;text-decoration:none}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>comfort loop</h1><div class='dial'><div class='temp' id='tp'>72°</div><div class='mode'>DEADBAND ±1°</div></div><div class='adj'><button onclick='adj(-1)'>−</button><button onclick='adj(1)'>+</button></div><div class='status' id='st'>Deadband holds: no short-cycling, no lockout.</div><p><small>Uncertainty: older thermostats may need pro help — truck script included.</small></p><p><a class='back' href='index.html'>← dial</a></p><script>var t=72;function adj(d){t=Math.max(60,Math.min(85,t+d));document.getElementById('tp').textContent=t+'°';document.getElementById('st').textContent='Setpoint '+t+'° within deadband — system stable.'}</script></main></body></html>
