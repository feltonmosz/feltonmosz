<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instabank tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f2f8f5;color:#12261e}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#0f7a5a}h1{color:#0a4a38}.sub{color:#3d5a4e}.c{border:1px solid #cfe8dc;border-radius:16px}.c h2,.c h2 a{color:#0a4a38}.num{font-size:32px;font-weight:800;color:#0f7a5a}.btn{background:#0f7a5a;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#0f7a5a}.out{background:#e9f6ef;border-left:5px solid #0f7a5a}.band{background:#0a4a38}.small{color:#6b8a7c}</style></head><body><header><div class="logo">Instabank</div></header><main><h1>signal lock lattice</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Decision lock</label><input id="s0" type="range" min="0" max="100" value="35"><label>Channel sync</label><input id="s1" type="range" min="0" max="100" value="40"><label>Decline clarity</label><input id="s2" type="range" min="0" max="100" value="30"><div class="out" id="out"></div><div class="band">Uncertainty band: partner channels can still lag updates.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#0f7a5a';for(var i=0;i<3;i++){x.strokeRect(80+i*50,60+i*45,540-i*100,260-i*90)}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Signal confidence: '+m+'%\nPlain English: one decision record, every channel.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
