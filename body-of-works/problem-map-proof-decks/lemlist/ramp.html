<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemlist tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#0f1226;color:#eef0ff}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#5b8cff}h1{color:#fff}.sub{color:#b9c0e8}.c{background:#171b38;color:#eef0ff;border:1px solid #2a3160}.c h2,.c h2 a{color:#5b8cff}.num{font-size:34px;font-weight:900;color:#5b8cff}.btn{background:#5b8cff;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:8px}input[type=range]{accent-color:#5b8cff}.out{background:#1e2450;border-left:5px solid #5b8cff}.band{background:#080a1c}.small{color:#8a92c0}</style></head><body><header><div class="logo">lemlist</div></header><main><h1>warm-up ramp</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Timeline clarity</label><input id="s0" type="range" min="0" max="100" value="40"><label>Credit clarity</label><input id="s1" type="range" min="0" max="100" value="45"><label>Onboarding help</label><input id="s2" type="range" min="0" max="100" value="50"><div class="out" id="out"></div><div class="band">Uncertainty band: mailbox providers can still throttle sends.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#5b8cff';x.lineWidth=3;x.beginPath();for(var t=0;t<=54;t++){var px=40+t*12,py=330-260*(1-Math.exp(-t/18));if(t===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke();var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Activation trust: '+m+'%\nPlain English: trial ends at day 14, warm-up ends near day 54. Show both dates.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
