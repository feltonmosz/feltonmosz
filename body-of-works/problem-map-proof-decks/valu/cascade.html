<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valu tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f2f8f7;color:#12261e}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#0e7a6d}h1{color:#0a4a42}.sub{color:#3d5a56}.c{border:1px solid #cfe8e2;border-radius:16px}.c h2,.c h2 a{color:#0a4a42}.num{font-size:32px;font-weight:800;color:#0e7a6d}.btn{background:#0e7a6d;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#0e7a6d}.out{background:#e9f6f2;border-left:5px solid #0e7a6d}.band{background:#0a4a42}.small{color:#6b8a84}</style></head><body><header><div class="logo">Valu</div></header><main><h1>72-hour cascade</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Status clarity</label><input id="s0" type="range" min="0" max="100" value="35"><label>Refund clarity</label><input id="s1" type="range" min="0" max="100" value="40"><label>Response speed</label><input id="s2" type="range" min="0" max="100" value="30"><div class="out" id="out"></div><div class="band">Uncertainty band: partner-store delays can still move refunds.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.fillStyle='#0e7a6d';var w=600;for(var i=0;i<3;i++){x.fillRect(50,60+i*90,w,44);w=w*0.62}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Cashback confidence: '+m+'%\nPlain English: pending explained, 72 hours dated, refund route named.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
