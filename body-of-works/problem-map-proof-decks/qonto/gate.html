<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>gate</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfbfc;color:#111827;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.gates{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.gate{flex:1;background:#fff;border:3px solid #111827;padding:14px 6px;text-align:center;font-weight:700;cursor:pointer;border-radius:10px;font-size:13px}
.gate.on{background:#2563eb;color:#fff;border-color:#2563eb}
.status{background:#111827;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:2px solid #e5e7eb;padding:14px 2px}
.row a{color:#2563eb;text-decoration:none;font-weight:700}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>ledger gates</h1><div class='gates'><div class='gate on' onclick='go(0,this)'>OPEN</div><div class='gate' onclick='go(1,this)'>HELD</div><div class='gate' onclick='go(2,this)'>CLEARED</div></div><div class='status' id='st'>Open: account active, licence cover stated.</div><p><small>Uncertainty: compliance reviews can extend holds — update times stay promised.</small></p><p><a class='back' href='index.html'>← gates</a></p><script>var S=['Open: account active, licence cover stated.','Held: reason + documents + next update.','Cleared: released with case summary.'];function go(i,b){document.querySelectorAll('.gate').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
