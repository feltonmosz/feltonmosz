<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Root test-drive fractal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}header{padding:22px;text-align:center}header .logo{font-size:34px;font-weight:900}header .logo span{color:#ff5715}main{max-width:760px;margin:0 auto;padding:18px}h1{font-size:32px;line-height:1.1}.sub{color:#555}.card{border:2px solid #111;border-radius:22px;padding:18px;margin:14px 0}.card h2{margin:0 0 8px}.card h2 a{color:#111;text-decoration:none}.num{font-size:36px;font-weight:900;color:#ff5715}.coast{height:54px;background:repeating-radial-gradient(circle at 10px 28px,#ff5715 0 3px,transparent 4px 18px),repeating-radial-gradient(circle at 30px 20px,#111 0 2px,transparent 3px 24px);border-top:3px solid #ff5715;border-bottom:3px solid #111;margin:14px 0}.route{display:flex;justify-content:space-between;text-align:center;font-size:12px}.route b{color:#ff5715}button,.btn{background:#ff5715;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none}input[type=range]{width:100%}select,input{width:100%;padding:12px;border:1px solid #bbb;border-radius:12px;margin:6px 0 12px}.out{background:#fff7f2;border:1px solid #ffd2c2;border-radius:14px;padding:14px;white-space:pre-line}.ribbon{background:#111;color:#fff;border-radius:12px;padding:12px}.small{font-size:12px;color:#777}</style></head><body><header><div class="logo">root<span>.</span></div></header><main>
<h1>test-drive fractal</h1>
<section class="card"><label>Braking</label><input id="b" type="range" min="0" max="100" value="82">
<label>Turning</label><input id="t" type="range" min="0" max="100" value="76">
<label>Focused driving</label><input id="f" type="range" min="0" max="100" value="88">
<label>Safe hours</label><input id="s" type="range" min="0" max="100" value="70">
<div class="out" id="out"></div><div class="ribbon">Uncertainty ribbon: other predictive factors and state rules can still change the final rate.</div></section>
<script>function c(){var v=['b','t','f','s'].map(function(id){return +document.getElementById(id).value});var avg=Math.round(v.reduce(function(a,x){return a+x},0)/4);var band=avg>=85?'strong good-driver band':avg>=70?'good-driver band':'needs safer trips';document.getElementById('out').textContent='Driving score: '+avg+'\nBand: '+band+'\nPlain English: your rate follows these ripples, not demographics first.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',c)});c()</script></main></body></html>
