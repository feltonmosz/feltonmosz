<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Root billing</title><style>:root{--phi:1.618;--s1:8px;--s2:13px;--s3:21px;--s4:34px;--s5:55px;--ink:#111;--act:#ff5715}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
header{position:relative;padding:var(--s4) var(--s3) var(--s3);overflow:hidden}
header canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.10}
header .logo{position:relative;font-size:34px;font-weight:900}header .logo span{color:var(--act)}
main{max-width:820px;margin:0 auto;padding:0 var(--s3) var(--s5)}
h1{font-size:42px;line-height:1.05;letter-spacing:-1px;margin:var(--s3) 0}
.sub{color:#555;font-size:17px;line-height:1.5;max-width:62%}
.coast{width:100%;height:54px;display:block;margin:var(--s3) 0}
.grid{display:grid;grid-template-columns:1.618fr 1fr;gap:var(--s3)}
.card{border:1.5px solid var(--ink);border-radius:4px 34px 4px 34px;padding:var(--s3)}
.card:nth-child(3n){transform:translateY(var(--s2))}
.card h2{margin:0 0 var(--s1);font-size:19px}.card h2 a{color:var(--ink);text-decoration:none}
.num{font-size:44px;font-weight:900;color:var(--act);line-height:1}
.route{display:grid;grid-template-columns:1fr 1.618fr 1fr 1.618fr 1fr;gap:var(--s1);text-align:center;font-size:12px;margin:var(--s2) 0 var(--s4)}
.route b{color:var(--act);display:block;font-size:14px}
.btn,button{background:var(--act);color:#fff;border:0;padding:13px 21px;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 13px) 100%,0 100%);transition:transform .18s}
.btn:hover,button:hover{transform:translate(3px,-2px)}
input[type=range]{width:100%;accent-color:var(--act)}
.out{background:#fff7f2;border-left:5px solid var(--act);padding:var(--s2);white-space:pre-line;margin-top:var(--s2)}
.ribbon{background:var(--ink);color:#fff;padding:var(--s2);margin-top:var(--s2);font-size:14px}
.small{font-size:12px;color:#777;margin-top:var(--s4)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.sub{max-width:100%}h1{font-size:34px}}</style></head><body><header><canvas id="mb"></canvas><div class="logo">root</div></header><main><svg class="coast" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0.0 30.0 L1.6 28.0 L3.1 26.6 L4.7 26.2 L6.2 25.6 L7.8 23.5 L9.4 23.8 L10.9 21.3 L12.5 21.0 L14.1 20.5 L15.6 21.5 L17.2 20.2 L18.8 18.1 L20.3 18.9 L21.9 20.1 L23.4 20.3 L25.0 21.4 L26.6 21.6 L28.1 21.3 L29.7 21.6 L31.2 22.1 L32.8 23.0 L34.4 24.9 L35.9 25.1 L37.5 23.6 L39.1 22.6 L40.6 20.6 L42.2 20.3 L43.8 21.4 L45.3 23.3 L46.9 24.8 L48.4 25.0 L50.0 25.1 L51.6 25.1 L53.1 23.0 L54.7 23.5 L56.2 22.8 L57.8 22.3 L59.4 23.0 L60.9 25.8 L62.5 26.2 L64.1 24.7 L65.6 25.3 L67.2 26.2 L68.8 27.6 L70.3 28.6 L71.9 28.1 L73.4 28.2 L75.0 30.2 L76.6 30.8 L78.1 31.4 L79.7 29.4 L81.2 29.9 L82.8 28.5 L84.4 26.2 L85.9 26.5 L87.5 25.3 L89.1 25.6 L90.6 25.5 L92.2 26.3 L93.8 25.1 L95.3 26.1 L96.9 28.1 L98.4 29.6 L100.0 30.0" fill="none" stroke="#ff5715" stroke-width="1.6"/></svg><h1>cancel means stop</h1><section class="card"><p>Cancellation confirmation with billing stop date and refund timing on one screen.</p></section></main><script>(function(){var c=document.getElementById('mb');if(!c)return;var x=c.getContext('2d');var W=c.width=220,H=c.height=90;for(var j=0;j<H;j++){for(var i=0;i<W;i++){var a=-2.2+3*i/W,b=-1.2+2.4*j/H,zr=0,zi=0,n=0;while(zr*zr+zi*zi<4&&n<28){var t=zr*zr-zi*zi+a;zi=2*zr*zi+b;zr=t;n++}x.fillStyle=n===28?'#111':'rgba(255,87,21,'+(n/28)+')';x.fillRect(i,j,1,1)}}})()</script></body></html>
