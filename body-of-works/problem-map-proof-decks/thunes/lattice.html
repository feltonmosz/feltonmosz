<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>lattice</title><style>*{box-sizing:border-box}body{margin:0;background:#f4faf2;color:#12351f;font-family:Georgia,serif}
header{background:#14532d;color:#fff;padding:22px;text-align:center}header .lg{font-size:26px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}h1{font-size:27px;line-height:1.3}
.lane{border-top:3px dashed #69be29;padding:14px 4px;display:flex;justify-content:space-between;font-size:15px}
.lane a{color:#14532d;text-decoration:none;font-weight:700}
.states{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.states button{background:#fff;border:2px solid #14532d;color:#14532d;padding:10px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
.states button.on{background:#69be29;color:#12351f;font-weight:700}
.status{background:#14532d;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
small{color:#6b8a76}a.back{color:#14532d}</style></head><body><header><div class='lg'>Thunes</div></header><main><h1>last-mile lattice</h1><div class='states'><button class='on' onclick='go(0,this)'>wallet</button><button onclick='go(1,this)'>bank</button><button onclick='go(2,this)'>cash</button></div><div class='status' id='st'>Wallet: received means spendable, timestamped.</div><p><small>Uncertainty: the 15% non-instant band stays labelled with expected windows.</small></p><p><a class='back' href='index.html'>← highway</a></p><script>var S=['Wallet: received means spendable, timestamped.','Bank: credited status separated from completed.','Cash: pickup ready means cash in hand at agent.'];function go(i,b){document.querySelectorAll('.states button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
