<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>router</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#0d0095;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.nodes{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.nodes button{flex:1;background:#fff;border:2px solid #1043fa;color:#1043fa;padding:12px 4px;font-weight:700;cursor:pointer;border-radius:999px;font-size:12px}
.nodes button.on{background:#1043fa;color:#fff}
.status{background:#0d0095;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #d6e4ff;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#1043fa;text-decoration:none}
.cta{background:#21a35b;color:#fff;border-radius:12px;padding:14px 16px;font-weight:700}
small{color:#64748b}a.back{color:#1043fa}</style></head><body><main><h1>one-to-local router</h1><div class='nodes'><button class='on' onclick='go(0,this)'>PAYINS</button><button onclick='go(1,this)'>PAYOUTS</button><button onclick='go(2,this)'>HOLDS</button></div><div class='status' id='st'>Payins: local acquiring, status per transaction.</div><p><small>Uncertainty: compliance holds extend — next update always dated.</small></p><p><a class='back' href='index.html'>← router</a></p><script>var S=['Payins: local acquiring, status per transaction.','Payouts: smart routing, timelines stated.','Holds: reason, document, owner, escalation.'];function go(i,b){document.querySelectorAll('.nodes button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
