<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>canopy</title><style>*{box-sizing:border-box}body{margin:0;background:#fdfbf5;color:#14332e;font-family:'Palatino Linotype',Georgia,serif}
header{text-align:center;padding:20px 16px 0}.sun{width:54px;height:54px;background:#f59e0b;border-radius:50%;margin:0 auto}
header .lg{font-size:24px;font-weight:700;color:#0f766e;margin-top:8px}
main{max-width:720px;margin:0 auto;padding:16px 18px 60px}h1{font-size:27px;line-height:1.3;text-align:center}
.branch{border-left:3px solid #0f766e;margin:14px 0 14px 8px;padding:4px 0 4px 18px;position:relative}
.branch:before{content:'';position:absolute;left:-9px;top:14px;width:15px;height:15px;background:#f59e0b;border-radius:50%}
.branch h2{margin:0 0 4px;font-size:17px}.branch h2 a{color:#0f766e;text-decoration:none}
.toggle{display:flex;gap:8px;justify-content:center;margin:18px 0}
.toggle button{background:#fff;border:2px solid #0f766e;color:#0f766e;padding:12px 18px;border-radius:999px;font-family:inherit;font-size:15px;cursor:pointer}
.toggle button.on{background:#0f766e;color:#fff}
.status{background:#0f766e;color:#fff;border-radius:14px;padding:18px;line-height:1.7;text-align:center}
small{color:#6b7d76}a.back{color:#0f766e}</style></head><body><header><div class='sun'></div><div class='lg'>FNB Ghana</div></header><main><h1>session canopy</h1><div class='toggle'><button class='on' onclick='go(0,this)'>at home</button><button onclick='go(1,this)'>abroad</button></div><div class='status' id='st'>At home: update installs, session survives.</div><p><small>Uncertainty: device storage can still block installs — the warning card arrives first.</small></p><p><a class='back' href='index.html'>← canopy</a></p><script>function go(i,b){document.querySelectorAll('.toggle button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=i===0?'At home: update installs, session survives.':'Abroad: rescue path published — verify by email, session restored.'}</script></main></body></html>
