<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>states</title><style>*{box-sizing:border-box}body{margin:0;background:#f2fbf8;color:#0b2e2a;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#0d9488}
.states{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.states button{flex:1;background:#fff;border:2px solid #14b8a6;color:#0d9488;padding:12px 4px;font-weight:700;cursor:pointer;border-radius:10px;font-size:12px}
.states button.on{background:#14b8a6;color:#fff}
.status{background:#0b2e2a;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #ccfbf1;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#0d9488;text-decoration:none}
small{color:#5f7a74}a.back{color:#0d9488}</style></head><body><main><h1>charge-state recursion</h1><div class='states'><button class='on' onclick='go(0,this)'>BALANCE</button><button onclick='go(1,this)'>COBRANÇA</button><button onclick='go(2,this)'>PARCELA</button></div><div class='status' id='st'>Balance: same 4-field card, balance scale.</div><p><small>Uncertainty: verification extends windows — next update always timed.</small></p><p><a class='back' href='index.html'>← states</a></p><script>var S=['Balance: same 4-field card, balance scale.','Cobrança: same card, charge scale.','Parcela: same card, installment scale.'];function go(i,b){document.querySelectorAll('.states button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
