<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sezzle spending notice</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Arial Rounded MT Bold",Arial,Helvetica,sans-serif;background:#f4f1fb;color:#382757}header{background:linear-gradient(135deg,#382757,#6c2bd9);color:#fff;padding:22px;text-align:center}header .logo{font-size:34px;font-weight:800;letter-spacing:-1px}header .logo span{color:#ffb3d9}main{max-width:760px;margin:0 auto;padding:18px}h1{font-size:30px;line-height:1.15;margin:10px 0}.sub{color:#6b5a8f}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(56,39,87,.08)}.card h2{margin:0 0 8px;font-size:19px}.card h2 a{color:#382757;text-decoration:none}.num{font-size:34px;font-weight:800;color:#6c2bd9}.bar{height:12px;background:#e7defa;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6c2bd9,#e04fa0)}button,.btn{background:#6c2bd9;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none}input,select{width:100%;padding:12px;border:1px solid #d9cdf5;border-radius:12px;margin:6px 0 12px}.out{background:#f4f1fb;border-radius:14px;padding:14px;white-space:pre-line}.timeline{display:flex;justify-content:space-between;text-align:center;font-size:12px;color:#6b5a8f}.dot{width:14px;height:14px;border-radius:50%;background:#6c2bd9;margin:0 auto 4px}.small{font-size:12px;color:#8a7aa8}</style></head><body><header><div class="logo">sezzle<span>♥</span></div></header><main><h1>your spending power changed</h1><section class="card"><p>Show the reason in plain words: recent missed payment, processing payment, or account review — plus what restores it and when.</p></section></main></body></html>
