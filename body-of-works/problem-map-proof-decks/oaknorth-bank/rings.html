<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OakNorth Bank tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f7f5ee;color:#2a2412}header{padding:22px}.logo{font-size:27px;font-weight:800;color:#7a5a12}h1{color:#4a3a0a}.sub{color:#6b5a3a}.c{border:1px solid #e8dfc4;border-radius:18px}.c h2,.c h2 a{color:#4a3a0a}.num{font-size:32px;font-weight:800;color:#7a5a12}.btn{background:#7a5a12;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#7a5a12}.out{background:#fdf6e0;border-left:5px solid #7a5a12}.band{background:#4a3a0a}.small{color:#9a8a68}</style></head><body><header><div class="logo">OakNorth Bank</div></header><main><h1>acorn rings</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Qualification clarity</label><input id="s0" type="range" min="0" max="100" value="40"><label>Range clarity</label><input id="s1" type="range" min="0" max="100" value="45"><label>Opening clarity</label><input id="s2" type="range" min="0" max="100" value="35"><div class="out" id="out"></div><div class="band">Uncertainty band: charter conditions can still stage the rollout.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#7a5a12';for(var i=0;i<4;i++){x.beginPath();x.arc(350,190,40+i*35,0,6.3);x.stroke()}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Rollout confidence: '+m+'%\nPlain English: who qualifies, what range, what opens next.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
