<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>rings</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbf5;color:#14301a;font-family:Georgia,serif}

small{color:#6b7a5f}a.back{color:#2f7d32}</style></head><body><main><h1>acorn ring charter</h1><svg width='200' height='200' viewBox='0 0 200 200' style='margin:8px auto;display:block'><circle cx='100' cy='100' r='92' fill='none' stroke='#2f7d32' stroke-width='8'/><circle cx='100' cy='100' r='62' fill='none' stroke='#66bb6a' stroke-width='8'/><circle cx='100' cy='100' r='34' fill='none' stroke='#a5d6a7' stroke-width='8'/><circle cx='100' cy='100' r='10' fill='#2f7d32'/></svg><div class='rings'><button class='on' onclick='go(0,this)'>charter</button><button onclick='go(1,this)'>lending</button><button onclick='go(2,this)'>trust</button></div><div class='status' id='st'>Charter ring: approved, rollout sequenced.</div><p><small>Uncertainty: rollout timing moves — starter card stays current.</small></p><p><a class='back' href='index.html'>← rings</a></p><script>var S=['Charter ring: approved, rollout sequenced.','Lending ring: range and qualification stated.','Trust ring: contact route named per borrower.'];function go(i,b){document.querySelectorAll('.rings button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
