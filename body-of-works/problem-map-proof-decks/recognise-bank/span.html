<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>span</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7ff;color:#1f204b;font-family:'Segoe UI',sans-serif}

small{color:#64748b}a.back{color:#4751a3}</style></head><body><main><h1>bridge span</h1><svg width='320' height='110' viewBox='0 0 320 110' style='margin:10px auto;display:block'><path d='M10 95 Q160 -30 310 95' fill='none' stroke='#64c8f2' stroke-width='8'/><line x1='10' y1='95' x2='310' y2='95' stroke='#4751a3' stroke-width='4'/></svg><div class='spans'><button class='on' onclick='go(0,this)'>broker</button><button onclick='go(1,this)'>joint holders</button></div><div class='status' id='st'>Broker: decision path dated at submission.</div><p><small>Uncertainty: valuation timing moves completions — dates update brokers first.</small></p><p><a class='back' href='index.html'>← span</a></p><script>var S=['Broker: decision path dated at submission.','Joint holders: same checklist to both at opening.'];function go(i,b){document.querySelectorAll('.spans button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
