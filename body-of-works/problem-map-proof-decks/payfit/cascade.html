<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>cascade</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.bands{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.bands button{flex:1;background:#fff;border:3px solid #111827;padding:14px 4px;font-weight:700;cursor:pointer;border-radius:10px;font-size:14px}
.bands button.on{background:#f59e0b;border-color:#f59e0b}
.slip{background:#111827;color:#fff;border-radius:12px;padding:18px;line-height:1.9;font-family:monospace;white-space:pre-line}
.card{border:2px solid #e5e7eb;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#111827;text-decoration:none}
small{color:#64748b}a.back{color:#111827}</style></head><body><main><h1>cut-off cascade</h1><div class='bands'><button class='on' onclick='go(0,this)'>inputs</button><button onclick='go(1,this)'>cut-off</button><button onclick='go(2,this)'>payslip</button></div><div class='slip' id='sl'>Inputs open until cut-off — date stated.</div><p><small>Uncertainty: late inputs move payslips — cut-offs stay published.</small></p><p><a class='back' href='index.html'>← bands</a></p><script>var S=['Inputs open until cut-off — date stated.','Cut-off: checklist closes inputs on time.','Payslip: price band shown on the slip.'];function go(i,b){document.querySelectorAll('.bands button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('sl').textContent=S[i]}</script></main></body></html>
