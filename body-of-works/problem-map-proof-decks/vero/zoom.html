<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>zoom</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5f9;color:#4a0e2e;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#db2777}
.zoom{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.zoom button{flex:1;background:#fff;border:2px solid #ec4899;color:#db2777;padding:12px 4px;font-weight:700;cursor:pointer;border-radius:999px;font-size:12px}
.zoom button.on{background:#ec4899;color:#fff}
.status{background:#4a0e2e;color:#fff;border-radius:14px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #fbcfe8;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#db2777;text-decoration:none}
small{color:#9a6a80}a.back{color:#db2777}</style></head><body><main><h1>splitter-zoom timeline</h1><div class='zoom'><button class='on' onclick='go(0,this)'>MACRO</button><button onclick='go(1,this)'>MESO</button><button onclick='go(2,this)'>MICRO</button></div><div class='status' id='st'>Macro: outage card with reason, visit, discount.</div><p><small>Uncertainty: repairs extend windows — card updates first.</small></p><p><a class='back' href='index.html'>← zoom</a></p><script>var S=['Macro: outage card with reason, visit, discount.','Meso: ocorrência timeline per address.','Micro: visita técnica window per customer.'];function go(i,b){document.querySelectorAll('.zoom button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
