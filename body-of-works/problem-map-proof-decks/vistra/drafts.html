<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vistra drafts</title><style>:root{--navy:#003f6e;--grn:#6dab3c;--ink:#101418}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f4f8fb;color:var(--ink)}
header{padding:20px 22px 6px;display:flex;align-items:center;gap:14px}
.tree{width:64px;height:64px}
.logo{font-size:30px;font-weight:800;letter-spacing:2px;color:var(--navy)}.logo span{color:var(--grn)}
main{max-width:760px;margin:0 auto;padding:14px 20px 54px}
h1{font-size:34px;line-height:1.08;color:var(--navy);margin:10px 0}
.sub{color:#3d4a55;line-height:1.55}
.branch{border-left:3px solid var(--navy);margin:22px 0 0 10px;padding-left:22px}
.node{position:relative;background:#fff;border:1px solid #d7e4ec;border-radius:2px 26px 2px 26px;padding:16px 18px;margin:0 0 18px}
.node:before{content:"";position:absolute;left:-30px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--grn);border:3px solid var(--navy)}
.node:nth-child(even){margin-left:34px}
.node h2{margin:0 0 6px;font-size:18px}.node h2 a{color:var(--navy);text-decoration:none}
.num{font-size:38px;font-weight:800;color:var(--navy)}
.btn,button{background:var(--navy);color:#fff;border:0;padding:12px 20px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:26px 2px 26px 2px}
input[type=range]{width:100%;accent-color:var(--grn)}
.out{background:#eef6e8;border-left:5px solid var(--grn);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
.small{font-size:12px;color:#6b7a86}</style></head><body><header><svg class="tree" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#003f6e" stroke-linecap="round"><line x1="50.0" y1="96.0" x2="50.0" y2="66.0" stroke-width="3.5"/><line x1="50.0" y1="66.0" x2="41.2" y2="46.3" stroke-width="2.8"/><line x1="41.2" y1="46.3" x2="29.6" y2="35.9" stroke-width="2.1"/><line x1="29.6" y1="35.9" x2="19.0" y2="32.5" stroke-width="1.4"/><line x1="19.0" y1="32.5" x2="10.9" y2="33.4" stroke-width="0.7"/><line x1="19.0" y1="32.5" x2="12.9" y2="27.5" stroke-width="0.7"/><line x1="29.6" y1="35.9" x2="24.8" y2="26.1" stroke-width="1.4"/><line x1="24.8" y1="26.1" x2="18.7" y2="21.1" stroke-width="0.7"/><line x1="24.8" y1="26.1" x2="24.2" y2="18.5" stroke-width="0.7"/><line x1="41.2" y1="46.3" x2="40.6" y2="31.2" stroke-width="2.1"/><line x1="40.6" y1="31.2" x2="35.8" y2="21.4" stroke-width="1.4"/><line x1="35.8" y1="21.4" x2="29.7" y2="16.4" stroke-width="0.7"/><line x1="35.8" y1="21.4" x2="35.1" y2="13.8" stroke-width="0.7"/><line x1="40.6" y1="31.2" x2="44.1" y2="21.2" stroke-width="1.4"/><line x1="44.1" y1="21.2" x2="43.5" y2="13.6" stroke-width="0.7"/><line x1="44.1" y1="21.2" x2="49.0" y2="15.6" stroke-width="0.7"/><line x1="50.0" y1="66.0" x2="57.8" y2="46.5" stroke-width="2.8"/><line x1="57.8" y1="46.5" x2="57.2" y2="31.4" stroke-width="2.1"/><line x1="57.2" y1="31.4" x2="52.4" y2="21.6" stroke-width="1.4"/><line x1="52.4" y1="21.6" x2="46.3" y2="16.6" stroke-width="0.7"/><line x1="52.4" y1="21.6" x2="51.7" y2="14.0" stroke-width="0.7"/><line x1="57.2" y1="31.4" x2="60.7" y2="21.4" stroke-width="1.4"/><line x1="60.7" y1="21.4" x2="60.1" y2="13.8" stroke-width="0.7"/><line x1="60.7" y1="21.4" x2="65.6" y2="15.8" stroke-width="0.7"/><line x1="57.8" y1="46.5" x2="67.9" y2="35.8" stroke-width="2.1"/><line x1="67.9" y1="35.8" x2="71.4" y2="25.9" stroke-width="1.4"/><line x1="71.4" y1="25.9" x2="70.8" y2="18.3" stroke-width="0.7"/><line x1="71.4" y1="25.9" x2="76.3" y2="20.3" strok
