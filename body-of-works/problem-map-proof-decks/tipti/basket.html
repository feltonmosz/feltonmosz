<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>basket</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f2;color:#3a2410;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.tile{aspect-ratio:1.2;background:#fff;border:2px solid #f97316;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#ea580c;text-align:center;padding:4px}
.tile.on{background:#f97316;color:#fff}
.status{background:#3a2410;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #fed7aa;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#ea580c;text-decoration:none}
small{color:#9a7a55}a.back{color:#ea580c}</style></head><body><main><h1>basket subdivision</h1><div class='shelf'><div class='tile on' onclick='go(0,this)'>APPROVE</div><div class='tile' onclick='go(1,this)'>SWAP</div><div class='tile' onclick='go(2,this)'>REFUND</div><div class='tile' onclick='go(3,this)'>LATE</div><div class='tile' onclick='go(4,this)'>SHELF</div><div class='tile' onclick='go(5,this)'>BASKET</div><div class='tile' onclick='go(6,this)'>STORE</div><div class='tile' onclick='go(7,this)'>PEAK</div></div><div class='status' id='st'>Tap a tile: order to item, one promise.</div><p><small>Uncertainty: shelf stock moves — approval before swap.</small></p><p><a class='back' href='index.html'>← basket</a></p><script>var S=['Approve: approval before swap.','Swap: price difference stated.','Refund: to original payment method.','Late: new time stated.','Shelf: shoppers check shelf rows.','Basket: promise card attached.','Store: same promise per store.','Peak: FAQ ready for peak.'];function go(i,b){document.querySelectorAll('.tile').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
