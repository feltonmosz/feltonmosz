<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>rings</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.zero{width:170px;height:170px;border-radius:50%;border:12px solid #22c55e;margin:18px auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zero .n{font-size:56px;font-weight:800}.zero .lab{font-size:12px;color:#a3a3a3}
.holds{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}.holds button{background:#1a1a1a;color:#4ade80;border:2px solid #22c55e;padding:10px 14px;border-radius:999px;cursor:pointer}
.holds button.on{background:#22c55e;color:#052e10;font-weight:700}
.status{background:#22c55e;color:#052e10;border-radius:14px;padding:16px;line-height:1.7;text-align:left;font-weight:700}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #262626;padding:14px 2px;text-align:left}
.row a{color:#4ade80;text-decoration:none;font-weight:700}
small{color:#8a8a8a}a.back{color:#4ade80}</style></head><body><main><h1>zero-ring ladder</h1><div class='zero'><div class='n'>0</div><div class='lab'>FEES</div></div><div class='holds'><button class='on' onclick='go(0,this)'>reason</button><button onclick='go(1,this)'>documents</button><button onclick='go(2,this)'>escalation</button></div><div class='status' id='st'>Reason stated on the hold screen itself.</div><p><small>Uncertainty: compliance reviews extend holds — timelines stay promised.</small></p><p><a class='back' href='index.html'>← ring</a></p><script>var S=['Reason stated on the hold screen itself.','Documents: exact checklist, asked once.','Escalation: named contact with response promise.'];function go(i,b){document.querySelectorAll('.holds button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
