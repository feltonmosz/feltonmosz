<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>percolation</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0f24;color:#dbe4ff;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}
.cell{aspect-ratio:1;background:#141d3d;border:1px solid #3b82f6;border-radius:6px;cursor:pointer}
.cell.on{background:#3b82f6}
.status{background:#141d3d;border-left:5px solid #3b82f6;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #26325e;padding:14px 2px}
.row a{color:#93c5fd;text-decoration:none;font-weight:700}
small{color:#7d8db0}a.back{color:#93c5fd}</style></head><body><main><h1>qualification percolation</h1><div class='grid'><div class='cell on' onclick='go(0,this)'></div><div class='cell' onclick='go(1,this)'></div><div class='cell' onclick='go(2,this)'></div><div class='cell' onclick='go(3,this)'></div><div class='cell' onclick='go(4,this)'></div><div class='cell' onclick='go(5,this)'></div><div class='cell on' onclick='go(6,this)'></div><div class='cell' onclick='go(7,this)'></div><div class='cell' onclick='go(8,this)'></div><div class='cell' onclick='go(9,this)'></div><div class='cell' onclick='go(10,this)'></div><div class='cell' onclick='go(11,this)'></div><div class='cell on' onclick='go(12,this)'></div><div class='cell' onclick='go(13,this)'></div><div class='cell' onclick='go(14,this)'></div></div><div class='status' id='st'>Toggle cells: paths open as second sources qualify.</div><p><small>Uncertainty: qualification timelines move — paths stay dated.</small></p><p><a class='back' href='index.html'>← lattice</a></p><script>function go(i,b){b.classList.toggle('on');document.getElementById('st').textContent='Cell '+(i+1)+' '+(b.classList.contains('on')?'qualified.':'in qualification.')}</script></main></body></html>
