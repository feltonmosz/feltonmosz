<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dave's switcher</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}header{background:#000;padding:20px;text-align:center;border-bottom:6px solid #e63329}header .logo{font-size:30px;font-weight:900;letter-spacing:1px;text-transform:uppercase}header .logo span{color:#ffc400}main{max-width:760px;margin:0 auto;padding:18px}h1{font-size:30px;text-transform:uppercase;line-height:1.1}.sub{color:#ccc}.card{background:#1c1c1c;border:2px solid #333;border-radius:16px;padding:18px;margin:14px 0}.card h2{margin:0 0 8px;text-transform:uppercase;font-size:18px}.card h2 a{color:#ffc400;text-decoration:none}.num{font-size:36px;font-weight:900;color:#ffc400}.heat{display:flex;gap:4px;margin:10px 0}.heat i{flex:1;height:14px;border-radius:4px;background:#333}.heat i.on{background:linear-gradient(90deg,#ffc400,#e63329)}button,.btn{background:#e63329;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;text-transform:uppercase;cursor:pointer;display:inline-block;text-decoration:none}input,select{width:100%;padding:12px;border:1px solid #444;border-radius:10px;margin:6px 0 12px;background:#000;color:#fff}.out{background:#000;border:1px solid #333;border-radius:12px;padding:14px;white-space:pre-line}.small{font-size:12px;color:#999}</style></head><body><header><div class="logo">Dave's <span>Hot Chicken</span></div></header><main>
<h1>premium price, predictable plate</h1>
<section class="card"><label>Combo</label><select id="c"><option value="12.49">Dave's #1 — 2 tenders + fries</option><option value="14.5">Dave's #2 — 2 sliders + fries</option></select>
<label>Extra sauces</label><select id="s"><option>0</option><option>1</option><option>2</option></select>
<button onclick="calc()">show the plate</button><div class="out" id="out"></div></section>
<script>function calc(){var c=+document.getElementById('c').value,s=+document.getElementById('s').value;document.getElementById('out').textContent='Total: $'+(c+s*1.49).toFixed(2)+'\nIncludes: fries, pickles, Dave\'s Sauce, sliced bread (tenders)\nSwitcher pitch: the photo, the portion, and the price agree before ordering.'}calc()</script></main></body></html>
