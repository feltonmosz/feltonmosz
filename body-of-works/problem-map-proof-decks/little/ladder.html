<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ladder</title><style>*{box-sizing:border-box}body{margin:0;background:#fffdf2;color:#2b2118;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.rides{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.rides button{flex:1;background:#fff;border:3px solid #eab308;padding:13px 4px;font-weight:700;cursor:pointer;border-radius:12px;font-size:14px}
.rides button.on{background:#eab308}
.receipt{background:#fff;border:2px dashed #eab308;border-radius:12px;padding:18px;font-family:monospace;line-height:2;white-space:pre-line;margin:14px 0}
.card{background:#fff;border:2px solid #fef08a;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#a16207;text-decoration:none}
small{color:#8a7a63}a.back{color:#a16207}</style></head><body><main><h1>fare ladder</h1><div class='rides'><button class='on' onclick='go(0,this)'>quote</button><button onclick='go(1,this)'>pickup</button><button onclick='go(2,this)'>receipt</button></div><div class='receipt' id='rc'>QUOTE: fare + discount eligibility</div><p><small>Uncertainty: pins can sit minutes off — pickup escalation attached.</small></p><p><a class='back' href='index.html'>← receipt</a></p><script>var S=['QUOTE: fare + discount eligibility','PICKUP: escalation if no rider in 10 min','RECEIPT: fare explained line by line'];function go(i,b){document.querySelectorAll('.rides button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('rc').textContent=S[i]}</script></main></body></html>
