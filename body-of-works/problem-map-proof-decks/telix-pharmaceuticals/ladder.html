<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ladder</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1024;color:#dbe4ff;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px}h1{font-size:28px;line-height:1.3;color:#fff}
.ladder{margin:20px 0}.rung{display:flex;align-items:center;gap:12px;margin:10px 0}
.dot{border-radius:50%;background:linear-gradient(135deg,#3b82f6,#a855f7);flex:none}
.rung span{font-size:14px;color:#a5b4e8}
.half{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.half button{background:#141d3d;color:#a5b4e8;border:2px solid #3b82f6;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:15px}
.half button.on{background:#3b82f6;color:#fff}
.status{background:#141d3d;border-left:5px solid #a855f7;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #26325e;padding:13px 2px}
.row a{color:#93c5fd;text-decoration:none;font-weight:700}
small{color:#7d8db0}a.back{color:#93c5fd}</style></head><body><main><h1>paired decay ladder</h1><div class='ladder'><div class='rung'><div class='dot' style='width:64px;height:64px'></div><span>see it — imaging</span></div><div class='rung'><div class='dot' style='width:45px;height:45px'></div><span>pair it — theranostics</span></div><div class='rung'><div class='dot' style='width:32px;height:32px'></div><span>treat it — therapy</span></div><div class='rung'><div class='dot' style='width:22px;height:22px'></div><span>prove it — first dose</span></div></div><div class='half'><button class='on' onclick='go(0,this)'>100%</button><button onclick='go(1,this)'>50%</button><button onclick='go(2,this)'>25%</button></div><div class='status' id='st'>Imaging and therapy paired at every rung.</div><p><small>Uncertainty: resubmission timing is undated — the tracker shows what is known, dated.</small></p><p><a class='back' href='index.html'>← ladder</a></p><script>function go(i,b){document.querySelectorAll('.half button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent='Activity '+Math.round(100/Math.pow(2,i))+'% — dose windows planned around decay.'}</script></main></body></html>
