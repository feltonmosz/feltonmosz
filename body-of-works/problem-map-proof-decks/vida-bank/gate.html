<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vida Bank tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f2f7f2;color:#14261c}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#1d7a4f}h1{color:#0f4d30}.sub{color:#3d5a48}.c{border:1px solid #cfe8d8;border-radius:18px}.c h2,.c h2 a{color:#0f4d30}.num{font-size:32px;font-weight:800;color:#1d7a4f}.btn{background:#1d7a4f;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#1d7a4f}.out{background:#e9f6ee;border-left:5px solid #1d7a4f}.band{background:#0f4d30}.small{color:#6b8a76}</style></head><body><header><div class="logo">Vida Bank</div></header><main><h1>property gate</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Gate clarity</label><input id="s0" type="range" min="0" max="100" value="45"><label>Fee clarity</label><input id="s1" type="range" min="0" max="100" value="40"><label>Route guidance</label><input id="s2" type="range" min="0" max="100" value="50"><div class="out" id="out"></div><div class="band">Uncertainty band: valuations can still move cases.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#1d7a4f';for(var i=0;i<3;i++){x.strokeRect(80+i*60,60+i*40,540-i*120,260-i*80)}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Criteria confidence: '+m+'%\nPlain English: gate first, fee second, route always named.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
