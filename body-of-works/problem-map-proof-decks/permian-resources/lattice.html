<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permian decline lattice</title><style>:root{--navy:#0e2a47;--org:#e87722;--cream:#f7ead9;--ink:#1c1710}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fbf6ee;color:var(--ink)}
header{padding:22px}
.logo{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--navy);line-height:1.05}
.logo small{display:block;color:var(--org);font-size:13px;letter-spacing:5px}
main{max-width:780px;margin:0 auto;padding:14px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--navy);margin:10px 0}
.sub{color:#5a4a38;line-height:1.55}
.strata{margin-top:16px}
.layer{padding:16px 18px;border-left:14px solid var(--org)}
.layer:nth-child(1){background:#f3e2c8}.layer:nth-child(2){background:#ecd3ac;margin-left:12px}.layer:nth-child(3){background:#e3c08d;margin-left:24px}.layer:nth-child(4){background:#d8ad6e;margin-left:36px}.layer:nth-child(5){background:#c9974f;margin-left:48px}.layer:nth-child(6){background:#b9833d;margin-left:60px}.layer:nth-child(7){background:#a8702e;margin-left:72px}.layer:nth-child(8){background:#96601f;margin-left:84px;color:#fff}.layer:nth-child(9){background:#7d4f16;margin-left:96px;color:#fff}
.layer h2{margin:0 0 6px;font-size:18px}.layer h2 a{color:inherit;text-decoration:none}
.num{font-size:34px;font-weight:800;color:var(--navy)}
.chip{background:var(--navy);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:3px;box-shadow:0 4px 0 var(--org)}
input[type=range]{width:100%;accent-color:var(--org)}
.out{background:#fdf3e4;border-left:5px solid var(--org);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
canvas{width:100%;height:190px;background:#fff;border:1px solid #e3c08d}
.small{font-size:12px;color:#7a6a55}</style></head><body><header><div class="logo">PERMIAN<small>RESOURCES</small></div></header><main>
<h1>free-cash-flow band</h1>
<section class="layer"><canvas id="cv" width="700" height="380"></canvas>
<label>LOE discipline</label><input id="loe" type="range" min="0" max="100" value="80">
<label>Waha price strength</label><input id="waha" type="range" min="0" max="100" value="50">
<label>Monitoring coverage</label><input id="mon" type="range" min="0" max="100" value="45">
<label>Acquisition load</label><input id="acq" type="range" min="0" max="100" value="30">
<div class="out" id="out"></div><div class="band">Uncertainty band: inspection findings and gas takeaway can still move the band.</div></section>
<script>function draw(){var cv=document.getElementById('cv'),x=cv.getContext('2d');x.clearRect(0,0,700,380);var loe=+document.getElementById('loe').value,waha=+document.getElementById('waha').value,mon=+document.getElementById('mon').value,acq=+document.getElementById('acq').value;x.strokeStyle='#e87722';x.lineWidth=3;x.beginPath();for(var t=0;t<=12;t++){var q=460/Math.pow(1+0.22*t,0.7);var px=40+t*54,py=340-q*0.55;if(t===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke();x.strokeStyle='#0e2a47';x.beginPath();for(var t2=0;t2<=12;t2++){var q2=460/Math.pow(1+0.22*t2,0.7)*(0.7+mon/300);var px2=40+t2*54,py2=340-q2*0.55;if(t2===0)x.moveTo(px2,py2);else x.lineTo(px2,py2)}x.stroke();var fcf=Math.round(846*(loe/80)*(0.7+waha/160)*(1-acq/350));document.getElementById('out').textContent='FCF band: ~$'+fcf+'M\nPlain English: monitoring coverage is the layer partners read first.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',draw)});draw()</script></main></body></html>
