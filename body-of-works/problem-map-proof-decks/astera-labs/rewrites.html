<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astera Labs rewrites</title><style>:root{--blue:#3c79bc;--sienna:#d5864b;--navy:#0f042e;--ink:#171230}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:var(--ink)}header{padding:22px}.logo{font-size:27px;font-weight:800;color:var(--navy)}.logo b{color:var(--blue)}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12;color:var(--navy)}.sub{color:#463f66;line-height:1.55}.c{background:#fff;border:1px solid #d8e2f2;border-top:6px solid var(--blue);padding:18px;margin:12px 0}.c h2{margin:0 0 6px;color:var(--navy)}.c h2 a{color:var(--navy);text-decoration:none}.num{font-size:34px;font-weight:800;color:var(--blue)}.btn{background:var(--navy);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:3px}input[type=range]{width:100%;accent-color:var(--sienna)}.out{background:#fdf2e8;border-left:5px solid var(--sienna);padding:14px;white-space:pre-line;margin-top:12px}.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}.small{font-size:12px;color:#6b6488}canvas{width:100%;height:190px;background:#fff}</style></head><body><header><div class="logo">ASTERA <b>LABS</b></div></header><main><h1>breadth note</h1><section class="c"><p>“Family: [x]. Stage: [y]. Next milestone: [date].”</p></section></main></body></html>
