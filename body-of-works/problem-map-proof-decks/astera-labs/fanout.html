<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>fanout</title><style>*{box-sizing:border-box}body{margin:0;background:#0f042e;color:#e6e2ff;font-family:'Segoe UI',sans-serif}
main{max-width:700px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#fff}

small{color:#8d84b8}a.back{color:#93c5fd}</style></head><body><main><h1>retimed fan-out</h1><div class='fan'><button class='on' onclick='go(0,this)'>1×</button><button onclick='go(1,this)'>0.707×</button><button onclick='go(2,this)'>0.5×</button></div><div class='status' id='st'>Traces halve per branch — breadth compounds.</div><p><small>Uncertainty: customer ramps move quarters — milestones stay dated.</small></p><p><a class='back' href='index.html'>← fan-out</a></p><script>var S=['1× — anchor customer trace.','0.707× — second-customer ramp.','0.5× — family breadth widening.'];function go(i,b){document.querySelectorAll('.fan button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
