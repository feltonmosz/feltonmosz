<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>echo</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4ff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.echo{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.echo button{flex:1;background:#fff;border:2px solid #2563eb;color:#2563eb;padding:13px 4px;font-weight:700;cursor:pointer;border-radius:999px;font-size:13px}
.echo button.on{background:#2563eb;color:#fff}
.status{background:#0b2a5b;color:#fff;border-radius:14px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #cfe0f5;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#2563eb;text-decoration:none}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>settlement echo</h1><div class='echo'><button class='on' onclick='go(0,this)'>MARKET DAY</button><button onclick='go(1,this)'>ACCOUNT DAY</button><button onclick='go(2,this)'>MOVEMENT</button></div><div class='status' id='st'>Market day: stress status card published.</div><p><small>Uncertainty: stress stretches settling — status stays published.</small></p><p><a class='back' href='index.html'>← echo</a></p><script>var S=['Market day: stress status card published.','Account day: savings access timed.','Movement: seen, settling, spendable per line.'];function go(i,b){document.querySelectorAll('.echo button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
