<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>spiral</title><style>*{box-sizing:border-box}body{margin:0;background:#061a33;color:#dbeafe;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3;color:#fff}
.views{display:flex;gap:8px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.views button{background:#0a2a52;color:#7dd3fc;border:2px solid #0ea5e9;padding:11px 15px;border-radius:999px;cursor:pointer;font-size:14px}
.views button.on{background:#0ea5e9;color:#fff;font-weight:700}
.status{background:#0a2a52;border-radius:14px;padding:18px;line-height:1.7;text-align:left}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #123a6b;padding:14px 2px;text-align:left}
.row a{color:#7dd3fc;text-decoration:none;font-weight:700}
small{color:#7d93b5}a.back{color:#7dd3fc}</style></head><body><main><h1>tri-spiral ledger</h1><svg width='180' height='180' viewBox='0 0 180 180' style='margin:8px auto;display:block'><circle cx='90' cy='90' r='80' fill='none' stroke='#0ea5e9' stroke-width='6'/><circle cx='90' cy='45' r='16' fill='#7dd3fc'/><circle cx='51' cy='112' r='16' fill='#38bdf8'/><circle cx='129' cy='112' r='16' fill='#0284c7'/></svg><div class='views'><button class='on' onclick='go(0,this)'>trust</button><button onclick='go(1,this)'>technology</button><button onclick='go(2,this)'>thought leadership</button></div><div class='status' id='st'>Trust arm: request states collapsed by evidence.</div><p><small>Uncertainty: published TATs shown as bands against actuals.</small></p><p><a class='back' href='index.html'>← spiral</a></p><script>var S=['Trust arm: request states collapsed by evidence.','Technology arm: PAN-folio-bank records entangled, one status.','Thought arm: margin bridge explained before questions form.'];function go(i,b){document.querySelectorAll('.views button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
