<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>decision</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial Black,Arial,sans-serif}
header{background:#000;color:#ffd200;padding:20px;text-align:center;font-size:26px;letter-spacing:2px}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}h1{font-size:28px;line-height:1.25;text-transform:uppercase}
.block{border:4px solid #000;padding:16px;margin:12px 0}.block h2{margin:0 0 4px;font-size:16px;text-transform:uppercase}.block h2 a{color:#000;text-decoration:none}
.block p{font-family:Arial,sans-serif;font-size:14px;margin:0}
.claims{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.claims button{background:#fff;border:3px solid #000;padding:11px 15px;font-weight:700;cursor:pointer;font-size:14px;text-transform:uppercase}
.claims button.on{background:#ffd200}
.status{background:#ffd200;border:4px solid #000;padding:16px;line-height:1.7;font-family:Arial,sans-serif;font-weight:700}
small{color:#555;font-family:Arial,sans-serif}a.back{color:#000}</style></head><body><header>GO DIGIT</header><main><h1>two-line decision</h1><div class='claims'><button class='on' onclick='go(0,this)'>approved</button><button onclick='go(1,this)'>part-approved</button><button onclick='go(2,this)'>denied</button></div><div class='status' id='st'>Assessed: documents complete. Decision: approved in full.</div><p><small>Uncertainty: surveyor reports can extend assessment — the assessed line still shows.</small></p><p><a class='back' href='index.html'>← blocks</a></p><script>var S=['Assessed: documents complete. Decision: approved in full.','Assessed: two items outside cover. Decision: part-approved — items named.','Assessed: event outside policy period. Decision: denied — exact clause cited, appeal open.'];function go(i,b){document.querySelectorAll('.claims button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
