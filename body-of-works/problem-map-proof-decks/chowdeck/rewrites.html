<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>delay copy</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#3a2410;font-family:Georgia,serif}
header{background:#e8720c;color:#fff;padding:26px 20px;text-align:center}header .lg{font-size:30px;font-weight:700}
header p{margin:4px 0 0;font-size:14px;opacity:.9}main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:30px;line-height:1.25}.track{display:flex;align-items:center;margin:26px 0}

.dot.done{background:#e8720c;color:#fff}.bar{flex:1;height:6px;background:#f3d9b8}.bar.done{background:#e8720c}

.price{float:right;color:#e8720c;font-weight:700}

.scen button.on{background:#e8720c;color:#fff}
.msg{background:#fff;border-left:6px solid #e8720c;border-radius:10px;padding:16px;line-height:1.6;min-height:80px}
