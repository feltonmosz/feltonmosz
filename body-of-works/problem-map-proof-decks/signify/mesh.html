<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>mesh</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1428;color:#dbeafe;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#fff}
.bulbs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.bulb{flex:1;background:#12203a;border:2px solid #facc15;border-radius:999px;padding:16px 4px;text-align:center;cursor:pointer;font-size:13px;color:#fde68a}
.bulb.on{background:#facc15;color:#3a2a02;font-weight:700}
.status{background:#12203a;border-left:5px solid #facc15;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #1e3a5f;padding:14px 2px}
.row a{color:#fde68a;text-decoration:none;font-weight:700}
small{color:#7d93b5}a.back{color:#fde68a}</style></head><body><main><h1>mesh warranty clock</h1><div class='bulbs'><div class='bulb on' onclick='go(0,this)'>DAY 0</div><div class='bulb' onclick='go(1,this)'>DAY 7</div><div class='bulb' onclick='go(2,this)'>DAY 30</div></div><div class='status' id='st'>Day 0: warranty clock starts, milestones dated.</div><p><small>Uncertainty: parts supply moves milestones — clock updates first.</small></p><p><a class='back' href='index.html'>← mesh</a></p><script>var S=['Day 0: warranty clock starts, milestones dated.','Day 7: bridge diagnostic result attached.','Day 30: resolution or escalation named.'];function go(i,b){document.querySelectorAll('.bulb').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
