<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>payday lattice</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2fb;color:#16233f;font-family:'Trebuchet MS',sans-serif}
header{padding:24px 20px 6px;text-align:center}header .lg{font-size:30px;font-weight:700;color:#1d4e9e}
header p{color:#5a6e96;margin:2px 0}main{max-width:680px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:27px;text-align:center;line-height:1.3}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0}
.day{background:#fff;border:2px solid #cfdef5;border-radius:10px;padding:12px 2px;text-align:center;cursor:pointer;font-size:14px}
.day.pay{background:#1d4e9e;color:#fff;font-weight:700}.day.sel{border-color:#f59e0b;background:#fff7e0}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(29,78,158,.08)}
.card h2{margin:0 0 6px;font-size:17px}.card h2 a{color:#1d4e9e;text-decoration:none}
.status{background:#1d4e9e;color:#fff;border-radius:14px;padding:18px;line-height:1.7;min-height:80px}
small{color:#7d8db0}a.back{color:#1d4e9e}</style></head><body><header><div class='lg'>Khazna</div><p>payday, advanced</p></header><main><h1>tap the month</h1><div class='cal'><div class='day' onclick='sel(1,this)'>1</div><div class='day' onclick='sel(2,this)'>2</div><div class='day' onclick='sel(3,this)'>3</div><div class='day' onclick='sel(4,this)'>4</div><div class='day' onclick='sel(5,this)'>5</div><div class='day' onclick='sel(6,this)'>6</div><div class='day' onclick='sel(7,this)'>7</div><div class='day' onclick='sel(8,this)'>8</div><div class='day' onclick='sel(9,this)'>9</div><div class='day' onclick='sel(10,this)'>10</div><div class='day' onclick='sel(11,this)'>11</div><div class='day' onclick='sel(12,this)'>12</div><div class='day' onclick='sel(13,this)'>13</div><div class='day' onclick='sel(14,this)'>14</div><div class='day' onclick='sel(15,this)'>15</div><div class='day' onclick='sel(16,this)'>16</div><div class='day' onclick='sel(17,this)'>17</div><div class='day' onclick='sel(18,this)'>18</div><div class='day' onclick='sel(19,this)'>19</div><div class='day' onclick='sel(20,this)'>20</div><div class='day' onclick='sel(21,this)'>21</div><div class='day' onclick='sel(22,this)'>22</div><div class='day' onclick='sel(23,this)'>23</div><div class='day' onclick='sel(24,this)'>24</div><div class='day' onclick='sel(25,this)'>25</div><div class='day' onclick='sel(26,this)'>26</div><div class='day' onclick='sel(27,this)'>27</div><div class='day pay' onclick='sel(28,this)'>28</div></div><div class='status' id='st'>Every day carries a status: stage, next step, expected date.</div><p><small>Uncertainty: employer payroll files can still delay a stage — the status date moves, the user hears first.</small></p><p><a class='back' href='index.html'>← calendar</a></p><script>function sel(d,el){document.querySelectorAll('.day').forEach(function(x){x.classList.remove('sel')});el.classList.add('sel');document.getElementById('st').textContent=d===28?'Day 28 — payday.':'Day '+d+' — stage: verified. Next: OTP. Expected: today.'}</script></main></body></html>
