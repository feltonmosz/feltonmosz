<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>number change</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#e8f6f8;font-family:'Helvetica Neue',sans-serif}
main{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.card{background:linear-gradient(135deg,#1b222b,#0a0e12);border:1px solid #2dd4d8;border-radius:20px;padding:22px;margin:16px 0}
.card .lg{font-size:26px;font-weight:800;color:#2dd4d8}.card .sub{color:#9fb3bd;font-size:13px}
h1{font-size:27px;line-height:1.3}.tiers{display:flex;gap:8px;margin:16px 0}
.tiers button{flex:1;background:#1b222b;color:#2dd4d8;border:2px solid #2dd4d8;border-radius:12px;padding:14px 4px;font-size:17px;font-weight:700;cursor:pointer}
.tiers button.on{background:#2dd4d8;color:#062a2c}
.jar{height:26px;background:#1b222b;border-radius:999px;overflow:hidden;margin:12px 0}.jarfill{height:100%;background:#2dd4d8;transition:width .5s}
.tile{background:#161e26;border-radius:16px;padding:16px;margin:10px 0}.tile h2{margin:0 0 4px;font-size:16px}.tile h2 a{color:#2dd4d8;text-decoration:none}
.status{background:#062a2c;border:1px solid #2dd4d8;border-radius:12px;padding:16px;line-height:1.7}
small{color:#7d93a5}a.back{color:#2dd4d8}</style></head><body><main><h1>number change</h1><div class='status'>Number changes without lockout.</div><p><a class='back' href='fixmap.html'>← limbo points</a></p></main></body></html>
