<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>goalsave</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#e8f6f8;font-family:'Helvetica Neue',sans-serif}
main{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.card{background:linear-gradient(135deg,#1b222b,#0a0e12);border:1px solid #2dd4d8;border-radius:20px;padding:22px;margin:16px 0}
.card .lg{font-size:26px;font-weight:800;color:#2dd4d8}.card .sub{color:#9fb3bd;font-size:13px}
h1{font-size:27px;line-height:1.3}.tiers{display:flex;gap:8px;margin:16px 0}
.tiers button{flex:1;background:#1b222b;color:#2dd4d8;border:2px solid #2dd4d8;border-radius:12px;padding:14px 4px;font-size:17px;font-weight:700;cursor:pointer}
.tiers button.on{background:#2dd4d8;color:#062a2c}
.jar{height:26px;background:#1b222b;border-radius:999px;overflow:hidden;margin:12px 0}.jarfill{height:100%;background:#2dd4d8;transition:width .5s}
.tile{background:#161e26;border-radius:16px;padding:16px;margin:10px 0}.tile h2{margin:0 0 4px;font-size:16px}.tile h2 a{color:#2dd4d8;text-decoration:none}
.status{background:#062a2c;border:1px solid #2dd4d8;border-radius:12px;padding:16px;line-height:1.7}
small{color:#7d93a5}a.back{color:#2dd4d8}</style></head><body><main><h1>pick a tier</h1><div class='tiers'><button onclick='tier(4,this)'>4%</button><button onclick='tier(6,this)'>6%</button><button class='on' onclick='tier(10,this)'>10%</button></div><div class='jar'><div class='jarfill' id='jf' style='width:100%'></div></div><div class='status' id='st'>10% tier selected.</div><p><small>Uncertainty: conditional tiers depend on account behavior — the condition stated up front.</small></p><p><a class='back' href='index.html'>← card</a></p><script>function tier(v,b){document.querySelectorAll('.tiers button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('jf').style.width=(v*10)+'%';document.getElementById('st').textContent=v+'% tier — condition shown before saving starts.'}</script></main></body></html>
