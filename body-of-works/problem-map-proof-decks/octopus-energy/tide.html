<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octopus Energy tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#100030;color:#fff}header{padding:22px}.logo{font-size:28px;font-weight:900;color:#ff4fd8}h1{color:#fff}.sub{color:#cfc4ff}.c{background:#1d0050;color:#fff;border:1px solid #3a1a7a}.c h2,.c h2 a{color:#4fe3ff}.num{font-size:34px;font-weight:900;color:#ff4fd8}.btn{background:#ff4fd8;color:#100030;border:0;padding:11px 18px;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#4fe3ff}.out{background:#2a0070;border-left:5px solid #4fe3ff}.band{background:#060018}.small{color:#9a8fd0}</style></head><body><header><div class="logo">Octopus Energy</div></header><main><h1>bill tide</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Bill clarity</label><input id="s0" type="range" min="0" max="100" value="45"><label>Meter accuracy</label><input id="s1" type="range" min="0" max="100" value="60"><label>Help speed</label><input id="s2" type="range" min="0" max="100" value="50"><div class="out" id="out"></div><div class="band">Uncertainty band: wholesale prices can still move the cap.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#4fe3ff';x.lineWidth=3;x.beginPath();for(var t=0;t<=48;t++){var px=40+t*13,py=190+Math.sin(t/4)*80;if(t===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke();var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Bill confidence: '+m+'%\nPlain English: old rate, new rate, monthly change, help route.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
