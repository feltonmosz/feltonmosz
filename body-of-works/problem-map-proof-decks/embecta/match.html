<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>match</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf7f2;color:#2b1a12;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.match{display:flex;gap:10px;justify-content:center;align-items:center;margin:20px 0;flex-wrap:wrap}
.chip{background:#fff;border:3px solid #e07a3f;border-radius:14px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:15px}
.chip.on{background:#e07a3f;color:#fff}.arrow{font-size:22px;color:#e07a3f}
.status{background:#2b1a12;color:#fff;border-radius:14px;padding:16px;line-height:1.7;text-align:left}
.card{background:#fff;border:2px solid #f3d9c8;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#c2410c;text-decoration:none}
small{color:#8a7a63}a.back{color:#c2410c}</style></head><body><main><h1>refill match lattice</h1><div class='match'><div class='chip on' onclick='go(0,this)'>gauge</div><div class='chip' onclick='go(1,this)'>length</div><div class='chip' onclick='go(2,this)'>code</div></div><div class='status' id='st'>Gauge matched by needle-length color coding.</div><p><small>Uncertainty: pharmacy stock varies — the matching card travels with the patient.</small></p><p><a class='back' href='index.html'>← match</a></p><script>var S=['Gauge matched by needle-length color coding.','Length matched to the previous pack.','Code matched — refill approved at counter.'];function go(i,b){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
