<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>review stepper</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#dbe7f5;font-family:'Courier New',monospace}
.top{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:2px solid #17c3a5;font-size:13px;letter-spacing:2px}
.top b{color:#17c3a5}main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;line-height:1.3;color:#fff;margin:10px 0}.tick{color:#17c3a5}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
td,th{border-bottom:1px solid #22314d;padding:10px 8px;text-align:left}th{color:#7d93b5;font-size:11px;letter-spacing:2px}
td a{color:#17c3a5;text-decoration:none}.amt{color:#ffd166}
.step{display:flex;gap:6px;margin:18px 0}.step button{flex:1;background:#12203a;color:#7d93b5;border:1px solid #22314d;padding:12px 4px;font-family:inherit;font-size:12px;cursor:pointer}
.step button.on{background:#17c3a5;color:#06231c;font-weight:700}
.panel{background:#101c31;border-left:4px solid #17c3a5;padding:16px;min-height:90px;line-height:1.6}
.note{color:#7d93b5;font-size:12px;margin-top:14px;line-height:1.6}
.row{display:flex;justify-content:space-between;border-bottom:1px dashed #22314d;padding:10px 2px;font-size:14px}
a.back{color:#7d93b5;font-size:12px}</style></head><body><div class='top'><b>PAYSTACK</b><span>SETTLEMENT LEDGER</span></div><main><h1>review stepper</h1><p>Tap a stage. This is the notice every merchant should see.</p>
<div class='step'><button class='on' onclick='go(0,this)'>RECEIVED</button><button onclick='go(1,this)'>IN REVIEW</button><button onclick='go(2,this)'>DOCS</button><button onclick='go(3,this)'>DECIDED</button></div>
<div class='panel' id='p'></div><p class='note'>Uncertainty: bank compliance checks can still extend a stage — the date moves, the silence must not.</p><p><a class='back' href='index.html'>← ledger</a></p>
<script>var S=['Day 0 — received. Owner named. Expected decision date shown.','In review — timeline visible, next update dated.','Documents needed — one stable checklist, asked once.','Decided — outcome, reason category, payout date.'];function go(i,b){document.querySelectorAll('.step button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('p').textContent=S[i]}go(0,document.querySelector('.step button'))</script></main></body></html>
