<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>bridge</title><style>*{box-sizing:border-box}body{margin:0;background:#171310;color:#f3e9d8;font-family:Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:30px;line-height:1.25;color:#fff}
.step{margin:10px 0;padding:16px;background:#241c15;border-left:6px solid #f59e0b}
.step:nth-child(odd){margin-left:26px}.step:nth-child(3n){margin-left:52px}
.step h2{margin:0 0 4px;font-size:16px}.step h2 a{color:#fbbf24;text-decoration:none}
label{display:block;margin:14px 0 4px;font-size:14px}input{width:100%;padding:12px;font-size:16px;background:#241c15;border:2px solid #f59e0b;color:#fff;border-radius:6px}
button.go{background:#f59e0b;color:#1a1206;border:0;padding:14px 20px;font-size:16px;font-weight:700;border-radius:6px;margin-top:14px;width:100%;cursor:pointer}
.out{background:#f59e0b;color:#1a1206;padding:16px;margin-top:14px;font-weight:700;line-height:1.7;white-space:pre-line}
small{color:#a89880}a.back{color:#fbbf24}</style></head><body><main><h1>discount bridge</h1><label>Benchmark price ($/t)</label><input id='bp' type='number' value='120'><label>Mix discount (%)</label><input id='md' type='number' value='15.7'><button class='go' onclick='calc()'>walk the bridge</button><div class='out' id='o'></div><p><small>Uncertainty: cargo mix shifts each quarter — the bridge is republished, not assumed.</small></p><p><a class='back' href='index.html'>← seam</a></p><script>function calc(){var b=+document.getElementById('bp').value||0,d=+document.getElementById('md').value||0;document.getElementById('o').textContent='Benchmark: $'+b.toFixed(2)+'/t\nMix step: -'+d+'%\nRealised: $'+(b*(1-d/100)).toFixed(2)+'/t'}calc()</script></main></body></html>
