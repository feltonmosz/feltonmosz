<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>queue</title><style>*{box-sizing:border-box}body{margin:0;background:#2a1030;color:#f3e8f7;font-family:'Trebuchet MS',sans-serif}
header{text-align:center;padding:24px 16px 4px}header .lg{font-size:28px;font-weight:700;color:#f5c542}header p{color:#c9a8d8;margin:2px 0}
main{max-width:640px;margin:0 auto;padding:14px 16px 60px}h1{font-size:26px;text-align:center;line-height:1.3}
.ticket{background:#fff;color:#2a1030;border-radius:6px;padding:18px;margin:14px 0;position:relative;border-top:6px solid #f5c542}
.ticket:before{content:'CASE';position:absolute;top:10px;right:14px;color:#b03a5b;font-weight:700;border:2px solid #b03a5b;padding:2px 8px;border-radius:4px;transform:rotate(6deg);font-size:12px}
.ticket h2{margin:0 0 4px;font-size:16px}.ticket h2 a{color:#5b21b6;text-decoration:none}
.ref{display:flex;gap:8px;margin:16px 0}.ref input{flex:1;padding:12px;font-size:16px;border:2px solid #f5c542;border-radius:8px;background:#3a1a42;color:#fff}
.ref button{background:#f5c542;color:#2a1030;border:0;padding:12px 18px;font-weight:700;border-radius:8px;cursor:pointer}
.status{background:#f5c542;color:#2a1030;border-radius:10px;padding:16px;line-height:1.7;font-weight:700}
small{color:#c9a8d8}a.back{color:#f5c542}</style></head><body><header><div class='lg'>Signature Bank</div><p>make your mark</p></header><main><h1>countersign queue</h1><div class='ref'><input id='r' value='SIG-2026-0417'><button onclick='look()'>check</button></div><div class='status' id='st'>One reference. One status. One next step.</div><p><small>Uncertainty: regulator escalations can extend a case — the owner and date still show.</small></p><p><a class='back' href='index.html'>← case desk</a></p><script>function look(){var r=document.getElementById('r').value||'SIG-0000';document.getElementById('st').textContent=r+' · owner named · next update dated.'}</script></main></body></html>
