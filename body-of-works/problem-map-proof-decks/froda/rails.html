<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Froda tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f2f7fb;color:#12263d}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#1d6e9e}h1{color:#123a5f}.sub{color:#3d5a7a}.c{border:1px solid #cfe2f5;border-radius:16px}.c h2,.c h2 a{color:#123a5f}.num{font-size:32px;font-weight:800;color:#1d6e9e}.btn{background:#1d6e9e;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#1d6e9e}.out{background:#eef6fc;border-left:5px solid #1d6e9e}.band{background:#123a5f}.small{color:#6b84a8}</style></head><body><header><div class="logo">Froda</div></header><main><h1>decision rails</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Decision clarity</label><input id="s0" type="range" min="0" max="100" value="40"><label>Decline clarity</label><input id="s1" type="range" min="0" max="100" value="35"><label>Repayment clarity</label><input id="s2" type="range" min="0" max="100" value="45"><div class="out" id="out"></div><div class="band">Uncertainty band: SME cashflow shocks can still move arrears.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#1d6e9e';for(var i=0;i<2;i++){x.beginPath();x.moveTo(60,110+i*120);x.lineTo(640,110+i*120);x.stroke()}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Decision confidence: '+m+'%\nPlain English: amount, total cost, pull timing, next step.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
