<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>collections pace</title><style>*{box-sizing:border-box}body{margin:0;background:#171717;color:#f5efe6;font-family:'DM Sans',Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:29px;line-height:1.25;color:#fff}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:18px 0}.cell{aspect-ratio:1;background:#2a2a2a;border:1px solid #ea7124}
.cell.hot{background:#ea7124}
.panel{background:#222;border-top:5px solid #ea7124;padding:16px;margin:12px 0}.panel h2{margin:0 0 4px;font-size:16px}.panel h2 a{color:#ffb27a;text-decoration:none}
label{display:block;margin:14px 0 4px;font-size:14px}input{width:100%;padding:12px;font-size:16px;background:#222;border:2px solid #ea7124;color:#fff;border-radius:6px}
button.go{background:#ea7124;color:#fff;border:0;padding:14px;font-size:16px;font-weight:700;border-radius:6px;width:100%;margin-top:14px;cursor:pointer}
.out{background:#ea7124;color:#1a0d02;padding:16px;margin-top:14px;font-weight:700;line-height:1.7;white-space:pre-line}
small{color:#a89a86}a.back{color:#ffb27a}</style></head><body><main><h1>collections pace</h1><div class='out'>Collections paced to orders.</div><p><a class='back' href='fixmap.html'>← dim cells</a></p></main></body></html>
