<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planity tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#fafafa;color:#111}header{padding:22px;text-align:center}.logo{font-size:28px;font-weight:800;color:#111}h1{color:#111}.sub{color:#555}.c{border:1px solid #e5e5e5}.c h2,.c h2 a{color:#111}.num{font-size:32px;font-weight:800;color:#111}.btn{background:#111;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#111}.out{background:#f2f2f2;border-left:5px solid #111}.band{background:#111}.small{color:#999}</style></head><body><header><div class="logo">Planity</div></header><main><h1>chair time</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Deposit clarity</label><input id="s0" type="range" min="0" max="100" value="40"><label>Refund speed</label><input id="s1" type="range" min="0" max="100" value="35"><label>Status updates</label><input id="s2" type="range" min="0" max="100" value="45"><div class="out" id="out"></div><div class="band">Uncertainty band: bank chargebacks can still extend disputes.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#111';for(var i=0;i<4;i++){x.strokeRect(60,60+i*70,580,44)}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Deposit trust: '+m+'%\nPlain English: who holds it, who refunds it, next update date.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
