<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>blocks</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfbfd;color:#1a1a2e;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.blk{background:#fff;border:2px solid #4f46e5;border-radius:12px;padding:16px 8px;text-align:center;font-weight:700;cursor:pointer;font-size:13px;color:#4f46e5}
.blk.on{background:#4f46e5;color:#fff}
.status{background:#1a1a2e;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:2px solid #e0e7ff;padding:14px 2px}
.row a{color:#4f46e5;text-decoration:none;font-weight:700}
small{color:#64748b}a.back{color:#4f46e5}</style></head><body><main><h1>locale blocks</h1><div class='blocks'><div class='blk on' onclick='go(0,this)'>PLAN DIFF</div><div class='blk' onclick='go(1,this)'>FORECAST</div><div class='blk' onclick='go(2,this)'>GRANDFATHER</div></div><div class='status' id='st'>Plan diff: what changes in my plan, one card.</div><p><small>Uncertainty: usage moves forecasts — worksheets update monthly.</small></p><p><a class='back' href='index.html'>← blocks</a></p><script>var S=['Plan diff: what changes in my plan, one card.','Forecast: usage worksheet with buckets.','Grandfather: existing plans protected, dated.'];function go(i,b){document.querySelectorAll('.blk').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
