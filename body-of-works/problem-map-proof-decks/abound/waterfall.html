<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>waterfall</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f9ff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.flow{margin:18px 0}.fbar{padding:13px 16px;color:#fff;font-weight:700;margin:6px 0;cursor:pointer}
.f1{background:#2563eb}.f2{background:#3b82f6}.f3{background:#60a5fa}.f4{background:#0b2a5b}
.fbar.on{outline:3px solid #f59e0b}
.status{background:#0b2a5b;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #dbeafe;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#2563eb;text-decoration:none}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>residual waterfall</h1><div class='flow'><div class='fbar f1 on' style='width:100%' onclick='go(0,this)'>STAGE</div><div class='fbar f2' style='width:82%' onclick='go(1,this)'>WAITING</div><div class='fbar f4' style='width:64%' onclick='go(2,this)'>NEXT UPDATE</div></div><div class='status' id='st'>Status card: stage, waiting item, next update.</div><p><small>Uncertainty: third-party checks move timings — updates stay timed.</small></p><p><a class='back' href='index.html'>← waterfall</a></p><script>var S=['Status card: stage, waiting item, next update.','Waiting: exact item named, owner attached.','Next update: timed, urgent route open.'];function go(i,b){document.querySelectorAll('.fbar').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
