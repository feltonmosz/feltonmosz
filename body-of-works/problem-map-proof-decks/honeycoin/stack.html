<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>stack</title><style>*{box-sizing:border-box}body{margin:0;background:#1a1207;color:#fde68a;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#fff}
.stack{margin:18px 0}.cell{padding:14px 16px;margin:6px 0;background:#2a1e0a;border:1px solid #f59e0b;cursor:pointer}
.cell.on{background:#f59e0b;color:#3a2a02;font-weight:700}
.status{background:#f59e0b;color:#3a2a02;border-radius:12px;padding:16px;line-height:1.7;font-weight:700}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #3a2a10;padding:14px 2px}
.row a{color:#fbbf24;text-decoration:none;font-weight:700}
small{color:#a88d5a}a.back{color:#fbbf24}</style></head><body><main><h1>conversion stack</h1><div class='stack'><div class='cell on' onclick='go(0,this)'>USDC ON BASE</div><div class='cell' onclick='go(1,this)'>CARD SPEND</div><div class='cell' onclick='go(2,this)'>FEES</div></div><div class='status' id='st'>USDC on Base: conversion fee published per transaction.</div><p><small>Uncertainty: network fees move — card fees stay published.</small></p><p><a class='back' href='index.html'>← stack</a></p><script>var S=['USDC on Base: conversion fee published per transaction.','Card spend: FX spread stated before purchase.','Fees: full schedule on one page.'];function go(i,b){document.querySelectorAll('.cell').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
