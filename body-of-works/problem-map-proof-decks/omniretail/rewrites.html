<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>terms copy</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#1c2b16;font-family:Verdana,sans-serif}
header{background:#14532d;color:#fff;padding:18px 20px}header .lg{font-size:24px;font-weight:700;letter-spacing:1px}
header p{margin:2px 0 0;font-size:13px;color:#bfe3cd}main{max-width:900px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:26px;line-height:1.3}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:18px 0}
.tile{background:#fff;border-top:8px solid #16a34a;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tile h2{margin:0 0 6px;font-size:16px}.tile h2 a{color:#14532d;text-decoration:none}.tile p{font-size:13px;line-height:1.5;margin:0}
.tag{display:inline-block;background:#dcfce7;color:#14532d;font-size:11px;padding:3px 8px;border-radius:3px;margin-bottom:8px}
label{display:block;font-size:13px;margin:14px 0 4px}input{width:100%;padding:12px;font-size:16px;border:2px solid #bbd6c2;border-radius:6px}
button.go{background:#16a34a;color:#fff;border:0;padding:14px 22px;font-size:16px;border-radius:6px;margin-top:16px;cursor:pointer;width:100%}
.out{background:#14532d;color:#fff;padding:18px;border-radius:8px;margin-top:16px;line-height:1.7;white-space:pre-line}
small{color:#6b7d63}a.back{color:#14532d}</style></head><body><header><div class='lg'>OmniRetail</div><p>wholesale shelves, stocked on credit</p></header><main><h1>terms copy</h1><div class='out'>“Limit ₦500,000. Due 30 days. Late: reminder, call, pause.”</div><p><a class='back' href='fixmap.html'>← fix map</a></p></main></body></html>
