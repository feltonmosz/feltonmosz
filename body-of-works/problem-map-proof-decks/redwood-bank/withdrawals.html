<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>withdrawal read-back</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf6ec;color:#3a2410;font-family:Georgia,serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.clock{width:170px;height:170px;border-radius:50%;border:8px solid #b45309;margin:18px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.clock .day{font-size:38px;font-weight:700}.clock .lab{font-size:12px;color:#8a6d3b}
.days{display:flex;gap:8px;justify-content:center;margin:14px 0}.days button{background:#fff;border:2px solid #b45309;color:#b45309;padding:10px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
.days button.on{background:#b45309;color:#fff;font-weight:700}
.status{background:#3a2410;color:#fff;border-radius:14px;padding:16px;line-height:1.7;text-align:left}
.card{background:#fff;border:2px solid #f0dfc0;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#b45309;text-decoration:none}
small{color:#9a7a55}a.back{color:#b45309}</style></head><body><main><h1>withdrawal read-back</h1><div class='status'>Read-back script for withdrawals.</div><p><a class='back' href='fixmap.html'>← clock points</a></p></main></body></html>
