<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redwood Bank tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f7f3ee;color:#2a1a12}header{padding:22px}.logo{font-size:27px;font-weight:800;color:#7a2e1d}h1{color:#5a1f12}.sub{color:#6b4a3a}.c{border:1px solid #e8d5c4;border-left:10px solid #7a2e1d}.c h2,.c h2 a{color:#5a1f12}.num{font-size:32px;font-weight:800;color:#7a2e1d}.btn{background:#7a2e1d;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:3px}input[type=range]{accent-color:#7a2e1d}.out{background:#fdf1e9;border-left:5px solid #7a2e1d}.band{background:#5a1f12}.small{color:#9a7a68}</style></head><body><header><div class="logo">Redwood Bank</div></header><main><h1>opening clock</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Login tracking</label><input id="s0" type="range" min="0" max="100" value="40"><label>Opening updates</label><input id="s1" type="range" min="0" max="100" value="45"><label>Withdrawal clarity</label><input id="s2" type="range" min="0" max="100" value="50"><div class="out" id="out"></div><div class="band">Uncertainty band: postal delays can still move login IDs.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#7a2e1d';for(var i=0;i<3;i++){x.beginPath();x.moveTo(60,80+i*100);x.lineTo(640,80+i*100);x.stroke()}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Access confidence: '+m+'%\nPlain English: confirm, read back, release — on a clock customers can see.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
