<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ladder</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ff;color:#241043;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#5b21b6}
.gates{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.gate{flex:1;background:#fff;border:2px solid #7c3aed;color:#5b21b6;padding:12px 2px;text-align:center;font-weight:700;cursor:pointer;border-radius:10px;font-size:11px}
.gate.on{background:#7c3aed;color:#fff}
.status{background:#241043;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #e9d5ff;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#7c3aed;text-decoration:none}
small{color:#7a6a9a}a.back{color:#7c3aed}</style></head><body><main><h1>escritura ladder</h1><div class='gates'><div class='gate on' onclick='go(0,this)'>TITLE×BANK</div><div class='gate' onclick='go(1,this)'>PAZ Y SALVO×NOTARY</div><div class='gate' onclick='go(2,this)'>PROMESA×DESEMBOLSO</div></div><div class='status' id='st'>Title×bank: lien status meets disbursement readiness.</div><p><small>Uncertainty: bank timing moves gates — dates stay promised.</small></p><p><a class='back' href='index.html'>← ladder</a></p><script>var S=['Title×bank: lien status meets disbursement readiness.','Paz y salvo×notary: clearance meets notary timing.','Promesa×desembolso: promise meets payment.'];function go(i,b){document.querySelectorAll('.gate').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
