<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sotera completion</title><style>:root{--teal:#007a87;--navy:#0a2e4a;--ink:#14232e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f8f9;color:var(--ink)}
header{padding:22px;text-align:center}
.logo{font-size:27px;font-weight:800;letter-spacing:2px;color:var(--navy)}
.logo small{display:block;font-size:11px;letter-spacing:3px;color:var(--teal)}
main{max-width:780px;margin:0 auto;padding:16px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--navy);margin:10px 0}
.sub{color:#3d5266;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cell{background:#fff;border:1px solid #cfe4e8;padding:16px;position:relative}
.cell:before{content:"";position:absolute;inset:6px;border:1px dashed #cfe4e8;pointer-events:none}
.cell h2{margin:0 0 6px;font-size:17px;color:var(--navy)}.cell h2 a{color:var(--navy);text-decoration:none}
.num{font-size:32px;font-weight:800;color:var(--teal)}
.shield{background:var(--teal);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%)}
input[type=range]{width:100%;accent-color:var(--teal)}
.out{background:#e9f4f5;border-left:5px solid var(--teal);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
canvas{width:100%;height:190px;background:#fff;border:1px solid #cfe4e8}
.small{font-size:12px;color:#6b7f92}
@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">SOTERA HEALTH<small>SAFEGUARDING GLOBAL HEALTH</small></div></header><main><h1>completion, dated</h1><section class="cell"><p>Enhancement completion by facility with dates.</p></section></main></body></html>
