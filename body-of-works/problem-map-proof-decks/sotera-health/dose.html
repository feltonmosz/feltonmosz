<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>dose</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7f5;color:#0c2b26;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.chamber{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.cell{aspect-ratio:1;background:#ccfbf1;border:2px dashed #0f766e;border-radius:8px;cursor:pointer}
.cell.on{background:#0f766e}
.status{background:#0c2b26;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:1px solid #ccfbf1;border-radius:14px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#0f766e;text-decoration:none}
small{color:#5f7a72}a.back{color:#0f766e}</style></head><body><main><h1>dose field</h1><div class='chamber'><div class='cell on' onclick='go(0,this)'></div><div class='cell' onclick='go(1,this)'></div><div class='cell' onclick='go(2,this)'></div><div class='cell' onclick='go(3,this)'></div><div class='cell' onclick='go(4,this)'></div><div class='cell' onclick='go(5,this)'></div><div class='cell' onclick='go(6,this)'></div><div class='cell' onclick='go(7,this)'></div><div class='cell' onclick='go(8,this)'></div><div class='cell' onclick='go(9,this)'></div><div class='cell' onclick='go(10,this)'></div><div class='cell' onclick='go(11,this)'></div></div><div class='status' id='st'>Tap a cell: dose falls with distance, throughput holds.</div><p><small>Uncertainty: trial outcomes are not predictable — completion facts stay separated.</small></p><p><a class='back' href='index.html'>← chamber</a></p><script>function go(i,b){document.querySelectorAll('.cell').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent='Cell '+(i+1)+': dose verified, sterile throughput on plan.'}</script></main></body></html>
