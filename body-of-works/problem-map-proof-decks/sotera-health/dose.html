<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sotera dose field</title><style>:root{--teal:#007a87;--navy:#0a2e4a;--ink:#14232e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f8f9;color:var(--ink)}
header{padding:22px;text-align:center}
.logo{font-size:27px;font-weight:800;letter-spacing:2px;color:var(--navy)}
.logo small{display:block;font-size:11px;letter-spacing:3px;color:var(--teal)}
main{max-width:780px;margin:0 auto;padding:16px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--navy);margin:10px 0}
.sub{color:#3d5266;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cell{background:#fff;border:1px solid #cfe4e8;padding:16px;position:relative}
.cell:before{content:"";position:absolute;inset:6px;border:1px dashed #cfe4e8;pointer-events:none}
.cell h2{margin:0 0 6px;font-size:17px;color:var(--navy)}.cell h2 a{color:var(--navy);text-decoration:none}
.num{font-size:32px;font-weight:800;color:var(--teal)}
.shield{background:var(--teal);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%)}
input[type=range]{width:100%;accent-color:var(--teal)}
.out{background:#e9f4f5;border-left:5px solid var(--teal);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
canvas{width:100%;height:190px;background:#fff;border:1px solid #cfe4e8}
.small{font-size:12px;color:#6b7f92}
@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">SOTERA HEALTH<small>SAFEGUARDING GLOBAL HEALTH</small></div></header><main>
<h1>sterile throughput</h1>
<section class="cell"><canvas id="cv" width="700" height="380"></canvas>
<label>Source age (years)</label><input id="age" type="range" min="0" max="10" value="2">
<label>Distance factor</label><input id="dist" type="range" min="1" max="10" value="3">
<label>Chamber capacity</label><input id="cap" type="range" min="0" max="100" value="70">
<label>Litigation drag</label><input id="lit" type="range" min="0" max="100" value="40">
<div class="out" id="out"></div><div class="band">Uncertainty band: trial outcomes and enhancement timing can still move trust.</div></section>
<script>function draw(){var cv=document.getElementById('cv'),x=cv.getContext('2d');x.clearRect(0,0,700,380);var age=+document.getElementById('age').value,dist=+document.getElementById('dist').value,cap=+document.getElementById('cap').value,lit=+document.getElementById('lit').value;x.strokeStyle='#007a87';x.lineWidth=3;x.beginPath();for(var t=0;t<=10;t++){var dose=Math.exp(-0.131*t)/(dist*dist);var px=50+t*62,py=330-dose*2600;if(py<20)py=20;if(t===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke();var thr=Math.round(cap*Math.exp(-0.131*age)/(1+lit/250));document.getElementById('out').textContent='Sterile throughput index: '+thr+'%\nPlain English: capacity proves safety only when the completion story is public.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',draw)});draw()</script></main></body></html>
