<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corteva rewrites</title><style>:root{--blue:#0072ce;--sky:#459aff;--ink:#0d1b26}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f9fd;color:var(--ink)}
header{padding:20px 22px 6px}
.logo{font-size:30px;font-weight:800;letter-spacing:4px;color:var(--blue)}
main{max-width:780px;margin:0 auto;padding:14px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--blue);margin:10px 0}
.sub{color:#3d5266;line-height:1.55}
.rows{border-top:3px solid var(--blue);margin-top:18px}
.row{display:flex;gap:16px;align-items:baseline;padding:16px 4px;border-bottom:1px dashed #b9d6ee}
.row:nth-child(even){padding-left:34px}
.row h2{margin:0;font-size:18px;min-width:190px;color:var(--blue)}.row h2 a{color:var(--blue);text-decoration:none}
.row p{margin:0}
.num{font-size:34px;font-weight:800;color:var(--blue)}
.tag{background:var(--blue);color:#fff;border:0;padding:11px 18px 11px 26px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
input[type=range]{width:100%;accent-color:var(--blue)}
.out{background:#eaf4fd;border-left:5px solid var(--sky);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--blue);color:#fff;padding:12px;margin-top:12px;font-size:14px}
canvas{width:100%;height:200px;background:#fff;border:1px solid #d3e6f5}
.small{font-size:12px;color:#6b7f92}</style></head><body><header><div class="logo">CORTEVA</div></header><main><h1>price-promise note</h1><section class="row"><div><p>“This season’s price, in writing, before you plant.”</p></div></section></main></body></html>
