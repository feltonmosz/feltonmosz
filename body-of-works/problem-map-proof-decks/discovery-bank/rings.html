<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>rings</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#1a2b4a;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.rings{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}.rings button{background:#fff;border:2px solid #2563eb;color:#2563eb;padding:10px 14px;border-radius:999px;cursor:pointer}

.status{background:#1a2b4a;color:#fff;border-radius:14px;padding:16px;line-height:1.7;text-align:left}

small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>vitality rings</h1><svg width='190' height='190' viewBox='0 0 190 190' style='margin:8px auto;display:block'><circle cx='95' cy='95' r='84' fill='none' stroke='#2563eb' stroke-width='7'/><circle cx='95' cy='95' r='58' fill='none' stroke='#60a5fa' stroke-width='7'/><circle cx='95' cy='95' r='34' fill='none' stroke='#93c5fd' stroke-width='7'/><circle cx='95' cy='95' r='10' fill='#2563eb'/></svg><div class='rings'><button class='on' onclick='go(0,this)'>change</button><button onclick='go(1,this)'>clock</button><button onclick='go(2,this)'>dispute</button></div><div class='status' id='st'>Change propagates across all rings at once.</div><p><small>Uncertainty: number ownership disputes take time — path published.</small></p><p><a class='back' href='index.html'>← rings</a></p><script>var S=['Change propagates across all rings at once.','Clock: dated change timeline, one owner.','Dispute: number-ownership path published.'];function go(i,b){document.querySelectorAll('.rings button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
