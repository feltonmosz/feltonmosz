<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>pause</title><style>*{box-sizing:border-box}body{margin:0;background:#f6fffb;color:#0b241a;font-family:'Helvetica Neue',sans-serif}
main{max-width:620px;margin:0 auto;padding:24px 18px 60px}h1{font-size:27px;line-height:1.3}
.ledger{border-left:4px solid #10b981;margin:20px 0 20px 10px;padding-left:22px}
.stop{position:relative;margin:22px 0}.stop:before{content:'';position:absolute;left:-33px;top:4px;width:18px;height:18px;background:#10b981;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #10b981}
.stop h2{margin:0 0 4px;font-size:16px}.stop h2 a{color:#047857;text-decoration:none}
.stamps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.stamps button{background:#fff;border:2px solid #10b981;color:#047857;padding:10px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.stamps button.on{background:#10b981;color:#fff}
.status{background:#064e3b;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
small{color:#6b8a7a}a.back{color:#047857}</style></head><body><main><h1>dated pause</h1><div class='stamps'><button class='on' onclick='go(0,this)'>day 0</button><button onclick='go(1,this)'>day 2</button><button onclick='go(2,this)'>day 5</button></div><div class='status' id='st'>Day 0 — restriction stamped with trigger and next-update date.</div><p><small>Uncertainty: partner-bank reviews can extend a pause — the date moves, the silence does not.</small></p><p><a class='back' href='index.html'>← ledger</a></p><script>var S=['Day 0 — restriction stamped with trigger and next-update date.','Day 2 — documents checked, missing item named exactly.','Day 5 — released or escalated with owner and new date.'];function go(i,b){document.querySelectorAll('.stamps button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
