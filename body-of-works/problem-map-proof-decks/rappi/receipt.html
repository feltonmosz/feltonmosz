<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>receipt</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f5;color:#2b1608;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.receipt{background:#fff;border:2px dashed #ff441f;border-radius:12px;padding:18px;font-family:monospace;line-height:2;white-space:pre-line;margin:16px 0}
.expand{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.expand button{flex:1;background:#fff;border:2px solid #ff441f;color:#ff441f;padding:11px 4px;font-weight:700;cursor:pointer;border-radius:8px;font-size:12px}
.expand button.on{background:#ff441f;color:#fff}
.card{background:#fff;border:2px solid #ffd9cc;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#ff441f;text-decoration:none}
small{color:#9a7a68}a.back{color:#ff441f}</style></head><body><main><h1>recursive receipt</h1><div class='receipt' id='rc'>ORDER → DELIVERY → DISPUTE
SAME RECEIPT, EXPANDED</div><div class='expand'><button class='on' onclick='go(0,this)'>CHARGE</button><button onclick='go(1,this)'>PROOF</button><button onclick='go(2,this)'>CASE</button></div><p><small>Uncertainty: courier no-shows happen — proof flow attached.</small></p><p><a class='back' href='index.html'>← receipt</a></p><script>var S=['CHARGE: Prime/Pro status + amount','PROOF: arrival evidence attached','CASE: number, decision, deadline'];function go(i,b){document.querySelectorAll('.expand button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('rc').textContent=S[i]}</script></main></body></html>
