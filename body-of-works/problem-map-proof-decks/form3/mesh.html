<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>mesh</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a12;color:#e5e7eb;font-family:'Segoe UI',sans-serif}
main{max-width:700px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3;color:#fff}
.nodes{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.node{flex:1;background:#14141f;border:2px solid #6366f1;color:#a5b4fc;padding:13px 6px;text-align:center;font-weight:700;cursor:pointer;border-radius:10px;font-size:13px}
.node.on{background:#6366f1;color:#fff}
.status{background:#14141f;border-left:5px solid #6366f1;padding:16px;line-height:1.7}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #23233a;padding:14px 2px}
.row a{color:#a5b4fc;text-decoration:none;font-weight:700}
small{color:#8a8aa3}a.back{color:#a5b4fc}</style></head><body><main><h1>scheme incident mesh</h1><div class='nodes'><div class='node on' onclick='go(0,this)'>DETECT</div><div class='node' onclick='go(1,this)'>UPDATE</div><div class='node' onclick='go(2,this)'>POSTMORTEM</div></div><div class='status' id='st'>Detect: incident card issued with scheme impact.</div><p><small>Uncertainty: scheme-side faults move ETAs — updates stay timed.</small></p><p><a class='back' href='index.html'>← mesh</a></p><script>var S=['Detect: incident card issued with scheme impact.','Update: next update at promised time.','Postmortem: ETA published with card.'];function go(i,b){document.querySelectorAll('.node').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
