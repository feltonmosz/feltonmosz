<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>fields</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbf2;color:#1c2b1a;font-family:'Segoe UI',sans-serif}
main{max-width:660px;margin:0 auto;padding:24px 16px 60px}h1{font-size:27px;line-height:1.3}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.field{aspect-ratio:1;background:#dcf2c8;border:2px solid #65a30d;border-radius:8px;cursor:pointer}
.field.on{background:#65a30d}
.status{background:#1c2b1a;color:#fff;border-radius:12px;padding:16px;line-height:1.7}
.card{background:#fff;border:2px solid #dcf2c8;border-radius:16px;padding:15px;margin:10px 0}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#4d7c0f;text-decoration:none}
small{color:#6b7a5f}a.back{color:#4d7c0f}</style></head><body><main><h1>threshold fields</h1><div class='fields'><div class='field on' onclick='go(0,this)'></div><div class='field' onclick='go(1,this)'></div><div class='field' onclick='go(2,this)'></div><div class='field' onclick='go(3,this)'></div><div class='field' onclick='go(4,this)'></div><div class='field' onclick='go(5,this)'></div><div class='field' onclick='go(6,this)'></div><div class='field' onclick='go(7,this)'></div><div class='field' onclick='go(8,this)'></div><div class='field' onclick='go(9,this)'></div><div class='field' onclick='go(10,this)'></div><div class='field' onclick='go(11,this)'></div></div><div class='status' id='st'>Tap a field: threshold, window, coverage basis.</div><p><small>Uncertainty: weather moves triggers — windows stay stated.</small></p><p><a class='back' href='index.html'>← fields</a></p><script>function go(i,b){document.querySelectorAll('.field').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent='Field '+(i+1)+': coverage basis stated — what payout covers, plainly.'}</script></main></body></html>
