<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>notice windows</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0}
.day{aspect-ratio:1;background:#fff;border:2px solid #dbeafe;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.day.due{background:#2563eb;color:#fff;font-weight:700}.day.on{outline:3px solid #f59e0b}
.status{background:#0b2a5b;color:#fff;border-radius:12px;padding:16px;line-height:1.7;text-align:left}
.card{background:#fff;border:2px solid #dbeafe;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#2563eb;text-decoration:none}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>notice windows</h1><div class='status'>Minimum notice before due dates.</div><p><a class='back' href='fixmap.html'>← date joins</a></p></main></body></html>
