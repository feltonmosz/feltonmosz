<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>cascade</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#0b2a5b;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0}
.day{aspect-ratio:1;background:#fff;border:2px solid #dbeafe;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.day.due{background:#2563eb;color:#fff;font-weight:700}.day.on{outline:3px solid #f59e0b}
.status{background:#0b2a5b;color:#fff;border-radius:12px;padding:16px;line-height:1.7;text-align:left}
.card{background:#fff;border:2px solid #dbeafe;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#2563eb;text-decoration:none}
small{color:#64748b}a.back{color:#2563eb}</style></head><body><main><h1>due-date cascade</h1><div class='cal'><div class='day' onclick='go(0,this)'>1</div><div class='day' onclick='go(1,this)'>2</div><div class='day' onclick='go(2,this)'>3</div><div class='day' onclick='go(3,this)'>4</div><div class='day' onclick='go(4,this)'>5</div><div class='day' onclick='go(5,this)'>6</div><div class='day' onclick='go(6,this)'>7</div><div class='day' onclick='go(7,this)'>8</div><div class='day' onclick='go(8,this)'>9</div><div class='day' onclick='go(9,this)'>10</div><div class='day' onclick='go(10,this)'>11</div><div class='day' onclick='go(11,this)'>12</div><div class='day' onclick='go(12,this)'>13</div><div class='day due' onclick='go(13,this)'>14</div><div class='day' onclick='go(14,this)'>15</div><div class='day' onclick='go(15,this)'>16</div><div class='day' onclick='go(16,this)'>17</div><div class='day' onclick='go(17,this)'>18</div><div class='day' onclick='go(18,this)'>19</div><div class='day' onclick='go(19,this)'>20</div><div class='day' onclick='go(20,this)'>21</div><div class='day' onclick='go(21,this)'>22</div><div class='day' onclick='go(22,this)'>23</div><div class='day' onclick='go(23,this)'>24</div><div class='day' onclick='go(24,this)'>25</div><div class='day' onclick='go(25,this)'>26</div><div class='day' onclick='go(26,this)'>27</div><div class='day' onclick='go(27,this)'>28</div></div><div class='status' id='st'>Tap a day: notice, tracker, pause rules apply.</div><p><small>Uncertainty: invoice timing moves due dates — notice windows protect SMEs.</small></p><p><a class='back' href='index.html'>← calendar</a></p><script>function go(i,b){document.querySelectorAll('.day').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent='Day '+(i+1)+': collection paused on same-day payment.'}</script></main></body></html>
