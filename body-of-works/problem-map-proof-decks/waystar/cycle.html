<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waystar tool</title><style>:root{--sky:#4e97dd;--navy:#10162c;--ink:#14202e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef6fd;color:var(--ink)}header{padding:22px;text-align:center}.logo{font-size:28px;font-weight:800;color:var(--navy)}.logo span{color:var(--sky)}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12;color:var(--navy)}.sub{color:#3d5266;line-height:1.55}.c{background:#fff;border:1px solid #cfe4f8;border-radius:22px;padding:18px;margin:12px 0}.c h2{margin:0 0 6px;color:var(--navy)}.c h2 a{color:var(--navy);text-decoration:none}.num{font-size:34px;font-weight:800;color:var(--sky)}.btn{background:var(--sky);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{width:100%;accent-color:var(--sky)}.out{background:#eaf4fe;border-left:5px solid var(--sky);padding:14px;white-space:pre-line;margin-top:12px}.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}.small{font-size:12px;color:#6b7f92}canvas{width:100%;height:190px;background:#fff}</style></head><body><header><div class="logo">waystar<span>✦</span></div></header><main><h1>clarity cycle</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas>
<label>Kickoff clarity</label><input id="k" type="range" min="0" max="100" value="45">
<label>Denial template quality</label><input id="d" type="range" min="0" max="100" value="55">
<label>Escalation speed</label><input id="e" type="range" min="0" max="100" value="50">
<div class="out" id="out"></div><div class="band">Uncertainty band: payer rules can still move denial rates.</div></section>
<script>function d(){var k=+document.getElementById('k').value,dd=+document.getElementById('d').value,e=+document.getElementById('e').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.strokeStyle='#4e97dd';x.lineWidth=6;x.beginPath();x.arc(350,190,140,0,Math.PI*2*k/100);x.stroke();var conf=Math.round(k*0.4+dd*0.3+e*0.3);document.getElementById('out').textContent='Implementation clarity: '+conf+'%\nPlain English: provider-count clarity at kickoff prevents month-3 disputes.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
