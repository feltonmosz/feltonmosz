<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertiv tool</title><style>:root{--org:#fe5b1b;--ink:#111}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#f5f5f5}header{padding:22px}.logo{font-size:30px;font-weight:900;letter-spacing:4px}.logo b{color:var(--org)}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.1}.sub{color:#c9c9c9;line-height:1.55}.c{background:#fff;color:#111;padding:18px;margin:12px 0;border-top:8px solid var(--org)}.c h2{margin:0 0 6px}.c h2 a{color:#111;text-decoration:none}.num{font-size:34px;font-weight:900;color:var(--org)}.btn{background:var(--org);color:#fff;border:0;padding:11px 18px;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)}input[type=range]{width:100%;accent-color:var(--org)}.out{background:#fff3ec;border-left:5px solid var(--org);padding:14px;white-space:pre-line;margin-top:12px}.band{background:#222;color:#fff;padding:12px;margin-top:12px;font-size:14px}.small{font-size:12px;color:#999}canvas{width:100%;height:180px;background:#fff}</style></head><body><header><div class="logo">VERTI<b>V</b></div></header><main><h1>delivery confidence</h1><section class="c"><canvas id="cv" width="700" height="360"></canvas>
<label>Order growth</label><input id="o" type="range" min="0" max="100" value="80">
<label>Capacity added</label><input id="cap" type="range" min="0" max="100" value="55">
<label>Firmware readiness</label><input id="fw" type="range" min="0" max="100" value="60">
<div class="out" id="out"></div><div class="band">Uncertainty band: component lead times can still move windows.</div></section>
<script>function d(){var o=+document.getElementById('o').value,cap=+document.getElementById('cap').value,fw=+document.getElementById('fw').value;var conf=Math.round(cap*0.45+fw*0.35+(100-o)*0.2);var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,360);x.fillStyle='#fe5b1b';for(var i=0;i<5;i++){x.fillRect(40+i*30,300-i*45,420-i*55,26)}document.getElementById('out').textContent='Delivery confidence: '+conf+'%\nPlain English: windows by order class beat one global promise.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
