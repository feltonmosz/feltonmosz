<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>thermal</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:'Segoe UI',sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:28px;line-height:1.3}
.gauge{height:30px;background:#262626;border-radius:999px;overflow:hidden;margin:18px 0}
.gfill{height:100%;background:linear-gradient(90deg,#fe5b1b,#ffb27a);transition:width .4s}
.loads{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.loads button{background:#1a1a1a;color:#ffb27a;border:2px solid #fe5b1b;padding:10px 14px;border-radius:8px;cursor:pointer}
.loads button.on{background:#fe5b1b;color:#fff;font-weight:700}
.status{background:#fe5b1b;color:#fff;border-radius:12px;padding:16px;line-height:1.7;font-weight:700}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #262626;padding:14px 2px}
.row a{color:#ffb27a;text-decoration:none;font-weight:700}
small{color:#8a8a8a}a.back{color:#ffb27a}</style></head><body><main><h1>thermal manifold</h1><div class='gauge'><div class='gfill' id='gf' style='width:62%'></div></div><div class='loads'><button class='on' onclick='go(0,this)'>supply</button><button onclick='go(1,this)'>return</button></div><div class='status' id='st'>Supply side: capacity dated by window.</div><p><small>Uncertainty: component supply can move windows — dates move with notice.</small></p><p><a class='back' href='index.html'>← manifold</a></p><script>var S=['Supply side: capacity dated by window.','Return side: slippage lines ready before dates move.'];function go(i,b){document.querySelectorAll('.loads button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('gf').style.width=i===0?'62%':'38%';document.getElementById('st').textContent=S[i]}</script></main></body></html>
