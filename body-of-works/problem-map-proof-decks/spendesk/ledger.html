<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spendesk tool</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:16px 20px 54px}h1{font-size:32px;line-height:1.12}.sub{line-height:1.55}.c{background:#fff;padding:18px;margin:12px 0}.c h2{margin:0 0 6px}.c h2 a{text-decoration:none}input[type=range]{width:100%}.out{padding:14px;white-space:pre-line;margin-top:12px}.band{padding:12px;margin-top:12px;font-size:14px;color:#fff}.small{font-size:12px}canvas{width:100%;height:190px;background:#fff}body{background:#f6f2ff;color:#241244}header{padding:22px}.logo{font-size:28px;font-weight:800;color:#5d21d2}h1{color:#3d148a}.sub{color:#5a4a80}.c{border:1px solid #e2d4fb;border-radius:16px}.c h2,.c h2 a{color:#3d148a}.num{font-size:32px;font-weight:800;color:#5d21d2}.btn{background:#7a5adb;color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:999px}input[type=range]{accent-color:#7a5adb}.out{background:#efe8ff;border-left:5px solid #7a5adb}.band{background:#3d148a}.small{color:#8a7ab0}</style></head><body><header><div class="logo">Spendesk</div></header><main><h1>ledger cascade</h1><section class="c"><canvas id="cv" width="700" height="380"></canvas><label>Sync visibility</label><input id="s0" type="range" min="0" max="100" value="40"><label>Support speed</label><input id="s1" type="range" min="0" max="100" value="35"><label>Escalation clarity</label><input id="s2" type="range" min="0" max="100" value="30"><div class="out" id="out"></div><div class="band">Uncertainty band: ERP-side changes can still break syncs.</div></section><script>function d(){var a=+document.getElementById('s0').value,b=+document.getElementById('s1').value,c=+document.getElementById('s2').value;var x=document.getElementById('cv').getContext('2d');x.clearRect(0,0,700,380);x.fillStyle='#7a5adb';var w=600;for(var i=0;i<4;i++){x.fillRect(50,50+i*75,w,40);w=w/2}var m=Math.round(a*0.4+b*0.35+c*0.25);document.getElementById('out').textContent='Month-end confidence: '+m+'%\nPlain English: sync state, last export, owner, next update.'}document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',d)});d()</script></main></body></html>
