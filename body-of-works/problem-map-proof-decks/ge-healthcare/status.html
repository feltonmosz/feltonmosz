<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE HealthCare status</title><style>:root{--pur:#5b2d8e;--navy:#101c3a;--ink:#17142b}
*{box-sizing:border-box}body{margin:0;font-family:"Source Sans Pro",Arial,sans-serif;background:#f6f3fb;color:var(--ink)}
header{padding:22px;text-align:center}
.logo{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--pur)}
main{max-width:760px;margin:0 auto;padding:16px 20px 54px}
h1{font-size:32px;line-height:1.12;color:var(--navy);margin:10px 0}
.sub{color:#4d4560;line-height:1.55}
.slice{background:#fff;border:1px solid #ddd2f0;border-left:10px solid var(--pur);padding:16px 18px;margin:10px 0 10px 0;box-shadow:6px 6px 0 #e7ddf7}
.slice:nth-child(even){margin-left:22px;border-left-color:var(--navy)}
.slice h2{margin:0 0 6px;font-size:18px;color:var(--navy)}.slice h2 a{color:var(--navy);text-decoration:none}
.num{font-size:36px;font-weight:800;color:var(--pur)}
.tab{background:var(--pur);color:#fff;border:0;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;border-radius:4px 14px 0 0}
input[type=range]{width:100%;accent-color:var(--pur)}
.out{background:#f1eafa;border-left:5px solid var(--pur);padding:14px;white-space:pre-line;margin-top:12px}
.band{background:var(--navy);color:#fff;padding:12px;margin-top:12px;font-size:14px}
canvas{width:100%;height:180px;background:#101c3a}
.small{font-size:12px;color:#7a7090}</style></head><body><header><div class="logo">GE HealthCare</div></header><main><h1>per-owner status</h1><section class="slice"><p>Unit, workaround, window, named contact — one page per owner.</p></section></main></body></html>
