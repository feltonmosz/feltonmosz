<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ladder</title><style>*{box-sizing:border-box}body{margin:0;background:#010b2c;color:#f3d8be;font-family:'Segoe UI',sans-serif}
main{max-width:700px;margin:0 auto;padding:24px 16px 60px}h1{font-size:28px;line-height:1.3;color:#fff}
.rung{margin:10px 0;padding:15px;background:#0a1a45;border-left:6px solid #f47226}
.rung:nth-child(2){margin-left:22px}.rung:nth-child(3){margin-left:44px}.rung:nth-child(4){margin-left:66px}
.rung h2{margin:0 0 4px;font-size:16px}.rung h2 a{color:#ffb27a;text-decoration:none}
.steps{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.steps button{background:#0a1a45;color:#ffb27a;border:2px solid #f47226;padding:10px 14px;border-radius:8px;cursor:pointer}
.steps button.on{background:#f47226;color:#1a0d02;font-weight:700}
.status{background:#f47226;color:#1a0d02;padding:16px;font-weight:700;line-height:1.7;border-radius:8px}
small{color:#8d9ab8}a.back{color:#ffb27a}</style></head><body><main><h1>moratorium ladder</h1><div class='steps'><button class='on' onclick='go(0,this)'>cohort A</button><button onclick='go(1,this)'>cohort B</button><button onclick='go(2,this)'>cohort C</button></div><div class='status' id='st'>Cohort A: moratorium ends this quarter — EMI schedule published.</div><p><small>Uncertainty: moratorium share is a labelled band, not a point estimate.</small></p><p><a class='back' href='index.html'>← ladder</a></p><script>var S=['Cohort A: moratorium ends this quarter — EMI schedule published.','Cohort B: mid-moratorium — interest performance tracked.','Cohort C: seasoned — vintage performance on record.'];function go(i,b){document.querySelectorAll('.steps button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
