<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deliverability fix list</title><style>*{box-sizing:border-box}body{font-family:Inter,-apple-system,Arial,sans-serif;margin:0;background:#0A1F44;color:#fff}.wrap{max-width:880px;margin:0 auto;padding:28px 20px 44px}.back{color:#FFB020;text-decoration:none;font-weight:800}h1{font-size:32px;line-height:1.1}.card{background:radial-gradient(circle at 18% 20%,rgba(255,176,32,.22),transparent 36%),repeating-conic-gradient(from 24deg at 60% 40%,rgba(255,255,255,.05) 0 9deg,transparent 9deg 20deg),#102A57;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;margin:14px 0}button{background:#fff;color:#0A1F44;border:0;border-radius:999px;padding:12px 18px;font-weight:900;margin:5px}.out{line-height:1.6}.step{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.12)}input{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#fff;color:#0A1F44;font-size:16px}label{display:block;margin:12px 0 6px;color:#C9D4E8}</style></head><body><div class="wrap"><a class="back" href="index.html">← Sunbit problem map</a><h1>Deliverability fix list</h1><div class="card"><div class="step">1. Inventory every sender using the domain.</div><div class="step">2. Trim SPF includes; move softfail to hard fail.</div><div class="step">3. Move DMARC from quarantine to reject.</div><div class="step">4. Add MTA-STS.</div><div class="step">5. Watch DMARC reports after each step.</div></div></div></body></html>
