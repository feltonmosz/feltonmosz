<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment timing — solution</title><style>*{box-sizing:border-box}body{font-family:Inter,-apple-system,Arial,sans-serif;margin:0;background:#0A1F44;color:#fff}.wrap{max-width:880px;margin:0 auto;padding:28px 20px 44px}.back{color:#FFB020;text-decoration:none;font-weight:800}h1{font-size:32px;line-height:1.1}.card{background:radial-gradient(circle at 18% 20%,rgba(255,176,32,.22),transparent 36%),repeating-conic-gradient(from 24deg at 60% 40%,rgba(255,255,255,.05) 0 9deg,transparent 9deg 20deg),#102A57;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;margin:14px 0}label{display:block;margin:12px 0 6px;color:#C9D4E8}input{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#fff;color:#0A1F44;font-size:16px}button{background:#FFB020;color:#0A1F44;border:0;border-radius:999px;padding:13px 22px;font-weight:900;margin-top:14px}.out{line-height:1.6}.step{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)}</style></head><body><div class="wrap"><a class="back" href="fixmap.html">← Fix map</a><h1>Payment timing — solution</h1><div class="card"><label>Checkout date</label><input id="d" type="date"><button onclick="go()">Show my payment dates</button><p class="out" id="o"></p></div><script>function go(){let x=new Date(d.value||Date.now());let f=new Date(x);f.setMonth(f.getMonth()+1);let r=new Date(f);r.setDate(r.getDate()-3);o.textContent='First payment: '+f.toDateString()+'. Reminder: '+r.toDateString()+'. Same date every month after that.'}d.value=new Date().toISOString().slice(0,10);go()</script></div></body></html>
