<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>waterfall</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfbff;color:#00018a;font-family:Poppins,Arial,sans-serif}

small{color:#64748b}a.back{color:#f58220}</style></head><body><main><h1>credit waterfall</h1><div class='band b1' style='width:100%'>FUNDING</div><div class='band b2' style='width:82%'>CO-LENDING</div><div class='band b3' style='width:64%'>STAGE 1 / 2</div><div class='band b4' style='width:46%'>STAGE 3</div><input type='range' id='s3' min='0' max='2' value='2' step='1' oninput='go()'><div class='status' id='st'>Slide the Stage-3 rung: every band re-splits.</div><p><small>Uncertainty: FY26 figures are pro-forma — labelled as such.</small></p><p><a class='back' href='index.html'>← waterfall</a></p><script>var S=['1.09% — FY24 base, growth story intact.','2.49% — H1 FY26 peak, migration explained.','2.20% — FY26, cover 46%, outlook positive.'];function go(){document.getElementById('st').textContent=S[+document.getElementById('s3').value]}</script></main></body></html>
