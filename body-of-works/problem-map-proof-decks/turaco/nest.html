<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>nest</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7f2;color:#3a2410;font-family:'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 60px;text-align:center}h1{font-size:27px;line-height:1.3}
.nest{width:180px;height:180px;border-radius:50%;border:10px solid #ea580c;margin:18px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.nest .big{font-size:30px;font-weight:800}.nest .lab{font-size:12px;color:#9a7a55}
.steps{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}.steps button{background:#fff;border:2px solid #ea580c;color:#ea580c;padding:10px 14px;border-radius:999px;cursor:pointer}
.steps button.on{background:#ea580c;color:#fff;font-weight:700}
.status{background:#3a2410;color:#fff;border-radius:14px;padding:16px;line-height:1.7;text-align:left}
.card{background:#fff;border:2px solid #fed7aa;border-radius:16px;padding:15px;margin:10px 0;text-align:left}.card h2{margin:0 0 4px;font-size:16px}.card h2 a{color:#ea580c;text-decoration:none}
small{color:#9a7a55}a.back{color:#ea580c}</style></head><body><main><h1>claims nest</h1><div class='nest'><div class='big'>3 steps</div><div class='lab'>TO CLAIM</div></div><div class='steps'><button class='on' onclick='go(0,this)'>step 1</button><button onclick='go(1,this)'>step 2</button><button onclick='go(2,this)'>step 3</button></div><div class='status' id='st'>Step 1: notify within one month.</div><p><small>Uncertainty: documents vary by claim — checklist per type.</small></p><p><a class='back' href='index.html'>← nest</a></p><script>var S=['Step 1: notify within one month.','Step 2: ID, discharge summary, invoice, SHA SMS.','Step 3: settled within 3 business days.'];function go(i,b){document.querySelectorAll('.steps button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('st').textContent=S[i]}</script></main></body></html>
