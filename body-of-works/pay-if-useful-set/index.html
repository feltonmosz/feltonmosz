<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Pay-if-Useful Set</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;background:#5c0a2e;color:#fff}
.topbar{background:#00001e;display:flex;align-items:center;gap:14px;padding:12px 16px}
.topbar .lang{font-weight:700;letter-spacing:1px;font-size:14px}
.topbar .zone{background:#7cfc00;color:#00001e;font-weight:800;border-radius:999px;padding:7px 16px;font-size:13px;letter-spacing:1px;margin-left:auto}
.topbar .search{width:22px;height:22px;border:3px solid #fff;border-radius:50%;position:relative}
.topbar .search::after{content:'';position:absolute;width:9px;height:3px;background:#fff;transform:rotate(45deg);right:-8px;bottom:-3px}
.strip{background:#7cfc00;display:flex;justify-content:center;gap:18px;padding:10px 0}
.strip .ic{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#333;font-weight:800;font-size:17px}
.logobar{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logobar .mark{display:flex;align-items:center;gap:10px;color:#12351f}
.logobar .ball{width:44px;height:44px;border-radius:50%;background:#7cfc00;display:flex;align-items:center;justify-content:center;font-weight:900;color:#12351f;font-size:20px}
.logobar .name{font-size:21px;font-weight:800;line-height:1.05}
.burger{display:flex;flex-direction:column;gap:6px}.burger span{width:30px;height:3px;background:#12351f}
main{max-width:640px;margin:0 auto;padding:20px 16px 90px}
.pill{display:inline-block;background:#7cfc00;color:#1a1a1a;font-weight:700;border-radius:999px;padding:11px 22px;margin:14px 0;font-size:15px;border:none;cursor:pointer}
.card{border-radius:22px;overflow:hidden;margin:8px 0 4px;display:flex;min-height:210px}
.card .txt{flex:0 0 46%;padding:22px 18px;clip-path:polygon(0 0,100% 0,62% 100%,0 100%);color:#fff}
.card .txt h2{margin:0;font-size:21px;line-height:1.25}
.card .txt p{font-size:13px;line-height:1.5;opacity:.9}
.card .vis{flex:1;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900}
.ably .txt{background:#00001e}.ably .vis{background:#ff5c39;color:#fff}
.budi .txt{background:#ff6b35}.budi .vis{background:#1e1b4b;color:#fff}
.tang .txt{background:#12351f}.tang .vis{background:#f59e0b;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#00001e;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;display:none}
.top{position:fixed;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#7cfc00;color:#1a1a1a;font-size:24px;font-weight:900;border:none;cursor:pointer}
</style></head><body>
<div class='topbar'><span class='lang'>PAY-IF-USEFUL ▾</span><span class='zone'>3 SETS</span><span class='search'></span></div>
<div class='strip'><span class='ic'>$99</span><span class='ic'>7d</span><span class='ic'>✓</span></div>
<div class='logobar'><div class='mark'><span class='ball'>P</span><span class='name'>Pay-if-<br>Useful</span></div><div class='burger'><span></span><span></span></div></div>
<main>
<button class='pill' onclick='toast()'>Use it for a week</button>
<section class='card ably'><div class='txt'><h2>Ably</h2><p>12 Pusher &amp; PubNub switchers. Pricing teardown. Deliverability audit.</p></div><div class='vis'>A</div></section>
<button class='pill' onclick='toast()'>Open the set</button>
<section class='card budi'><div class='txt'><h2>Budibase</h2><p>12 Retool switchers. Pricing teardown. Deliverability audit.</p></div><div class='vis'>B</div></section>
<button class='pill' onclick='toast()'>Open the set</button>
<section class='card tang'><div class='txt'><h2>Tangem</h2><p>12 Ledger switchers. Pricing teardown. Deliverability audit.</p></div><div class='vis'>T</div></section>
<button class='pill' onclick='toast()'>Open the set</button>
</main>
<div class='toast' id='t'>Case build queued.</div>
<button class='top' onclick='window.scrollTo({top:0,behavior:"smooth"})'>∧</button>
<script>function toast(){var t=document.getElementById('t');t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}</script>
</body></html>
