<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firefly credit meter — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127q"></head><body><div class="shell"><div class="main"><div class="top"><strong>Photoshop Firefly</strong><span class="crumb">Body of Works / Adobe × Figma / Firefly credit meter</span></div><div class="wrap"><section class="hero"><h1>Firefly credit meter</h1><p>AI credits burn without clear per-action cost. Photoshop can show Firefly cost before Generate.</p></section><section class="panel"><h2>Properties</h2><label>Model</label><button type="button" class="sheetbtn" data-target="model">Firefly standard — 1 credit</button><input type="hidden" id="model" value="1"><div class="sheet" data-sheet="model"><h3>Model</h3><button data-v="1" class="selected">Firefly standard — 1 credit</button><button data-v="10" class="">Firefly Image 5 — 10 credits</button><button data-v="40" class="">Partner model — 40 credits</button></div><label>Generations<input id="gens" type="number" value="120"></label><label>Plan credits<input id="plan" type="number" value="4000"></label><div class="meter"><i id="bar" style="width:76%"></i></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){const m=parseFloat(document.getElementById("model").value)||0;const g=parseFloat(document.getElementById("gens").value)||0;const pl=parseFloat(document.getElementById("plan").value)||0;const b=g*m;const r=pl-b;const barEl=document.getElementById("bar");if(barEl)barEl.style.width=Math.min(100,pl?b/pl*100:0)+"%";out.textContent=`Cost before Generate: ${m} credits
Monthly burn: ${b}
Remaining: ${r}${r<0?"
Warning: exceeds plan credits.":""}`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script></body></html>
