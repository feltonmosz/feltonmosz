<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export credit warning — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#111" stroke-width="3"/></svg></div><p class="eyebrow">PROTOTYPE</p><h1>Export credit warning</h1><p class="desc">Hidden limits stopped Clay runs mid-flight. Apollo can warn before export credits exhaust the plan.</p><section class="panel"><h2>Try it</h2><label>Export target</label><button type="button" class="sheetbtn" data-target="target">CSV</button><input type="hidden" id="target" value="csv"><div class="sheet" data-sheet="target"><h3>Export target</h3><button data-v="csv" class="selected">CSV</button><button data-v="crm" class="">CRM sync</button><button data-v="sequence" class="">Sequence</button></div><label>Contacts<input id="contacts" type="number" value="500"></label><label>Credits left<input id="left" type="number" value="300"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=parseFloat(contacts.value)>parseFloat(left.value)?`Warning: ${contacts.value} contacts to ${target.value} exceeds ${left.value} credits left. Apollo offers a partial export first.`:`${target.value} export fits: ${contacts.value} of ${left.value} credits.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
