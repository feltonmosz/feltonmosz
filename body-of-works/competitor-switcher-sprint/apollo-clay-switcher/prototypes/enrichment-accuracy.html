<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enrichment accuracy check — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="20" fill="none" stroke="#111" stroke-width="3"/><path d="M20 31l7 7 14-16" stroke="#111" stroke-width="4" fill="none"/></svg></div><p class="eyebrow">PROTOTYPE</p><h1>Enrichment accuracy check</h1><p class="desc">Wrong LinkedIn links and invented contacts kill trust. Apollo can score enrichment before sequences send.</p><section class="panel"><h2>Try it</h2><label>Data source</label><button type="button" class="sheetbtn" data-target="src">Waterfall enrichment</button><input type="hidden" id="src" value="waterfall"><div class="sheet" data-sheet="src"><h3>Data source</h3><button data-v="waterfall" class="selected">Waterfall enrichment</button><button data-v="single" class="">Single source</button></div><label>Verified %<input id="ver" type="number" value="91"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${src.value}: ${ver.value}% verified. Apollo holds unverified rows out of sequences until checked.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
