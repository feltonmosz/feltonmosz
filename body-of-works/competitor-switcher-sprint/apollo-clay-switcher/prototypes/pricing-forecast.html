<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing forecast — Apollo prototype</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="nav"><div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-label="Apollo logo"><rect width="44" height="44" rx="10" fill="#D9FF3D"/><path d="M22 8v28M10 15l24 14M34 15L10 29" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg><span>Apollo</span></div></header><main><section class="inside"><div class="repwrap"><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M8 44h44M14 38V24M26 38V16M38 38V28" stroke="#111" stroke-width="3" fill="none"/><path d="M12 20l14-8 10 6 12-10" stroke="#D9FF3D" stroke-width="5" fill="none"/></svg></div><p class="eyebrow">PROTOTYPE</p><h1>Pricing forecast</h1><p class="desc">Clay raised entry prices and buyers could not forecast the bill. Apollo publishes per-seat pricing buyers can model.</p><section class="panel"><h2>Try it</h2><label>Plan</label><button type="button" class="sheetbtn" data-target="plan">Basic $49/seat</button><input type="hidden" id="plan" value="49"><div class="sheet" data-sheet="plan"><h3>Plan</h3><button data-v="49" class="selected">Basic $49/seat</button><button data-v="79" class="">Professional $79/seat</button><button data-v="119" class="">Organization $119/seat</button></div><label>Seats<input id="seats" type="number" value="5"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${seats.value} seats: $${seats.value*plan.value}/month, forecast before signup. No credit surprise.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
