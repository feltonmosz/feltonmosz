<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout depth — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Checkout depth</h1><p class="desc">Wix checkout and catalog limits are hard. Shopify checkout can show depth before limits bite.</p><section class="panel"><label>Need<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="need" data-v="discounts"><span class="dot"></span>Discount codes</button><button type="button" class="radiocard" data-target="need" data-v="pickup"><span class="dot"></span>Local pickup</button><button type="button" class="radiocard" data-target="need" data-v="express"><span class="dot"></span>Express checkout</button></div><input type="hidden" id="need" value="discounts"><label>Orders/day<input id="orders" type="number" value="300"></label><button class="btn" onclick="run()">Check checkout</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${need.value} at ${orders.value} orders/day: supported, with Shop Pay express path shown.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
