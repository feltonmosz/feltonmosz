<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App load guard — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>App load guard</h1><p class="desc">Wix app scripts load on pages that never use them. Shopify can load apps only where needed.</p><section class="panel"><label>Page<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="page" data-v="product"><span class="dot"></span>Product page</button><button type="button" class="radiocard" data-target="page" data-v="home"><span class="dot"></span>Home page</button></div><input type="hidden" id="page" value="product"><label>Apps installed<input id="apps" type="number" value="14"></label><button class="btn" onclick="run()">Check load</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${page.value}: only apps used here load. ${apps.value} installed, unused scripts stay off the page.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
