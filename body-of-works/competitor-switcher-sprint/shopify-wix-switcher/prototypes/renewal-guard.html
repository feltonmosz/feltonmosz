<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renewal guard — Shopify prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Renewal guard</h1><p class="desc">Wix charged a 46% price rise 19 days early. Shopify can show renewal price and date before charge.</p><section class="panel"><label>Plan<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="plan" data-v="basic"><span class="dot"></span>Basic $29</button><button type="button" class="radiocard" data-target="plan" data-v="grow"><span class="dot"></span>Grow $79</button><button type="button" class="radiocard" data-target="plan" data-v="advanced"><span class="dot"></span>Advanced $299</button></div><input type="hidden" id="plan" value="basic"><label>Days to renewal<input id="days" type="number" value="19"></label><button class="btn" onclick="run()">Preview renewal</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){const p={basic:29,grow:79,advanced:299}[plan.value];out.textContent=`${plan.value}: $${p}/month. Renewal in ${days.value} days, price locked and shown before charge.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
