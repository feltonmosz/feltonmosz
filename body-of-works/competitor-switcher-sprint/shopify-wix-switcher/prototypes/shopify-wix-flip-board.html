<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify vs Wix flip board</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><a class="brand" href="index.html" aria-label="Shopify prototypes home"><svg class="bag" viewBox="0 0 34 38" aria-hidden="true"><path d="M6 12h22l-2 24H8z" fill="#95BF47"/><path d="M12 12a5 5 0 0 1 10 0" fill="none" stroke="#5E8E3E" stroke-width="3"/><text x="17" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">S</text></svg>shopify</a></header><main><section class="inside"><h1>Shopify vs Wix flip board</h1><p class="desc">Plain why for each Wix pain, with the Shopify fix that flips it.</p><section class="panel"><label>Pain<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="pain" data-v="billing"><span class="dot"></span>Billing trust</button><button type="button" class="radiocard" data-target="pain" data-v="lockin"><span class="dot"></span>Lock-in</button><button type="button" class="radiocard" data-target="pain" data-v="payments"><span class="dot"></span>Payments</button><button type="button" class="radiocard" data-target="pain" data-v="scale"><span class="dot"></span>Scale</button><button type="button" class="radiocard" data-target="pain" data-v="ai"><span class="dot"></span>AI cost</button></div><input type="hidden" id="pain" value="billing"><button class="btn" onclick="run()">Show flip</button><div class="out" id="out">Ready.</div></section></section></main><script>function run(){const d={billing:"46% rise charged early. Shopify flip: renewal guard.",lockin:"Site cannot export or switch design. Shopify flip: export path + theme preview.",payments:"$4,000 frozen after documents. Shopify flip: payout guard.",scale:"SEO caps and checkout limits. Shopify flip: clean URLs + checkout depth.",ai:"Credits burn before cost. Shopify flip: AI credit meter."};out.textContent=d[pain.value]}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
