<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSO gate preview — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6l16 6v14c0 12-7 20-16 24C21 46 14 38 14 26V12z" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>SSO gate preview</h1><p class="desc">SSO and SCIM sit behind Asana custom tier. Buyers need the gate named before procurement.</p><section class="panel"><label>Need<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="need" data-v="sso"><span class="dot"></span>SSO</button><button type="button" class="radiocard" data-target="need" data-v="scim"><span class="dot"></span>SCIM</button><button type="button" class="radiocard" data-target="need" data-v="both"><span class="dot"></span>SSO + SCIM</button></div><input type="hidden" id="need" value="sso"><label>Employees<input id="emp" type="number" value="300"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${need.value} for ${emp.value} employees: Asana names the exact tier gate up front, before procurement starts.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
