<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest access — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="22" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="40" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><path d="M12 48c3-8 17-8 20 0M32 48c3-8 17-8 20 0" stroke="#111" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Guest access</h1><p class="desc">Free unlimited guests are Asana cleanest win. Guests should join without seat math.</p><section class="panel"><label>Guest type<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="guest" data-v="client"><span class="dot"></span>Client</button><button type="button" class="radiocard" data-target="guest" data-v="vendor"><span class="dot"></span>Vendor</button><button type="button" class="radiocard" data-target="guest" data-v="partner"><span class="dot"></span>Partner</button></div><input type="hidden" id="guest" value="client"><label>Guests<input id="guests" type="number" value="18"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${guests.value} ${guest.value} guests: free and unlimited on paid plans. No seat charge.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
