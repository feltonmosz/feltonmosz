<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing ladder — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#F06A6A" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Pricing ladder</h1><p class="desc">monday.com sells four ladders; Asana sells one. One ladder is easier to buy.</p><section class="panel"><label>Team size<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="size" data-v="small"><span class="dot"></span>Small team</button><button type="button" class="radiocard" data-target="size" data-v="mid"><span class="dot"></span>Mid-market</button><button type="button" class="radiocard" data-target="size" data-v="enterprise"><span class="dot"></span>Enterprise</button></div><input type="hidden" id="size" value="small"><label>Users<input id="users" type="number" value="41"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${size.value}, ${users.value} users: one Asana ladder, priced on the page. No sales gate at 41 seats.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
