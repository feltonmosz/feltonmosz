<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation cap check — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="12" y="12" width="36" height="36" rx="6" fill="none" stroke="#111" stroke-width="3"/><path d="M20 30l7 7 14-16" stroke="#F06A6A" stroke-width="4" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Automation cap check</h1><p class="desc">Unlimited automations beat 250 actions. Teams need to see automation headroom.</p><section class="panel"><label>Workflow<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="wf" data-v="rules"><span class="dot"></span>Rules</button><button type="button" class="radiocard" data-target="wf" data-v="forms"><span class="dot"></span>Forms</button><button type="button" class="radiocard" data-target="wf" data-v="approvals"><span class="dot"></span>Approvals</button></div><input type="hidden" id="wf" value="rules"><label>Actions this month<input id="actions" type="number" value="250"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${wf.value}: ${actions.value} actions. Asana keeps automations unlimited, so work does not stop at a cap.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
