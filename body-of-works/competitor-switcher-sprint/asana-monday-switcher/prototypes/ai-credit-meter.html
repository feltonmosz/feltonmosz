<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI credit meter — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="8" fill="#F06A6A"/><path d="M30 8v10M30 42v10M8 30h10M42 30h10" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>AI credit meter</h1><p class="desc">Asana meters AI twice and credits expire. Teams need a visible meter before credits vanish.</p><section class="panel"><label>AI action<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="act" data-v="summary"><span class="dot"></span>Summarize</button><button type="button" class="radiocard" data-target="act" data-v="draft"><span class="dot"></span>Draft</button><button type="button" class="radiocard" data-target="act" data-v="triage"><span class="dot"></span>Triage</button></div><input type="hidden" id="act" value="summary"><label>Credits left<input id="left" type="number" value="120"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${act.value}: ${left.value} credits left, expiry shown before use. Planning ahead is not punished.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
