<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competitor Switcher Sprint</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#fff;color:#111827;text-align:center}h1{font-size:34px;margin:34px 20px 10px}.sub{color:#374151;margin:0 24px 24px;line-height:1.45}h2{font-size:26px;margin:0 0 18px}.hero{height:300px;background:#F3F4F6;display:grid;place-items:center;overflow:hidden}.logo{grid-area:1/1;width:190px;height:190px;opacity:0;transform:scale(.96);transition:opacity .35s ease,transform .35s ease;pointer-events:none}.logo.active{opacity:1;transform:scale(1)}.logo svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18))}.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.card{flex:0 0 62%;scroll-snap-align:center;border:1px solid #D1D5DB;border-radius:8px;padding:18px;text-align:left;color:#111827;text-decoration:none;background:#fff;transition:border-color .25s ease,background .25s ease}.card.selected{border-color:#111827;background:#F9FAFB}.card strong{display:block;font-size:20px;margin-bottom:6px}.card span{color:#4B5563;line-height:1.4}@media(min-width:760px){.card{flex-basis:28%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><h1>Competitor Switcher Sprint</h1><p class="sub">Select a switcher. The logo switches seamlessly, then the prototypes open.</p><h2>Select a Switcher</h2><a class="hero" id="hero" href="adobe-figma-switcher/prototypes/index.html" aria-label="Open selected switcher"><div class="logo active" data-logo="0"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#FA0F00"/><path d="M60 22 L98 98 H78 L68 74 H52 L42 98 H22 Z M60 52 L66 66 H54 Z" fill="#fff"/></svg></div><div class="logo" data-logo="1"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#F5E93D"/><path d="M60 20 V100 M28 42 L92 78 M92 42 L28 78" stroke="#111" stroke-width="10" stroke-linecap="round"/></svg></div><div class="logo" data-logo="2"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#fff"/><circle cx="60" cy="38" r="16" fill="#F06A6A"/><circle cx="38" cy="78" r="16" fill="#F06A6A"/><circle cx="82" cy="78" r="16" fill="#F06A6A"/></svg></div><div class="logo" data-logo="3"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#fff"/><text x="60" y="78" text-anchor="middle" font-size="52" font-weight="900" fill="#0061D5" font-family="Arial">box</text></svg></div><div class="logo" data-logo="4"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#fff"/><path d="M34 44h52l-5 56H39z" fill="#95BF47"/><path d="M48 44a12 12 0 0 1 24 0" fill="none" stroke="#5E8E3E" stroke-width="7"/><text x="60" y="84" text-anchor="middle" font-size="34" font-weight="900" fill="#fff" font-family="Arial">S</text></svg></div></a><div class="rail"><a class="card selected" href="adobe-figma-switcher/prototypes/index.html" data-logo="0"><strong>Adobe × Figma</strong><span>Design switcher fixes</span></a><a class="card" href="apollo-clay-switcher/prototypes/index.html" data-logo="1"><strong>Apollo × Clay</strong><span>GTM switcher fixes</span></a><a class="card" href="asana-monday-switcher/prototypes/index.html" data-logo="2"><strong>Asana × monday.com</strong><span>Work switcher fixes</span></a><a class="card" href="box-dropbox-switcher/prototypes/index.html" data-logo="3"><strong>Box × Dropbox</strong><span>Content switcher fixes</span></a><a class="card" href="shopify-wix-switcher/prototypes/index.html" data-logo="4"><strong>Shopify × Wix</strong><span>Commerce switcher fixes</span></a></div></main><script>const cards=[...document.querySelectorAll('.card')],logos=[...document.querySelectorAll('.logo')],hero=document.getElementById('hero');cards.forEach(c=>c.addEventListener('click',e=>{e.preventDefault();const i=c.dataset.logo;cards.forEach(x=>x.classList.toggle('selected',x===c));logos.forEach(x=>x.classList.toggle('active',x.dataset.logo===i));hero.href=c.href;c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});setTimeout(()=>location.href=c.href,380)}))</script></body></html>
