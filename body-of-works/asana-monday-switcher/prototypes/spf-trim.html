<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPF trim — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6l16 6v14c0 12-7 20-16 24C21 46 14 38 14 26V12z" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>SPF trim</h1><p class="desc">Asana SPF authorises six sender mechanisms. Fewer senders means a tighter trust boundary.</p><section class="panel"><label>Senders<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="senders" data-v="6"><span class="dot"></span>6 mechanisms</button><button type="button" class="radiocard" data-target="senders" data-v="3"><span class="dot"></span>3 mechanisms</button></div><input type="hidden" id="senders" value="6"><label>Domains<input id="domains" type="number" value="4"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${senders.value} across ${domains.value} domains: Asana trims unused senders and keeps the boundary tight.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
