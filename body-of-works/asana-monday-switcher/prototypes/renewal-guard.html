<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renewal guard — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#F06A6A" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Renewal guard</h1><p class="desc">A monday.com customer spent $3,600 and was lost over a $69 charge. Asana can warn before renewal charges land.</p><section class="panel"><label>Renewal state<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="state">Auto-renew on</button><input type="hidden" id="state" value="auto"><div class="sheet" data-sheet="state"><h3>Renewal state</h3><button data-v="auto" class="selected">Auto-renew on</button><button data-v="manual" class="">Manual renewal</button></div><label>Days to renewal<input id="days" type="number" value="7"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=state.value==="auto"&&days.value<=14?`Renewal in ${days.value} days: Asana warns admins and shows the exact charge before it lands.`:`Renewal state clear. No surprise charge.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
