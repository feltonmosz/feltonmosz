<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renewal guard — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#F06A6A" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Renewal guard</h1><p class="desc">A monday.com customer spent $3,600 and was lost over a $69 charge. Asana can warn before renewal charges land.</p><section class="panel"><label>Renewal state<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="state" data-v="auto"><span class="dot"></span>Auto-renew on</button><button type="button" class="radiocard" data-target="state" data-v="manual"><span class="dot"></span>Manual renewal</button></div><input type="hidden" id="state" value="auto"><label>Days to renewal<input id="days" type="number" value="7"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=state.value==="auto"&&days.value<=14?`Renewal in ${days.value} days: Asana warns admins and shows the exact charge before it lands.`:`Renewal state clear. No surprise charge.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
