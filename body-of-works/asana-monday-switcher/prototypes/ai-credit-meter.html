<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI credit meter — Asana prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="8" fill="#F06A6A"/><path d="M30 8v10M30 42v10M8 30h10M42 30h10" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>AI credit meter</h1><p class="desc">Asana meters AI twice and credits expire. Teams need a visible meter before credits vanish.</p><section class="panel"><h2>Try it</h2><label>AI action</label><button type="button" class="sheetbtn" data-target="act">Summarize</button><input type="hidden" id="act" value="summary"><div class="sheet" data-sheet="act"><h3>AI action</h3><button data-v="summary" class="selected">Summarize</button><button data-v="draft" class="">Draft</button><button data-v="triage" class="">Triage</button></div><label>Credits left<input id="left" type="number" value="120"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${act.value}: ${left.value} credits left, expiry shown before use. Planning ahead is not punished.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
