<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seat forecast — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="22" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="40" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><path d="M12 48c3-8 17-8 20 0M32 48c3-8 17-8 20 0" stroke="#111" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Seat forecast</h1><p class="desc">Asana sells seats in blocks above five users. Buyers need the exact seat math before checkout.</p><section class="panel"><label>Plan<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="plan" data-v="10.99"><span class="dot"></span>Starter $10.99</button><button type="button" class="radiocard" data-target="plan" data-v="24.99"><span class="dot"></span>Advanced $24.99</button></div><input type="hidden" id="plan" value="10.99"><label>Users<input id="users" type="number" value="41"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){const blocks=Math.ceil(users.value/5)*5;out.textContent=`${users.value} users = ${blocks} seats: $${(blocks*plan.value).toFixed(2)}/month. No sales call needed.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
