<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration path — Asana prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M14 22h28l-6-6M46 38H18l6 6" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Migration path</h1><p class="desc">A monday.com CRM customer asked for six months of refunds while migrating. Asana can make migration a guided path.</p><section class="panel"><h2>Try it</h2><label>Source</label><button type="button" class="sheetbtn" data-target="src">monday.com</button><input type="hidden" id="src" value="monday"><div class="sheet" data-sheet="src"><h3>Source</h3><button data-v="monday" class="selected">monday.com</button><button data-v="other" class="">Other tool</button></div><label>Projects<input id="projects" type="number" value="24"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${src.value}: ${projects.value} projects mapped with owners, dates and files before import. No refund spiral.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
