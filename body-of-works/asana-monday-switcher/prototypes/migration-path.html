<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration path — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M14 22h28l-6-6M46 38H18l6 6" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Migration path</h1><p class="desc">A monday.com CRM customer asked for six months of refunds while migrating. Asana can make migration a guided path.</p><section class="panel"><label>Source<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="src" data-v="monday"><span class="dot"></span>monday.com</button><button type="button" class="radiocard" data-target="src" data-v="other"><span class="dot"></span>Other tool</button></div><input type="hidden" id="src" value="monday"><label>Projects<input id="projects" type="number" value="24"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${src.value}: ${projects.value} projects mapped with owners, dates and files before import. No refund spiral.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
