<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMARC fix — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="8" y="16" width="44" height="30" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M10 20l20 14 20-14" stroke="#F06A6A" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>DMARC fix</h1><p class="desc">Asana DMARC stops at quarantine. Moving to reject protects the domain buyers trust.</p><section class="panel"><label>Policy<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="pol" data-v="quarantine"><span class="dot"></span>Quarantine</button><button type="button" class="radiocard" data-target="pol" data-v="reject"><span class="dot"></span>Reject</button></div><input type="hidden" id="pol" value="quarantine"><label>Subdomains<input id="subs" type="number" value="6"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=pol.value==="reject"?`DMARC reject across ${subs.value} subdomains: spoofed mail is refused, not quarantined.`:`Quarantine leaves spoofed mail deliverable. Asana can move to reject.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
