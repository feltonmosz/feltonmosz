<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMARC fix — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="8" y="16" width="44" height="30" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M10 20l20 14 20-14" stroke="#F06A6A" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>DMARC fix</h1><p class="desc">Asana DMARC stops at quarantine. Moving to reject protects the domain buyers trust.</p><section class="panel"><label>Policy<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="pol">Quarantine</button><input type="hidden" id="pol" value="quarantine"><div class="sheet" data-sheet="pol"><h3>Policy</h3><button data-v="quarantine" class="selected">Quarantine</button><button data-v="reject" class="">Reject</button></div><label>Subdomains<input id="subs" type="number" value="6"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=pol.value==="reject"?`DMARC reject across ${subs.value} subdomains: spoofed mail is refused, not quarantined.`:`Quarantine leaves spoofed mail deliverable. Asana can move to reject.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
