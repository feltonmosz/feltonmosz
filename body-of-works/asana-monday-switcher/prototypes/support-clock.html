<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support clock — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="20" fill="none" stroke="#111" stroke-width="3"/><path d="M30 18v12l8 5" stroke="#111" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Support clock</h1><p class="desc">An Enterprise monday.com customer sat in 206- and 159-minute support queues. Asana can show a visible response clock.</p><section class="panel"><label>Plan<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="plan" data-v="enterprise"><span class="dot"></span>Enterprise</button><button type="button" class="radiocard" data-target="plan" data-v="advanced"><span class="dot"></span>Advanced</button><button type="button" class="radiocard" data-target="plan" data-v="starter"><span class="dot"></span>Starter</button></div><input type="hidden" id="plan" value="enterprise"><label>Wait minutes<input id="wait" type="number" value="206"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${plan.value}: waited ${wait.value} minutes. Asana shows queue position, owner and first-response target.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
