<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation cap check — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="12" y="12" width="36" height="36" rx="6" fill="none" stroke="#111" stroke-width="3"/><path d="M20 30l7 7 14-16" stroke="#F06A6A" stroke-width="4" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Automation cap check</h1><p class="desc">Unlimited automations beat 250 actions. Teams need to see automation headroom.</p><section class="panel"><label>Workflow<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="wf">Rules</button><input type="hidden" id="wf" value="rules"><div class="sheet" data-sheet="wf"><h3>Workflow</h3><button data-v="rules" class="selected">Rules</button><button data-v="forms" class="">Forms</button><button data-v="approvals" class="">Approvals</button></div><label>Actions this month<input id="actions" type="number" value="250"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${wf.value}: ${actions.value} actions. Asana keeps automations unlimited, so work does not stop at a cap.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
