<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSO gate preview — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6l16 6v14c0 12-7 20-16 24C21 46 14 38 14 26V12z" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>SSO gate preview</h1><p class="desc">SSO and SCIM sit behind Asana custom tier. Buyers need the gate named before procurement.</p><section class="panel"><label>Need<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="need">SSO</button><input type="hidden" id="need" value="sso"><div class="sheet" data-sheet="need"><h3>Need</h3><button data-v="sso" class="selected">SSO</button><button data-v="scim" class="">SCIM</button><button data-v="both" class="">SSO + SCIM</button></div><label>Employees<input id="emp" type="number" value="300"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${need.value} for ${emp.value} employees: Asana names the exact tier gate up front, before procurement starts.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
