<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest access — Asana prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="22" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="40" cy="22" r="7" fill="none" stroke="#111" stroke-width="3"/><path d="M12 48c3-8 17-8 20 0M32 48c3-8 17-8 20 0" stroke="#111" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Guest access</h1><p class="desc">Free unlimited guests are Asana cleanest win. Guests should join without seat math.</p><section class="panel"><h2>Try it</h2><label>Guest type</label><button type="button" class="sheetbtn" data-target="guest">Client</button><input type="hidden" id="guest" value="client"><div class="sheet" data-sheet="guest"><h3>Guest type</h3><button data-v="client" class="selected">Client</button><button data-v="vendor" class="">Vendor</button><button data-v="partner" class="">Partner</button></div><label>Guests<input id="guests" type="number" value="18"></label><p><button class="btn" onclick="run()">Run prototype</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${guests.value} ${guest.value} guests: free and unlimited on paid plans. No seat charge.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
