<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing ladder — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#F06A6A" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Pricing ladder</h1><p class="desc">monday.com sells four ladders; Asana sells one. One ladder is easier to buy.</p><section class="panel"><label>Team size<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="size">Small team</button><input type="hidden" id="size" value="small"><div class="sheet" data-sheet="size"><h3>Team size</h3><button data-v="small" class="selected">Small team</button><button data-v="mid" class="">Mid-market</button><button data-v="enterprise" class="">Enterprise</button></div><label>Users<input id="users" type="number" value="41"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=`${size.value}, ${users.value} users: one Asana ladder, priced on the page. No sales gate at 41 seats.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
