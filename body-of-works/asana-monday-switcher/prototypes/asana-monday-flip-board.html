<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asana vs monday.com flip board</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M14 22h28l-6-6M46 38H18l6 6" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Asana vs monday.com flip board</h1><p class="desc">Plain why for each switcher pain, with the Asana fix that flips it.</p><section class="panel"><label>Pain<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="pain">Billing trust</button><input type="hidden" id="pain" value="billing"><div class="sheet" data-sheet="pain"><h3>Pain</h3><button data-v="billing" class="selected">Billing trust</button><button data-v="support" class="">Support queues</button><button data-v="tasks" class="">Lost tasks</button><button data-v="pricing" class="">Pricing clarity</button><button data-v="email" class="">Email trust</button></div><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){const d={billing:"monday.com lost a $3,600 customer over $69. Asana flip: renewal guard.",support:"Enterprise queues ran 206 minutes. Asana flip: visible support clock.",tasks:"20 tasks disappeared. Asana flip: task integrity check.",pricing:"Four ladders confuse buyers. Asana flip: one ladder, seat math shown.",email:"DMARC stops at quarantine. Asana flip: move to reject."};out.textContent=d[pain.value]}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
