<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task integrity check — Asana prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="12" y="12" width="36" height="36" rx="6" fill="none" stroke="#111" stroke-width="3"/><path d="M20 30l7 7 14-16" stroke="#F06A6A" stroke-width="4" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Task integrity check</h1><p class="desc">A monday.com team lost 20 tasks that stopped populating. Asana can verify tasks before work disappears.</p><section class="panel"><label>Check<span class="req">*</span></label><button type="button" class="sheetbtn" data-target="check">Sync check</button><input type="hidden" id="check" value="sync"><div class="sheet" data-sheet="check"><h3>Check</h3><button data-v="sync" class="selected">Sync check</button><button data-v="full" class="">Full integrity</button></div><label>Missing tasks<input id="missing" type="number" value="20"></label><p><button class="btn" onclick="run()">Submit</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=missing.value>0?`${check.value}: ${missing.value} tasks missing. Asana flags them before the team plans around ghosts.`:`${check.value}: all tasks present.`}</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const bd=document.getElementById("bd");if(bd)document.body.appendChild(bd);document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});if(bd)bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
