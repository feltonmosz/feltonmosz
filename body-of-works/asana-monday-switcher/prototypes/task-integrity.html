<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task integrity check — Asana prototype</title><link rel="stylesheet" href="style.css?v=3"></head><body><header class="nav"><div class="brand"><span class="dots"><i></i><i></i><i></i></span>asana</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="12" y="12" width="36" height="36" rx="6" fill="none" stroke="#111" stroke-width="3"/><path d="M20 30l7 7 14-16" stroke="#F06A6A" stroke-width="4" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Task integrity check</h1><p class="desc">A monday.com team lost 20 tasks that stopped populating. Asana can verify tasks before work disappears.</p><section class="panel"><label>Check<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="check" data-v="sync"><span class="dot"></span>Sync check</button><button type="button" class="radiocard" data-target="check" data-v="full"><span class="dot"></span>Full integrity</button></div><input type="hidden" id="check" value="sync"><label>Missing tasks<input id="missing" type="number" value="20"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><div class="backdrop" id="bd"></div><script>function run(){out.textContent=missing.value>0?`${check.value}: ${missing.value} tasks missing. Asana flags them before the team plans around ghosts.`:`${check.value}: all tasks present.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
