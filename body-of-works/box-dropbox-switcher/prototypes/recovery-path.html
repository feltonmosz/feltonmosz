<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logged-out recovery — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="22" cy="30" r="10" fill="none" stroke="#111" stroke-width="3"/><path d="M30 24l18-12M42 16l4 6" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Logged-out recovery</h1><p class="desc">A Dropbox user was locked out abroad for a month. Box can offer a logged-out recovery path.</p><section class="panel"><label>Situation<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="sit" data-v="abroad"><span class="dot"></span>Locked out abroad</button><button type="button" class="radiocard" data-target="sit" data-v="device"><span class="dot"></span>Lost device</button></div><input type="hidden" id="sit" value="abroad"><label>Days locked out<input id="days" type="number" value="30"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${sit.value}: Box recovery verifies identity without the original device. ${days.value} days becomes hours.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
