<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add-on pricing — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Add-on pricing</h1><p class="desc">Dropbox Sign pricing jumped from $130 to $250 a month. Box can publish add-on prices beside seat price.</p><section class="panel"><label>Add-on<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="addon" data-v="sign"><span class="dot"></span>E-signature</button><button type="button" class="radiocard" data-target="addon" data-v="ai"><span class="dot"></span>AI units</button><button type="button" class="radiocard" data-target="addon" data-v="shield"><span class="dot"></span>Shield</button></div><input type="hidden" id="addon" value="sign"><label>Seats<input id="seats" type="number" value="20"></label><p><button class="btn" onclick="run()">Price add-on</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${addon.value} for ${seats.value} seats: list price printed beside the seat price. No renewal surprise.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
