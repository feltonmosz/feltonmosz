<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encryption story — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Encryption story</h1><p class="desc">Dropbox encryption is a paid-tier story. Box can state encryption plainly at every tier.</p><section class="panel"><label>Tier<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="tier" data-v="business"><span class="dot"></span>Business</button><button type="button" class="radiocard" data-target="tier" data-v="enterprise"><span class="dot"></span>Enterprise</button></div><input type="hidden" id="tier" value="business"><label>Users<input id="users" type="number" value="50"></label><p><button class="btn" onclick="run()">Show encryption</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${tier.value} for ${users.value} users: encryption state printed on the plan page, not buried in sales copy.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
