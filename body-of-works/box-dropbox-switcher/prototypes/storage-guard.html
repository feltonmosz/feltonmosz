<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage guard — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Storage guard</h1><p class="desc">Dropbox files vanished when storage filled. Box can warn before storage eats files.</p><section class="panel"><label>Storage<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="storage" data-v="near"><span class="dot"></span>Near limit</button><button type="button" class="radiocard" data-target="storage" data-v="ok"><span class="dot"></span>Healthy</button></div><input type="hidden" id="storage" value="near"><label>Percent used<input id="pct" type="number" value="96"></label><p><button class="btn" onclick="run()">Check storage</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=pct.value>=90?`${pct.value}% used: Box warns admins and protects files before anything disappears.`:`${pct.value}% used: storage healthy.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
