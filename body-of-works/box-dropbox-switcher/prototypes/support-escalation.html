<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support escalation — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="10" y="14" width="40" height="28" rx="8" fill="none" stroke="#111" stroke-width="3"/><path d="M22 27h16" stroke="#0061D5" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Support escalation</h1><p class="desc">A Dropbox user looped with a chatbot while a folder was exposed. Box can escalate security issues to humans.</p><section class="panel"><label>Issue type<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="issue" data-v="security"><span class="dot"></span>Security exposure</button><button type="button" class="radiocard" data-target="issue" data-v="billing"><span class="dot"></span>Billing</button><button type="button" class="radiocard" data-target="issue" data-v="howto"><span class="dot"></span>How-to</button></div><input type="hidden" id="issue" value="security"><label>Wait minutes<input id="wait" type="number" value="45"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=issue.value==="security"?`Security lane: human owner assigned now, exposure contained first.`:`${issue.value}: routed with a visible clock after ${wait.value} minutes.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
