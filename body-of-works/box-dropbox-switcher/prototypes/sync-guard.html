<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync guard — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M16 22a16 16 0 0 1 26-6M44 38a16 16 0 0 1-26 6" fill="none" stroke="#111" stroke-width="3"/><path d="M42 8v10H32M18 52V42h10" stroke="#0061D5" stroke-width="3" fill="none"/></svg></div><p>PROTOTYPE</p><h1>Sync guard</h1><p class="desc">Dropbox synced files never chosen and folders corrupted. Box can preview sync before it runs.</p><section class="panel"><label>Sync mode<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="mode" data-v="preview"><span class="dot"></span>Preview first</button><button type="button" class="radiocard" data-target="mode" data-v="auto"><span class="dot"></span>Auto sync</button></div><input type="hidden" id="mode" value="preview"><label>Files<input id="files" type="number" value="340"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=mode.value==="preview"?`${files.value} files previewed: Box shows exactly what will sync before anything moves.`:`Auto sync on: ${files.value} files, integrity checked after.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
