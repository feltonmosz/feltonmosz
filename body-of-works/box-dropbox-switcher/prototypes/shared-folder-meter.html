<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared folder meter — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Shared folder meter</h1><p class="desc">Someone else shared files ate a Dropbox user storage. Box can meter shared folders separately.</p><section class="panel"><label>Folder<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="folder" data-v="shared"><span class="dot"></span>Shared with me</button><button type="button" class="radiocard" data-target="folder" data-v="owned"><span class="dot"></span>Owned by me</button></div><input type="hidden" id="folder" value="shared"><label>GB used<input id="gb" type="number" value="80"></label><p><button class="btn" onclick="run()">Meter folder</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=folder.value==="shared"?`${gb.value}GB shared with you: Box meters it separately from your own storage.`:`${gb.value}GB owned: counted against your plan, shown plainly.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
