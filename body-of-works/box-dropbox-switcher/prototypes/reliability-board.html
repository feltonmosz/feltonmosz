<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliability board — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6l16 6v14c0 12-7 20-16 24C21 46 14 38 14 26V12z" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Reliability board</h1><p class="desc">Dropbox was down 46 minutes across every service. Box can publish reliability buyers can check.</p><section class="panel"><label>Window<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="win" data-v="30"><span class="dot"></span>Last 30 days</button><button type="button" class="radiocard" data-target="win" data-v="365"><span class="dot"></span>Last 365 days</button></div><input type="hidden" id="win" value="30"><label>Downtime minutes<input id="down" type="number" value="46"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${win.value} days: ${down.value} minutes downtime shown with status and credit path.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
