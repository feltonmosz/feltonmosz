<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliability board — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Reliability board</h1><p class="desc">Dropbox was down 46 minutes across every service. Box can publish reliability buyers can check.</p><section class="panel"><label>Window<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="win" data-v="30"><span class="dot"></span>Last 30 days</button><button type="button" class="radiocard" data-target="win" data-v="365"><span class="dot"></span>Last 365 days</button></div><input type="hidden" id="win" value="30"><label>Downtime minutes<input id="down" type="number" value="46"></label><p><button class="btn" onclick="run()">Show reliability</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${win.value} days: ${down.value} minutes downtime shown with status and credit path.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
