<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI units meter — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>AI units meter</h1><p class="desc">Dropbox bills AI search as a second product. Box can meter AI units inside the plan.</p><section class="panel"><label>Plan<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="plan" data-v="enterprise"><span class="dot"></span>Enterprise 1,000 units</button><button type="button" class="radiocard" data-target="plan" data-v="plus"><span class="dot"></span>Enterprise Plus</button></div><input type="hidden" id="plan" value="enterprise"><label>Units left<input id="left" type="number" value="240"></label><p><button class="btn" onclick="run()">Check units</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${plan.value}: ${left.value} AI units left, shown before use. No second-product bill.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
