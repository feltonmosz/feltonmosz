<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI units meter — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="8" fill="#0061D5"/><path d="M30 8v10M30 42v10M8 30h10M42 30h10" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>AI units meter</h1><p class="desc">Dropbox bills AI search as a second product. Box can meter AI units inside the plan.</p><section class="panel"><label>Plan<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="plan" data-v="enterprise"><span class="dot"></span>Enterprise 1,000 units</button><button type="button" class="radiocard" data-target="plan" data-v="plus"><span class="dot"></span>Enterprise Plus</button></div><input type="hidden" id="plan" value="enterprise"><label>Units left<input id="left" type="number" value="240"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${plan.value}: ${left.value} AI units left, shown before use. No second-product bill.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
