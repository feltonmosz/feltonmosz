<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trial charge guard — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><rect x="14" y="8" width="32" height="44" rx="4" fill="none" stroke="#111" stroke-width="3"/><path d="M21 22h18M21 32h18" stroke="#0061D5" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Trial charge guard</h1><p class="desc">A Dropbox free trial became a £95.99 annual charge. Box can warn before trials convert.</p><section class="panel"><label>Trial state<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="state" data-v="trial"><span class="dot"></span>Free trial</button><button type="button" class="radiocard" data-target="state" data-v="paid"><span class="dot"></span>Paid plan</button></div><input type="hidden" id="state" value="trial"><label>Days left<input id="days" type="number" value="3"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=state.value==="trial"&&days.value<=7?`Trial ends in ${days.value} days: Box shows the exact charge and a one-tap cancel before conversion.`:`No surprise conversion.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
