<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing ladder — Box prototype</title><link rel="stylesheet" href="style.css?v=2"></head><body><header class="nav"><div class="brand">box</div><div class="navnote">Dropbox switcher prototypes</div></header><main><section class="inside"><h1>Pricing ladder</h1><p class="desc">Dropbox jumps from 2GB free to 2TB paid. Box can show a ladder teams can climb.</p><section class="panel"><label>Team<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="team" data-v="starter"><span class="dot"></span>Business Starter $5</button><button type="button" class="radiocard" data-target="team" data-v="business"><span class="dot"></span>Business $15</button><button type="button" class="radiocard" data-target="team" data-v="plus"><span class="dot"></span>Business Plus $25</button></div><input type="hidden" id="team" value="starter"><label>Users<input id="users" type="number" value="12"></label><p><button class="btn" onclick="run()">Calculate price</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){const price={starter:5,business:15,plus:25}[team.value];out.textContent=`${users.value} users: $${users.value*price}/month on ${team.value}. Ladder shown before signup.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
