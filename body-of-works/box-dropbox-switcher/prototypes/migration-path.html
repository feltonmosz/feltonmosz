<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration path — Box prototype</title><link rel="stylesheet" href="style.css?v=1"></head><body><header class="nav"><div class="brand"><span class="mark">B</span>Box</div></header><main><section class="inside"><div><svg class="rep" viewBox="0 0 60 60" aria-hidden="true"><path d="M14 22h28l-6-6M46 38H18l6 6" fill="none" stroke="#111" stroke-width="3"/></svg></div><p>PROTOTYPE</p><h1>Migration path</h1><p class="desc">Growth is near flat at Dropbox while profit is strong. Box can make migration the growth story.</p><section class="panel"><label>Source<span class="req">*</span></label><div class="radiogroup"><button type="button" class="radiocard selected" data-target="src" data-v="dropbox"><span class="dot"></span>Dropbox</button><button type="button" class="radiocard" data-target="src" data-v="other"><span class="dot"></span>Other storage</button></div><input type="hidden" id="src" value="dropbox"><label>TB to move<input id="tb" type="number" value="4"></label><p><button class="btn" onclick="run()">Submit Request</button></p><div class="out" id="out">Ready.</div></section></section></main><script>function run(){out.textContent=`${src.value}: ${tb.value}TB mapped with permissions and links preserved before import.`}</script><script>document.querySelectorAll(".radiocard").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target).value=b.dataset.v;document.querySelectorAll(`.radiocard[data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle("selected",x===b))});</script></body></html>
