<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Cloud file health — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127g"></head><body><div class="shell"><div class="main"><div class="top"><strong>Creative Cloud Desktop</strong><span class="crumb">Body of Works / Adobe × Figma / Creative Cloud file health</span></div><div class="wrap"><section class="hero"><h1>Creative Cloud file health</h1><p>Large files crawl on client calls. Creative Cloud can score file health before open.</p></section><section class="panel"><h2>Properties</h2><label>Cloud document<input id="doc" value="Client campaign.psd"></label><label>Pages<input id="fhPages" type="number" value="12"></label><label>Frames<input id="fhFrames" type="number" value="420"></label><label>Components<input id="fhComponents" type="number" value="900"></label><div class="meter"><i id="bar" style="width:76%"></i></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){const p=parseFloat(document.getElementById("fhPages").value)||0;const f=parseFloat(document.getElementById("fhFrames").value)||0;const c=parseFloat(document.getElementById("fhComponents").value)||0;const s=Math.max(0,Math.min(100,100-(p*2+f/10+c/20)));bar.style.width=s+"%";out.textContent=`${doc.value}: health ${s.toFixed(0)}/100
Action: split Libraries, defer off-screen rendering, open lightweight preview first.`}</script></body></html>
