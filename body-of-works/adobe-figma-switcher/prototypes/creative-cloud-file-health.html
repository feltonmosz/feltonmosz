<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Cloud file health — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127p"></head><body><div class="shell"><div class="main"><div class="top"><strong>Creative Cloud Desktop</strong><span class="crumb">Body of Works / Adobe × Figma / Creative Cloud file health</span></div><div class="wrap"><section class="hero"><h1>Creative Cloud file health</h1><p>Large files crawl on client calls. Creative Cloud can score file health before open.</p></section><section class="panel"><h2>Properties</h2><label>File preset</label><button type="button" class="sheetbtn" id="presetBtn">Client campaign</button><div class="backdrop" id="bd"></div><div class="sheet" id="sheet"><h3>File preset</h3><button data-p="12,420,900" class="selected">Client campaign</button><button data-p="1,10,5">Light file</button><button data-p="30,900,1800">Heavy system file</button></div><label>Cloud document<input id="doc" value="Client campaign.psd"></label><label>Pages<input id="fhPages" type="number" value="12"></label><label>Frames<input id="fhFrames" type="number" value="420"></label><label>Components<input id="fhComponents" type="number" value="900"></label><div class="meter"><i id="bar" style="width:76%"></i></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){const p=parseFloat(document.getElementById("fhPages").value)||0;const f=parseFloat(document.getElementById("fhFrames").value)||0;const c=parseFloat(document.getElementById("fhComponents").value)||0;const s=Math.max(0,Math.min(100,100-(p*2+f/10+c/20)));bar.style.width=s+"%";const a=s>=80?"Ready for client call.":s>=50?"Review heavy frames before sharing.":"Split Libraries and defer off-screen rendering before opening.";out.textContent=`${doc.value}: health ${s.toFixed(0)}/100
Action: ${a}`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><script>presetBtn.onclick=()=>{sheet.style.top=Math.max(12,Math.min(presetBtn.getBoundingClientRect().bottom+8,innerHeight-360))+"px";bd.classList.add("open");sheet.classList.add("open")};bd.onclick=()=>{bd.classList.remove("open");sheet.classList.remove("open")};sheet.querySelectorAll("button").forEach(b=>b.onclick=()=>{const v=b.dataset.p.split(",");fhPages.value=v[0];fhFrames.value=v[1];fhComponents.value=v[2];presetBtn.textContent=b.textContent;presetBtn.classList.remove("swap");void presetBtn.offsetWidth;presetBtn.classList.add("swap");sheet.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.click();run()});</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script></body></html>
