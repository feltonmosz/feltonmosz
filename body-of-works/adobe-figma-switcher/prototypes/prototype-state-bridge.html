<!doctype html><html><head><meta charset="utf-8"><title>Prototype state bridge</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Prototype state bridge</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>Advanced flows hit walls when preview state is not exposed back to the editor.</p></section><section><h2>Prototype</h2><p>Inputs: trigger element, target element, state. Output: cross-frame reaction spec.</p><label>Trigger<input id="trigger" value="menu button"></label><label>Target<input id="target" value="panel"></label><label>State<input id="state" value="open"></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=`When ${trigger.value} changes, set ${target.value} to ${state.value}. Prototype state exposed to plugin API.`}</script></body></html>
