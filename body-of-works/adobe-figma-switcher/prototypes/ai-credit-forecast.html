<!doctype html><html><head><meta charset="utf-8"><title>AI credit forecast</title><link rel="stylesheet" href="style.css"></head><body><header><h1>AI credit forecast</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>AI credits are metered without per-action price, so teams cannot forecast burn.</p></section><section><h2>Prototype</h2><p>Inputs: actions, credits per action, seats. Output: monthly burn forecast.</p><label>Actions<input id="actions" type="number" value="120"></label><label>Credits/action<input id="credits" type="number" value="25"></label><label>Seats<input id="seats" type="number" value="5"></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){const burn=+actions.value*+credits.value;out.textContent=`Monthly burn: ${burn} credits\nPer seat: ${(burn/+seats.value).toFixed(1)}\nFix: show cost before generation.`}</script></body></html>
