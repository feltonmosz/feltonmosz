<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Libraries change digest — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127f"></head><body><div class="shell"><div class="main"><div class="top"><strong>Creative Cloud Libraries</strong><span class="crumb">Body of Works / Adobe × Figma / Libraries change digest</span></div><div class="wrap"><section class="hero"><h1>Libraries change digest</h1><p>Mid-sprint changes are missed. Libraries can push visual digests to watchers.</p></section><section class="panel"><h2>Properties</h2><label>Library<input id="lib" value="Checkout UI"></label><label>Changed asset<input id="asset" value="payment button"></label><label>Watcher<select id="watcher"><option>QA</option><option>Developer</option><option>Designer</option></select></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`Digest to ${watcher.value}: ${lib.value} changed — ${asset.value}. Visual diff, owner, time and affected files included.`}</script></body></html>
