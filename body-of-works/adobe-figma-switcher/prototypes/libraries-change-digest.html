<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Libraries change digest — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127o"></head><body><div class="shell"><div class="main"><div class="top"><strong>Creative Cloud Libraries</strong><span class="crumb">Body of Works / Adobe × Figma / Libraries change digest</span></div><div class="wrap"><section class="hero"><h1>Libraries change digest</h1><p>Mid-sprint changes are missed. Libraries can push visual digests to watchers.</p></section><section class="panel"><h2>Properties</h2><label>Library<input id="lib" value="Checkout UI"></label><label>Changed asset<input id="asset" value="payment button"></label><label>Watcher</label><button type="button" class="sheetbtn" data-target="watcher">QA</button><input type="hidden" id="watcher" value="QA"><div class="sheet" data-sheet="watcher"><h3>Watcher</h3><button data-v="QA" class="selected">QA</button><button data-v="Developer" class="">Developer</button><button data-v="Designer" class="">Designer</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`Digest to ${watcher.value}: ${lib.value} changed — ${asset.value}. Visual diff, owner, time and affected files included.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.style.top=(btn.getBoundingClientRect().bottom+8)+"px";bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script></body></html>
