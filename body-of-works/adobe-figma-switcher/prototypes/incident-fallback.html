<!doctype html><html><head><meta charset="utf-8"><title>Incident fallback</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Incident fallback</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>Incidents hit core work when cloud components fail.</p></section><section><h2>Prototype</h2><p>Inputs: affected component, local copy. Output: fallback mode.</p><label>Component<input id="component" value="Dev Mode"></label><label>Local copy<select id="local"><option>yes</option><option>no</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=local.value==="yes"?`Fallback: edit/export locally while ${component.value} is degraded.`:"No local copy. Create offline fallback before incident."}</script></body></html>
