<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange plugin badge — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127f"></head><body><div class="shell"><div class="main"><div class="top"><strong>Adobe Exchange</strong><span class="crumb">Body of Works / Adobe × Figma / Exchange plugin badge</span></div><div class="wrap"><section class="hero"><h1>Exchange plugin badge</h1><p>Plugin workflows need trust signals. Exchange can badge maintenance, permissions and replacement candidates.</p></section><section class="panel"><h2>Properties</h2><label>Plugin<input id="plugin" value="Icon batch exporter"></label><label>Installs<input id="installs" type="number" value="5000"></label><label>Maintained<select id="maintained"><option>yes</option><option>no</option></select></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=maintained.value==="yes"&&installs.value>1000?`${plugin.value}: trusted badge. First-party replacement candidate.`:`${plugin.value}: review permissions and maintenance.`}</script></body></html>
