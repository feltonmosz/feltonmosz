<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange plugin badge — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127m"></head><body><div class="shell"><div class="main"><div class="top"><strong>Adobe Exchange</strong><span class="crumb">Body of Works / Adobe × Figma / Exchange plugin badge</span></div><div class="wrap"><section class="hero"><h1>Exchange plugin badge</h1><p>Plugin workflows need trust signals. Exchange can badge maintenance, permissions and replacement candidates.</p></section><section class="panel"><h2>Properties</h2><label>Plugin<input id="plugin" value="Icon batch exporter"></label><label>Installs<input id="installs" type="number" value="5000"></label><label>Maintained</label><button type="button" class="sheetbtn" data-target="maintained">yes</button><input type="hidden" id="maintained" value="yes"><div class="sheet" data-sheet="maintained"><h3>Maintained</h3><button data-v="yes" class="selected">yes</button><button data-v="no" class="">no</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=maintained.value==="yes"&&installs.value>1000?`${plugin.value}: trusted badge. First-party replacement candidate.`:`${plugin.value}: review permissions and maintenance.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
