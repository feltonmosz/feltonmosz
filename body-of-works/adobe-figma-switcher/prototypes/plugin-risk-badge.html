<!doctype html><html><head><meta charset="utf-8"><title>Plugin risk badge</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Plugin risk badge</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>Core workflows depend on third-party plugins with uneven quality.</p></section><section><h2>Prototype</h2><p>Inputs: plugin installs, maintained, permissions. Output: risk badge.</p><label>Installs<input id="installs" type="number" value="5000"></label><label>Maintained<select id="maintained"><option>yes</option><option>no</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=(maintained.value==="yes"&&+installs.value>1000)?"Badge: trusted, first-party replacement candidate.":"Badge: risk — permissions and maintenance need review."}</script></body></html>
