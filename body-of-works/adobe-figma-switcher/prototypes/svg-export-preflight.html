<!doctype html><html><head><meta charset="utf-8"><title>SVG export preflight</title><link rel="stylesheet" href="style.css"></head><body><header><h1>SVG export preflight</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>SVG exports can drop fills, gain pixels and bloat past limits.</p></section><section><h2>Prototype</h2><p>Inputs: file size KB, has image fill, subpixel. Output: export warnings.</p><label>Size KB<input id="size" type="number" value="800"></label><label>Image fill<select id="fill"><option>yes</option><option>no</option></select></label><label>Sub-pixel<select id="subpixel"><option>yes</option><option>no</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){let w=[];if(+size.value>100)w.push("over 100KB");if(fill.value==="yes")w.push("check image fill pattern");if(subpixel.value==="yes")w.push("sub-pixel bounds");out.textContent=w.length?("Warnings: "+w.join(", ")):"Export clean."}</script></body></html>
