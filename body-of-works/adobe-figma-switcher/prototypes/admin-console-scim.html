<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console SCIM fix — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127q"></head><body><div class="shell"><div class="main"><div class="top"><strong>Admin Console Identity</strong><span class="crumb">Body of Works / Adobe × Figma / Admin Console SCIM fix</span></div><div class="wrap"><section class="hero"><h1>Admin Console SCIM fix</h1><p>Identity automation should provision admin rights cleanly. Admin Console can close the manual gap.</p></section><section class="panel"><h2>Properties</h2><label>User<input id="user" value="design.ops"></label><label>Directory</label><button type="button" class="sheetbtn" data-target="dir">Azure</button><input type="hidden" id="dir" value="Azure"><div class="sheet" data-sheet="dir"><h3>Directory</h3><button data-v="Azure" class="selected">Azure</button><button data-v="Okta" class="">Okta</button><button data-v="Google" class="">Google</button></div><label>Admin privilege</label><button type="button" class="sheetbtn" data-target="admin">enabled</button><input type="hidden" id="admin" value="enabled"><div class="sheet" data-sheet="admin"><h3>Admin privilege</h3><button data-v="enabled" class="selected">enabled</button><button data-v="disabled" class="">disabled</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`${dir.value} sync: ${user.value} provisioned. SSO on. SCIM admin attribute ${admin.value}. Product profile assigned.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script></body></html>
