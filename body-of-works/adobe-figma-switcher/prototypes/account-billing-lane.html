<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account billing lane — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127j"></head><body><div class="shell"><div class="main"><div class="top"><strong>Adobe Account</strong><span class="crumb">Body of Works / Adobe × Figma / Account billing lane</span></div><div class="wrap"><section class="hero"><h1>Account billing lane</h1><p>Billing trust dies when fees feel hidden. Adobe Account can show exact fee, owner and status in one lane.</p></section><section class="panel"><h2>Properties</h2><label>Plan<select id="plan"><option>Creative Cloud Pro</option><option>Photoshop</option><option>Acrobat Pro</option></select></label><label>Months left<input id="months" type="number" value="5"></label><label>Monthly price<input id="price" type="number" value="69.99"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`${plan.value}: exact early termination fee $${(months.value*price.value*.5).toFixed(2)}\nOne-screen cancel. Case owner assigned. Audit trail visible.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script></body></html>
