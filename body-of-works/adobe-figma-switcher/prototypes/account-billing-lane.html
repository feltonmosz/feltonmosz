<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account billing lane — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127o"></head><body><div class="shell"><div class="main"><div class="top"><strong>Adobe Account</strong><span class="crumb">Body of Works / Adobe × Figma / Account billing lane</span></div><div class="wrap"><section class="hero"><h1>Account billing lane</h1><p>Billing trust dies when fees feel hidden. Adobe Account can show exact fee, owner and status in one lane.</p></section><section class="panel"><h2>Properties</h2><label>Plan</label><button type="button" class="sheetbtn" data-target="plan">Creative Cloud Pro</button><input type="hidden" id="plan" value="Creative Cloud Pro"><div class="sheet" data-sheet="plan"><h3>Plan</h3><button data-v="Creative Cloud Pro" class="selected">Creative Cloud Pro</button><button data-v="Photoshop" class="">Photoshop</button><button data-v="Acrobat Pro" class="">Acrobat Pro</button></div><label>Months left<input id="months" type="number" value="5"></label><label>Monthly price<input id="price" type="number" value="69.99"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`${plan.value}: exact early termination fee $${(months.value*price.value*.5).toFixed(2)}\nOne-screen cancel. Case owner assigned. Audit trail visible.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{sh.style.top=(btn.getBoundingClientRect().bottom+8)+"px";bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script></body></html>
