<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline desktop sync — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127h"></head><body><div class="shell"><div class="main"><div class="top"><strong>Creative Cloud Files</strong><span class="crumb">Body of Works / Adobe × Figma / Offline desktop sync</span></div><div class="wrap"><section class="hero"><h1>Offline desktop sync</h1><p>Cloud-first work dies on weak Wi-Fi. Adobe desktop apps keep editing and sync safely later.</p></section><section class="panel"><h2>Properties</h2><label>Local copy<select id="local"><option>yes</option><option>no</option></select></label><label>Pending changes<input id="pending" type="number" value="4"></label><label>Last sync minutes<input id="sync" type="number" value="12"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=local.value==="yes"?`Offline ready. ${pending.value} changes queued. Last sync ${sync.value} min ago.`:"Not ready. Download local copy before travel."}</script></body></html>
