<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop incident fallback — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127e"></head><body><div class="shell"><div class="main"><div class="top"><strong>Premiere / Desktop fallback</strong><span class="crumb">Body of Works / Adobe × Figma / Desktop incident fallback</span></div><div class="wrap"><section class="hero"><div class="kicker">Spectrum prototype</div><h1>Desktop incident fallback</h1><p>Cloud incidents stop core work. Adobe desktop apps keep editing and export alive.</p></section><section class="panel"><h2>Properties</h2><label>Affected service<input id="svc" value="cloud documents"></label><label>Local project<select id="local"><option>yes</option><option>no</option></select></label><label>Deadline hours<input id="hours" type="number" value="6"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=local.value==="yes"?`Fallback active for ${hours.value}h deadline: edit/export locally while ${svc.value} is degraded.`:"Create local project copy now."}</script></body></html>
