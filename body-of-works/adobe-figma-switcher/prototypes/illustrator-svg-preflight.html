<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrator SVG preflight — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127k"></head><body><div class="shell"><div class="main"><div class="top"><strong>Illustrator Export</strong><span class="crumb">Body of Works / Adobe × Figma / Illustrator SVG preflight</span></div><div class="wrap"><section class="hero"><h1>Illustrator SVG preflight</h1><p>Exports fail at delivery when fills drop or files bloat. Illustrator preflight catches it before handoff.</p></section><section class="panel"><h2>Properties</h2><label>Artboard<input id="art" value="Banner 728x90"></label><label>Size KB<input id="size" type="number" value="800"></label><label>Image fill<select id="fill"><option>yes</option><option>no</option></select></label><label>Sub-pixel bounds<select id="sub"><option>yes</option><option>no</option></select></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){let w=[];if(size.value>100)w.push("over 100KB");if(fill.value==="yes")w.push("render-check image fill");if(sub.value==="yes")w.push("fix sub-pixel bounds");out.textContent=w.length?`${art.value} warnings: ${w.join(", ")}`:`${art.value} export clean.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script></body></html>
