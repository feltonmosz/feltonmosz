<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XD state bridge — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127q"></head><body><div class="shell"><div class="main"><div class="top"><strong>Illustrator / XD migration</strong><span class="crumb">Body of Works / Adobe × Figma / XD state bridge</span></div><div class="wrap"><section class="hero"><h1>XD state bridge</h1><p>Prototype state hidden from plugins blocks advanced flows. Adobe can expose state as a migration bridge.</p></section><section class="panel"><h2>Properties</h2><label>Trigger<input id="trigger" value="menu button"></label><label>Target<input id="target" value="panel"></label><label>State</label><button type="button" class="sheetbtn" data-target="state">open</button><input type="hidden" id="state" value="open"><div class="sheet" data-sheet="state"><h3>State</h3><button data-v="open" class="selected">open</button><button data-v="closed">closed</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`Bridge: ${trigger.value} -> ${target.value} = ${state.value}\nPlugin API receives preview state.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><script>document.querySelectorAll(".sheet").forEach(s=>document.body.appendChild(s));const _bd=document.getElementById("bd");if(_bd)document.body.appendChild(_bd);</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);btn.onclick=()=>{sh.classList.add("open");sh.style.top=Math.max(12,Math.min(btn.getBoundingClientRect().bottom+8,innerHeight-sh.offsetHeight-12))+"px";bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(btn.dataset.target).value=b.dataset.v;btn.textContent=b.textContent;sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
