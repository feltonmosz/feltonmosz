<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XD state bridge — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127m"></head><body><div class="shell"><div class="main"><div class="top"><strong>Illustrator / XD migration</strong><span class="crumb">Body of Works / Adobe × Figma / XD state bridge</span></div><div class="wrap"><section class="hero"><h1>XD state bridge</h1><p>Prototype state hidden from plugins blocks advanced flows. Adobe can expose state as a migration bridge.</p></section><section class="panel"><h2>Properties</h2><label>Trigger<input id="trigger" value="menu button"></label><label>Target<input id="target" value="panel"></label><label>State<input id="state" value="open"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`Bridge: ${trigger.value} -> ${target.value} = ${state.value}\nPlugin API receives preview state.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script></body></html>
