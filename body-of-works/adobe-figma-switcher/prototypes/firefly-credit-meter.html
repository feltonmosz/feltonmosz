<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firefly credit meter — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127e"></head><body><div class="shell"><div class="main"><div class="top"><strong>Photoshop Firefly</strong><span class="crumb">Body of Works / Adobe × Figma / Firefly credit meter</span></div><div class="wrap"><section class="hero"><div class="kicker">Spectrum prototype</div><h1>Firefly credit meter</h1><p>AI credits burn without clear per-action cost. Photoshop can show Firefly cost before Generate.</p></section><section class="panel"><h2>Properties</h2><label>Model<select id="model"><option value="1">Firefly standard — 1 credit</option><option value="10">Firefly Image 5 — 10 credits</option><option value="40">Partner model — 40 credits</option></select></label><label>Generations<input id="gens" type="number" value="120"></label><label>Plan credits<input id="plan" type="number" value="4000"></label><div class="meter"><i id="bar" style="width:76%"></i></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){const b=gens.value*model.value;bar.style.width=Math.min(100,b/plan.value*100)+"%";out.textContent=`Cost before Generate: ${model.value} credits\nMonthly burn: ${b}\nRemaining: ${plan.value-b}`}</script></body></html>
