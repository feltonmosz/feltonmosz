<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adobe vs Figma flip board — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127m"></head><body><div class="shell"><div class="main"><div class="top"><strong>Competitor matrix</strong><span class="crumb">Body of Works / Adobe × Figma / Adobe vs Figma flip board</span></div><div class="wrap"><section class="hero"><h1>Adobe vs Figma flip board</h1><p>Plain why for each matrix domain, with the Adobe fix that flips it.</p></section><section class="panel"><h2>Properties</h2><label>Domain</label><button type="button" class="sheetbtn" data-target="domain">Real-time collaboration</button><input type="hidden" id="domain" value="collab"><div class="sheet" data-sheet="domain"><h3>Domain</h3><button data-v="collab" class="selected">Real-time collaboration</button><button data-v="cost" class="">Total cost</button><button data-v="billing" class="">Billing trust</button><button data-v="perf" class="">Performance</button><button data-v="offline" class="">Offline work</button><button data-v="handoff" class="">Developer handoff</button><button data-v="ai" class="">AI features and rights</button><button data-v="admin" class="">Enterprise administration</button><button data-v="export" class="">Export fidelity</button><button data-v="support" class="">Support access</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){const d={collab:"Figma wins: link sharing feels instant. Adobe flip: presence, locking, Libraries that never hide assets.",cost:"Figma wins small teams; Adobe wins breadth. Flip: all-in annual totals before checkout.",billing:"Figma wins by not being Adobe. Flip: exact fee and one-screen cancel.",perf:"Neither wins heavy files. Flip: Creative Cloud file-health budget.",offline:"Adobe wins desktop. Flip: offline readiness per file.",handoff:"Figma wins with toll booth. Flip: free inspect in Share for Review.",ai:"Adobe rights stronger; Figma metering opaque. Flip: Firefly cost before Generate.",admin:"Adobe depth wins. Flip: name exact access blocker.",export:"Both scarred. Flip: export preflight.",support:"Neither wins billing. Flip: human billing lane."};out.textContent=d[domain.value]}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
