<!doctype html><html><head><meta charset="utf-8"><title>SCIM admin fix</title><link rel="stylesheet" href="style.css"></head><body><header><h1>SCIM admin fix</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>SCIM cannot provision admin privileges, leaving manual IT work.</p></section><section><h2>Prototype</h2><p>Inputs: user role, SSO, SCIM. Output: provisioning result.</p><label>User<input id="user" value="design.ops"></label><label>Admin attribute<select id="admin"><option>enabled</option><option>disabled</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=`Provision ${user.value} with admin attribute: ${admin.value}. SSO and basic SCIM included before top tier.`}</script></body></html>
