<!doctype html><html><head><meta charset="utf-8"><title>Billing fast lane</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Billing fast lane</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>Billing issues wait too long and damage trust.</p></section><section><h2>Prototype</h2><p>Inputs: issue type, severity. Output: response target and owner.</p><label>Issue<input id="issue" value="seat charge"></label><label>Severity<select id="severity"><option>high</option><option>normal</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=`${issue.value} / ${severity.value}: first response target 4h, one case owner, audit trail visible.`}</script></body></html>
