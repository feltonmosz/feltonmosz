<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share for Review inspect — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127i"></head><body><div class="shell"><div class="main"><div class="top"><strong>Acrobat Share for Review</strong><span class="crumb">Body of Works / Adobe × Figma / Share for Review inspect</span></div><div class="wrap"><section class="hero"><h1>Share for Review inspect</h1><p>Developers should not pay just to inspect specs. Adobe review can make inspect free and sell workflow depth.</p></section><section class="panel"><h2>Properties</h2><label>Viewer role<select id="role"><option>developer viewer</option><option>paid workflow seat</option></select></label><label>Needs<select id="needs"><option>measurements + code</option><option>ready-for-dev tracking</option></select></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=role.value.includes("viewer")?`Free inspect enabled for ${needs.value}: measurements, tokens, code, assets.`:`Paid workflow enabled for ${needs.value}: ready-for-dev, change tracking, codegen depth.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script></body></html>
