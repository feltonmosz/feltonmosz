<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share for Review inspect — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127m"></head><body><div class="shell"><div class="main"><div class="top"><strong>Acrobat Share for Review</strong><span class="crumb">Body of Works / Adobe × Figma / Share for Review inspect</span></div><div class="wrap"><section class="hero"><h1>Share for Review inspect</h1><p>Developers should not pay just to inspect specs. Adobe review can make inspect free and sell workflow depth.</p></section><section class="panel"><h2>Properties</h2><label>Viewer role</label><button type="button" class="sheetbtn" data-target="role">developer viewer</button><input type="hidden" id="role" value="developer viewer"><div class="sheet" data-sheet="role"><h3>Viewer role</h3><button data-v="developer viewer" class="selected">developer viewer</button><button data-v="paid workflow seat" class="">paid workflow seat</button></div><label>Needs</label><button type="button" class="sheetbtn" data-target="needs">measurements + code</button><input type="hidden" id="needs" value="measurements + code"><div class="sheet" data-sheet="needs"><h3>Needs</h3><button data-v="measurements + code" class="selected">measurements + code</button><button data-v="ready-for-dev tracking" class="">ready-for-dev tracking</button></div><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=role.value.includes("viewer")?`Free inspect enabled for ${needs.value}: measurements, tokens, code, assets.`:`Paid workflow enabled for ${needs.value}: ready-for-dev, change tracking, codegen depth.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><div class="backdrop" id="bd"></div><script>document.querySelectorAll(".sheetbtn").forEach(btn=>{const sh=document.querySelector(`[data-sheet="${btn.dataset.target}"]`);if(!sh)return;btn.onclick=()=>{bd.classList.add("open");sh.classList.add("open")};sh.querySelectorAll("button").forEach(b=>b.onclick=()=>{const inp=document.getElementById(btn.dataset.target);inp.value=b.dataset.v;btn.textContent=b.textContent;btn.classList.remove("swap");void btn.offsetWidth;btn.classList.add("swap");sh.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.classList.remove("open");sh.classList.remove("open")})});bd.onclick=()=>{bd.classList.remove("open");document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"))};</script></body></html>
