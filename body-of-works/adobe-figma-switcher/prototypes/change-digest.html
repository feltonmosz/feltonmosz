<!doctype html><html><head><meta charset="utf-8"><title>Change digest</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Change digest</h1><p>Adobe × Figma switcher prototype</p></header><main><section><h2>Why this is the case</h2><p>Design changes mid-sprint are missed by QA and developers.</p></section><section><h2>Prototype</h2><p>Inputs: file, changed area, watcher role. Output: digest message.</p><label>File<input id="file" value="Checkout flow"></label><label>Changed area<input id="area" value="payment step"></label><label>Watcher<select id="watcher"><option>QA</option><option>Developer</option></select></label><button onclick="run()">Run prototype</button><div class="out" id="out">Result appears here.</div></section><p><a href="index.html">Back to prototypes</a></p></main><script>function run(){out.textContent=`Digest for ${watcher.value}: ${file.value} changed in ${area.value}. Visual diff attached.`}</script></body></html>
