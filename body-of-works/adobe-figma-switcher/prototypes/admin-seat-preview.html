<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console seat preview — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127l"></head><body><div class="shell"><div class="main"><div class="top"><strong>Admin Console</strong><span class="crumb">Body of Works / Adobe × Figma / Admin Console seat preview</span></div><div class="wrap"><section class="hero"><h1>Admin Console seat preview</h1><p>Figma mid-term seats create separate monthly charges. Adobe Admin Console can preview the exact charge before approval.</p></section><section class="panel"><h2>Properties</h2><label>Product profile</label><button type="button" class="sheetbtn" id="profileBtn">Creative Cloud Pro</button><input type="hidden" id="profile" value="Creative Cloud Pro"><div class="backdrop" id="bd"></div><div class="sheet" id="sheet"><h3>Product profile</h3><button data-v="Creative Cloud Pro" class="selected">Creative Cloud Pro</button><button data-v="Photoshop">Photoshop</button><button data-v="Acrobat Pro">Acrobat Pro</button></div><label>Seats added<input id="seats" type="number" value="3"></label><label>Monthly price<input id="price" type="number" value="69.99"></label><label>Months remaining<input id="months" type="number" value="7"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`${profile.value}: ${seats.value} seats\nSeparate monthly charge: $${(seats.value*price.value).toFixed(2)}\nRemaining term: $${(seats.value*price.value*months.value).toFixed(2)}\nApproval blocked until admin confirms.`}</script><script>document.querySelectorAll(".card,.panel,.hero").forEach(e=>e.classList.add("reveal"));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e));</script><script>profileBtn.onclick=()=>{bd.classList.add("open");sheet.classList.add("open")};bd.onclick=()=>{bd.classList.remove("open");sheet.classList.remove("open")};sheet.querySelectorAll("button").forEach(b=>b.onclick=()=>{profile.value=b.dataset.v;profileBtn.textContent=b.dataset.v;profileBtn.classList.remove("swap");void profileBtn.offsetWidth;profileBtn.classList.add("swap");sheet.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));bd.click()});</script></body></html>
