<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console seat preview — Adobe prototype</title><link rel="stylesheet" href="style.css?v=20261127h"></head><body><div class="shell"><div class="main"><div class="top"><strong>Admin Console</strong><span class="crumb">Body of Works / Adobe × Figma / Admin Console seat preview</span></div><div class="wrap"><section class="hero"><h1>Admin Console seat preview</h1><p>Figma mid-term seats create separate monthly charges. Adobe Admin Console can preview the exact charge before approval.</p></section><section class="panel"><h2>Properties</h2><label>Product profile<select id="profile"><option>Creative Cloud Pro</option><option>Photoshop</option><option>Acrobat Pro</option></select></label><label>Seats added<input id="seats" type="number" value="3"></label><label>Monthly price<input id="price" type="number" value="69.99"></label><label>Months remaining<input id="months" type="number" value="7"></label><p><button class="btn red" onclick="run()">Run prototype</button> <a class="btn ghost" href="index.html">All prototypes</a></p><div class="out" id="out">Ready.</div></section></div></div></div><script>function run(){out.textContent=`${profile.value}: ${seats.value} seats\nSeparate monthly charge: $${(seats.value*price.value).toFixed(2)}\nRemaining term: $${(seats.value*price.value*months.value).toFixed(2)}\nApproval blocked until admin confirms.`}</script></body></html>
