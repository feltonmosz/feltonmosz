<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body of Works</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#fff;color:#111827;text-align:center}h1{font-size:34px;margin:34px 20px 10px}.sub{color:#374151;margin:0 24px 24px;line-height:1.45}h2{font-size:26px;margin:0 0 18px}.hero{height:300px;background:#F3F4F6;display:grid;place-items:center;overflow:hidden}.logo{grid-area:1/1;width:190px;height:190px;opacity:0;transform:scale(.96);transition:opacity .35s ease,transform .35s ease;pointer-events:none}.logo.active{opacity:1;transform:scale(1)}.logo svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18))}.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.card{flex:0 0 62%;scroll-snap-align:center;border:1px solid #D1D5DB;border-radius:8px;padding:18px;text-align:left;color:#111827;text-decoration:none;background:#fff;transition:border-color .25s ease,background .25s ease}.card.selected{border-color:#111827;background:#F9FAFB}.card strong{display:block;font-size:20px;margin-bottom:6px}.card span{color:#4B5563;line-height:1.4}@media(min-width:760px){.card{flex-basis:28%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><h1>Body of Works</h1><p class="sub">Select a body of work. The monogram switches seamlessly, then it opens.</p><h2>Select a Work</h2><a class="hero" id="hero" href="competitor-switcher-sprint/index.html" aria-label="Open selected work"><div class="logo active" data-logo="0"><svg viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#111827"/><path d="M28 44h52l-10-10M92 76H40l10 10" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="106" text-anchor="middle" font-size=" sList.toggle('selected',x===c));logos.forEach(x=>x.classList.toggle('active',x.dataset.logo===i));hero.href=c.href;c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});setTimeout(()=>location.href=c.href,380)}))</script></body></html>
